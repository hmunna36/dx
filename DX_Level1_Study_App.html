{n:3, title:"Data Types and Analysis Methods", complexity:"High", blocks:[
  {type:"p", text:"Population vs Sample: Population = the group of interest you want to know about (e.g. all adult males in South Korea). Sample = a group extracted from the population for study (e.g. one thousand adults)."},
  {type:"h", text:"Parameter vs Statistic"},
  {type:"table", headers:["Measure","Parameter (population)","Statistic (sample)"], rows:[
    ["Average","μ","X̄"],
    ["Variance","σ²","s²"],
    ["Standard deviation","σ","s"]
  ]},
  {type:"h", text:"Four sampling methods"},
  {type:"table", headers:["Method","Definition"], rows:[
    ["Simple Random Sampling","Each individual in the entire population has an equal chance of being selected"],
    ["Stratified Random Sampling","Divide the population into several groups, then randomly sample from each group"],
    ["Systematic Sampling","Sampling at regular intervals of time or space (e.g. one out of every hundred items on a line; extracting data every Monday)"],
    ["Cluster Sampling","Divide data into clusters, select a random cluster, conduct a complete or random survey within it"]
  ]},
  {type:"h", text:"Eight data quality criteria"},
  {type:"table", headers:["Criterion","Definition"], rows:[
    ["Validity","Must contain the information you want to know; data items must sufficiently reflect the concept (Concept = Σ data items)"],
    ["Timeliness","Data should be obtainable when needed; excessive delay is not ideal"],
    ["Consistency","Meaning and criteria of the data are consistent regardless of time and space; criteria, unit, measurement method must be the same"],
    ["Representativeness","The collected sample should represent the population"],
    ["Accuracy","Data should be close to the true values"],
    ["Precision","Regardless of who measures or collects, and no matter how many repetitions, the values should be the same"],
    ["Completeness","The range of data is appropriate and there are no missing values or outliers"],
    ["Sufficiency","A sufficient amount of data is ensured"]
  ]},
  {type:"h", text:"Representativeness case study"},
  {type:"p", text:"Literary Digest (1936) mailed 10 million, surveyed 2.36 million, predicted Republican Landon would win — surveyed only the affluent class. Gallup surveyed 1,500 people using stratified sampling across the entire US and correctly predicted Roosevelt at 56%; Roosevelt actually won with 62%. Lesson: for a sample to represent a population you need ① a sufficient amount of data and ② evenness without bias. Bias beats size."},
  {type:"h", text:"Sufficiency detail"},
  {type:"ul", items:[
    "As data size increases, sampling error decreases while non-sampling error increases.",
    "Dimension = number of variables; 10 data in 1 dimension → 100 in 2D → 1000 in 3D.",
    "For rare categories (e.g. a 0.1% complaint rate), even 1,000 customers may yield almost no complaint data — size the data to the analysis intent."
  ]},
  {type:"p", text:"Accuracy vs Precision (commonly confused — expect a question): Accuracy = closeness to the true value. Precision = repeatability/consistency regardless of who measures."},
  {type:"p", text:"Data Quality Report contents: data type, data size, number of missing values, number of outliers, consistency (quality check block); average, mode, median, standard deviation (summary block)."},
  {type:"h", text:"Data types"},
  {type:"table", headers:["Class","Type","Definition","Examples"], rows:[
    ["Discrete","Nominal","Simple categorical; cannot convey order or differences","Men/Women, Material 1/2/3, number of defects"],
    ["Discrete","Ordinal","Grade categorical; indicates order but does not define differences","Gold/Silver/Bronze, High/Middle/Low, Satisfied/Neutral/Unsatisfied"],
    ["Continuous","Interval","Divided into intervals, no absolute zero point, infinitely subdividable","Temperature, productivity/process capability index"],
    ["Continuous","Ratio","Has an origin at 0; measures like length or volume","8m is twice 4m; 1 inch = 2.54cm"]
  ]},
  {type:"p", text:"Variables: Y = f(X). Y = Dependent / Response / Outcome variable. X = Independent / Explanatory / Predictor variable. In Y = 2X + 3, the 2 is the coefficient and the 3 is the constant. Attributes of interest are variables; constants are rarely the focus."},
  {type:"h", text:"Four analysis methods — memorize the order and purpose"},
  {type:"table", headers:["Stage","Name","Purpose"], rows:[
    ["DDA","Descriptive Data Analysis","Foundational analysis; confirm the current state (result) by summarizing/aggregating the given data"],
    ["EDA","Exploratory Data Analysis","Observe and understand collected data from various perspectives to discover new patterns or hypotheses"],
    ["CDA","Confirmatory Data Analysis","Analysis for decision-making; formulate hypotheses and verify their truth"],
    ["PDA","Predictive Data Analysis","Predict the value you want to confirm through the verified hypothesis"]
  ]},
  {type:"p", text:"Objective principle stated repeatedly in the deck: an assignment concludes not merely at the designated time but upon achieving its objectives; not every assignment requires a predictive model, so the procedure varies by objective. Exit points: DDA → assignment finished; EDA → derive insight; CDA → make decision; PDA → innovation in workplace."},
  {type:"h", text:"DDA — Descriptive Data Analysis"},
  {type:"p", text:"Purpose: what we want to know is a variable; variables are expressed through patterns and probabilities → Shape, Central tendency, Dispersion. Analogy: any circle can be drawn if you know its center point and radius; any data can be depicted if you know its central tendency and dispersion."},
  {type:"table", headers:["Measure","Rule","Applies to","Outliers"], rows:[
    ["Average (Arithmetic Mean)","X̄ = (1/n)Σxᵢ — sum of observed data ÷ number of observations","Continuous data","Significantly influenced"],
    ["Median","Value in the middle when sorted ascending; the (N+1)/2-th value","Ordinal, continuous data","Not significantly influenced"],
    ["Mode","Value with the highest frequency","Continuous and discrete data","Used as a supplementary measure; may not exist or may not be unique"]
  ]},
  {type:"p", text:"Median worked examples from the deck: N odd → 2,3,4,5,6,7,7,8,9 → median = 6. N even → 2,3,4,5,6,7,7,8,9,9 → median = 6.5."},
  {type:"p", text:"“Flaw of Average”: would you cross a river with an average depth of 1 meter? Actual depths 0.5M and 3.2M. Average depth 4m ± 3m."},
  {type:"p", text:"Mode is used instead of mean/median for nominal data (45 men, 30 women → men at 60% occupancy). For an ordinal scale where intervals can't be perceived: an athlete with Bronze, Silver, Gold, Gold, Gold — “average 2.4 medals” is meaningless, median = Gold, mode = Gold at 60%. For an equal-interval ordinal scale (Likert 1–5), responses 2,3,5,5,5 → Mode = 5 (60% chose “very satisfied”), average = 4 (which treats an ordinal scale as an interval scale, assuming equal intervals between reference points)."},
  {type:"h", text:"Measures of dispersion"},
  {type:"table", headers:["Measure","Formula","Note"], rows:[
    ["Variance (s²)","Sum of Squares ÷ (n − 1)","Sum of Squares = Σ(individual value − average)²; unit is the square of the original unit"],
    ["Standard deviation (s)","s = √(s²)","Square root of variance"],
    ["Range (R)","Maximum − Minimum","Larger range = greater variability"]
  ]},
  {type:"p", text:"Worked example (deck's own numbers — reuse exactly): data [1, 2, 2, 2, 3], average = 2. Sum of Squares = (1−2)² + (2−2)² + (2−2)² + (2−2)² + (3−2)² = 2. (Without squaring, the deviations sum to 0 — that's why you square.) Variance = 2 ÷ (5−1) = 0.5. Standard deviation = √0.5. Range = 3 − 1 = 2."},
  {type:"p", text:"Outlier sensitivity summary: NOT affected → Median, IQR. Affected → Mean, Standard Deviation, Range."},
  {type:"h", text:"EDA — Exploratory Data Analysis"},
  {type:"p", text:"Limit of DDA: what you can't see in numbers is visible on a graph. Raw data in a graph is understood at a glance; with huge complex Big Data it's often hard to see anything without a graph."},
  {type:"p", text:"Four EDA types: ① Data Distribution ② Comparison by category ③ Changes over time ④ Find correlations between variables."},
  {type:"p", text:"Graph selection: Discrete variable → pie chart, donut chart, stacked bar chart, Pareto chart (check share by category). Continuous variable → histogram, box plot (view central tendency and dispersion together). Trends over time → polygonal line, bar graph, control chart, box plot. Relationships → scatter plot."},
  {type:"h", text:"Box Plot"},
  {type:"ul", items:[
    "Shows minimum, Q1 (25%), Q2/median (50%), Q3 (75%), maximum, plus mild and extreme outliers",
    "IQR (Interquartile Range) = Q3 − Q1 — the body length of the box",
    "Outlier fences at 1.5 × IQR beyond the box (mild outliers); further out are extreme outliers",
    "Quartile positions: Q1 = X₍₍ₙ₊₁₎/₄₎, Q2 (median) = X₍₂₍ₙ₊₁₎/₄₎, Q3 = X₍₃₍ₙ₊₁₎/₄₎",
    "What you get from it: easily identify 5 statistics plus mean and IQR; further investigate outliers; identify asymmetry in the distribution by comparing mean vs median; especially effective for comparing distributions between groups"
  ]},
  {type:"p", text:"Scatter plots: positive correlation (as X increases Y also increases), negative correlation (as X increases Y decreases), unrelated. High density vs low density indicates strength."},
  {type:"h", text:"Two EDA cautions"},
  {type:"ul", items:[
    "Group classification / sample fragmentation: data that looks unrelated overall may split into Product A with negative correlation and Product B with positive correlation. “The art of data analysis is to reduce dimensions rather than expand them.”",
    "Scope/range constraint: you may see a correlation over a wide range but not over a narrow range."
  ]},
  {type:"p", text:"John Tukey: “EDA is the attitude, flexibility, and spontaneity to discover what we believe exists, as well as what we believe does not exist.”"},
  {type:"p", text:"EDA summary points: the purpose of analysis controls the whole process; EDA is a case-oriented inductive approach and an open debate without preconceptions; every result must be interpreted in business perspective; not all EDA findings are interesting — about 80% may just confirm what you already know; results need validation or correct interpretation to find insights."},
  {type:"h", text:"CDA — Confirmatory Data Analysis"},
  {type:"h4", text:"Four-step process"},
  {type:"ol", items:[
    "Set up hypothesis — Null hypothesis H0 = “there is no difference”; Alternative hypothesis H1 = “there is a difference”",
    "Determine significance level (α) — normally 5%",
    "Calculate P-value via a statistics tool — the probability that the actual claimed hypothesis is wrong, calculated using sample data",
    "Decide whether to reject H0 — if P-value > α → choose H0; if P-value ≤ α → choose H1"
  ]},
  {type:"p", text:"Repeated shorthand throughout the deck: P-value < 0.05 → there IS a difference. P-value > 0.05 → there is NO difference."},
  {type:"h4", text:"Hypothesis test selection table (high-value, memorize)"},
  {type:"table", headers:["Data type","Test","Compares","Deck's case example"], rows:[
    ["Continuous","2-Sample T-Test","Averages across two groups","Compare 21-year average TV sales across Europe/Asia"],
    ["Continuous","ANOVA Test","Averages across three groups","Compare 21-year average TV sales across Europe/Asia/Latin America"],
    ["Discrete","2-Proportion Test","Ratio across two groups","Compare process defect rates for a product between this year and last year"],
    ["Discrete","Chi-Square Test","Ratio across three groups","Compare differences of defect types among A, B, C groups"],
    ["Continuous","Correlation Analysis","Relationships between variables","Check how price relates to sales volume"]
  ]},
  {type:"p", text:"Simplified grid: 2 groups → T-Test (continuous) / 2-Proportion (discrete). 3+ groups → ANOVA (continuous) / Chi-Square (discrete)."},
  {type:"h4", text:"Deck's worked cases"},
  {type:"ul", items:[
    "2-Sample T-Test: call-centre waiting time before improvement (avg 111.4, min 105, max 120) vs after (avg 108.4, min 101, max 118), 9 orders each, α = 5%.",
    "ANOVA: three new product proposals surveyed among 1,000 customers in each of three age groups (20s avg 6.27 SD 0.52; 30s avg 4.28 SD 0.79; 40s avg 4.95 SD 0.81) → P-value less than 0.05, so the three groups differ.",
    "2-Proportion Test: Line A 340 defects out of 1,000; Line B 170 out of 660. Sample defect rates 34% and 26% → P-value greater than 0.05, so there is no difference in line defect rate. (Good trap: the raw percentages differ but the test says no significant difference.)",
    "Chi-Square: four classes of 50 surveyed each, dissatisfaction rates 0.11 / 0.16 / 0.04 / 0.14 → P-value greater than 0.05, so no difference in satisfaction rate."
  ]},
  {type:"h4", text:"Correlation coefficient (r)"},
  {type:"ul", items:[
    "A touchstone of the relationship between two variables; indicates how close the points are to a straight line",
    "Always between −1 and 1; a value of −1 or 1 indicates a perfect linear relationship",
    "Affected by anomalies/outliers",
    "Significance still requires the p-value: if p > 0.05, there is no correlation no matter what r is"
  ]},
  {type:"p", text:"Point vs Interval estimation: Point estimation gives a single value (average height 174cm) and does not reflect error. Interval estimation gives a range with a probability (“the average height of all 17-year-old males exists between 160 and 188 with 95% probability”) and does reflect error."},
  {type:"p", text:"Confidence interval inputs from the deck: n = 40, X̄ = 175, s = 20. Because the population standard deviation is unknown, the sample SD is used (valid with a sufficient number of observations, n ≥ 30). Z-score for 95% (0.95) = 1.96; typically 95% or 99% is used. CI = X̄ ± Z × (s/√n)."},
  {type:"h", text:"PDA — Predictive Data Analysis"},
  {type:"p", text:"Predict Y (result/outcome/objective/target variable) on the condition of X (factors/reason variables). Y = f(X)."},
  {type:"p", text:"Deck's predictive case examples: mortgage fraud (gender, age, occupation, past use pattern, credit rating → 64% chance of fraud); equipment failure (equipment type, installation year, driving speed, temperature, humidity → 88% chance of failure after 3 days); customer churn (→ 75% chance); demand prediction (→ 70% chance of 10,000 units after 3 weeks); Target's pregnancy-stage product recommendation; automatic sorting of good vs defective products."},
  {type:"p", text:"Machine Learning: a method of materializing AI (deep learning is one of several ML methods) that makes computers learn with data to create a predictive function Y = f(X). It reviews functions F1…Fn per the algorithm in a trial-and-error manner to find the function with the minimum error. Humans make the predictive function; the machine predicts the result instead of a human. Deck's train/test split example: 1,000,000 collected → 700,000 training data-set, 300,000 test data-set."},
  {type:"h4", text:"Three types of machine learning"},
  {type:"table", headers:["Type","Data","How it learns"], rows:[
    ["Supervised Learning","Labeled data","Learning with both problems and answers"],
    ["Unsupervised Learning","Unlabeled data","Learning through problems without answers"],
    ["Reinforcement Learning","Learns without data","Learn by maximizing rewards and minimizing punishment"]
  ]},
  {type:"h4", text:"Five types of PDA"},
  {type:"table", headers:["Type","Definition"], rows:[
    ["Regression Analysis","Estimating the result variable values when given independent variable values — supervised learning using labeled data with continuous Y"],
    ["Classification Analysis","Assigning a target object to one of the predetermined categories — supervised learning using labeled data with discrete Y"],
    ["Cluster Analysis","Divide into useful groups to understand the structure of given data — unsupervised / self-learning using unlabeled data"],
    ["Time Series Analysis","Analysis based on time series data; a rare/special case of regression analysis"],
    ["Association Rule Analysis","Find a co-occurring event or activity; describe repeatable rules as probabilities"]
  ]},
  {type:"p", text:"Regression: used when Y is continuous. Algorithms listed: Simple Linear Regression, Multiple Linear Regression, Regularized Linear Regression, Generalized Additive Models, Regression Tree, Principal Component Regression, Partial Least Square, polynomial regression, step/basis function, regression splines, smoothing splines, Local Regression. Test R² is most commonly used for model performance evaluation. If all models have the same Test R², Simple is Best. Deck's R example uses lm(): Behavior Change = 0.9769 + 0.5815 × Systemic Pressure; since the P-value is less than 0.05, systemic pressure affects behavior change."},
  {type:"p", text:"Classification / KNN (K-Nearest Neighborhood): after calculating the Euclidean distance between all data points, select k in order of nearest, and select the classification category by majority vote. Procedure: ① calculate distance from the new item to existing defined items (similarity scales) ② determine the K value (define decision rules) ③ classify by the most common class within K."},
  {type:"p", text:"Cluster Analysis: divide observation objects into groups based on similarity/affinity — ensuring homogeneity within groups and heterogeneity between groups. Most representative application is customer segmentation. Purposes: ① identify hidden patterns → explore/summarize the entire data structure ② means of preprocessing — data reduction, outlier detection."},
  {type:"p", text:"Time Series Analysis: analyzing causal relationships between variables related to time series data; a special form of regression. Series data = data observed in order of time (year, quarter, month, day, hour). Purposes: identify characteristics of time series data (period, seasonality, trend), and future prediction (company demand forecasting, economic indicators, infrastructure demand)."},
  {type:"h4", text:"Four components of time series"},
  {type:"table", headers:["Component","Definition"], rows:[
    ["Trend","Long-term fluctuations due to changes in population, resources, and technology"],
    ["Seasonal","Changes repeated in cycles of 12 months"],
    ["Cycle","Irregular/repetitive changes such as expansion and contraction of economic activity"],
    ["Irregular","Unknown changes not due to certain rules"]
  ]},
  {type:"p", text:"Association Rule: the “Shopping Cart Rule.” Finds the 『If-Then』 pattern of condition and result in huge quantities of data. Netflix's content recommendation is the best example. Classic examples: if shoppers buy bread they buy milk; if shoppers buy diapers they buy beer. Traditional form: “If you buy A, you will also buy B with 30% chance.” Sequence Analysis is the case where a time difference occurs in If-Then. Two algorithms most used for recommendation: Collaborative Filtering (both read → similar → recommend) and Content-based Filtering (man reads → similar content → recommended). Caution: some associations are meaningless or accidental — e.g. Buy(x, bread & butter) ⇒ Buy(x, milk) [90%] is a no-brainer."},
  {type:"p", text:"PDA summary — two functions: ① Description — explain why the result comes out, and the extent of the effect on the outcome by cause. ② Presumption — identify the possibility of an unknown outcome, predict uncertain future facts in advance."},
  {type:"p", text:"Three basic principles of model development: ① Best Fitting ② Principles of Economics (simplicity/parsimony) ③ Practically Reasonable. Forecasting accuracy is not the only criterion for judgment — judgment should be with practical usefulness."}
]},
{n:4, title:"TV Device Data", complexity:"Easy", blocks:[
  {type:"p", text:"Definition: TV Device Data is all behavioral information data used by users via Smart TVs."},
  {type:"h", text:"Seven log/data types"},
  {type:"table", headers:["Log type","Generated when","Notable fields"], rows:[
    ["Activation Log","User accesses a server for the first time to use their Smart TV — the starting point for data collection","Device Identification, TV Platform, TV Model, Service Country Registration, Start Date of Activation"],
    ["App Installation Log","Customer installs or updates an app","App ID, date/time of installation, date/time of update"],
    ["App Use History Log","Customer uses apps","Start time of app use, finish time of app use"],
    ["TV Watching Log","Watching broadcast via antenna / set-top box / LG Channel","Channel Code, start/finish time, Media Type (RF/STB/IP), Channel, Program, Program Genre, Cast, Schedule"],
    ["TV Normal Log","Saving all user actions from smart functions, services, apps","Header (SW version, language setting code, terms and conditions) + Data (CONTEXT NAME, MESSAGE ID, Message Data as JSON key:value, Log Time)"],
    ["TV Search Log","Search words in the integrated search app","service, query, domain (search category: TV Show, LiveTV, Movie, YouTube), log time"],
    ["TV VOD Selection Log","Selecting VOD within our service app recommendation/search results","Contents ID, CP App ID, Contents, Cast"]
  ]},
  {type:"p", text:"Common to nearly all logs: Device Identification (encrypted), TV Platform (chipset/platform code, e.g. W21O, O20N), TV Model (e.g. OLED65ABCDE), Service Country Registration (2-digit country code, e.g. KR)."},
  {type:"p", text:"Notes: Activation start date is when the server was linked, which differs from the actual TV purchase date. Live EPG metadata is created on the server by linking channel code with EPG metadata — it is not received from the TV — and is currently serviced for 14 countries. Content usage information in CP apps such as Netflix and YouTube is NOT collected. Normal Log spec history is managed in Jira and saved as an Excel file; context name and message id are controlled through whitelist management."},
  {type:"p", text:"Platforms: T-LAMP = TV Log Analytics Management Platform (device identification, webOS3.0~). Intellytics = device non-identification, all platforms. SDP = Service Delivery Platform."},
  {type:"h", text:"Collection policy — three review gates"},
  {type:"ol", items:[
    "Legal Review (criteria for collection) — only collect logs for use and provide benefit to the customer; collect based on the customer's agreement level with consent; delete collected logs when consent expires",
    "Privacy Compliance (safe collection) — personal identification info must be transmitted in a secured section, never in plain text",
    "CP Contract Review (data collection item) — metadata supplied from CP collected per contract criteria"
  ]},
  {type:"p", text:"Consent tiers: Basic Terms consent → Activation Log, App Installation Log, Search Log, UCM Log. Watching Information consent → Broadcast Watching Log, VOD Selection Log (minimum 5 minutes of use), Normal Log (including whitelist). Voice Service consent → Voice Search Log."},
  {type:"p", text:"Maintenance/storage policy: store only necessary items for the necessary period; saving periods set per purpose (CS, personalization). Only authorized users on authorized servers may access; data including personal information provided only for special purposes such as CS. Flow: saving for 1 month (single unit of data → DB) → saving for 2 years (CSV/TSV into T-LAMP; CSV file into Intellytics; GZ file into SDP)."},
  {type:"h", text:"Destruction policy — three triggers"},
  {type:"ol", items:[
    "Automatic deletion at expiration of the saving period",
    "Deletion according to user's request per each country's personal information protection policy (GDPR, CCPA)",
    "Deletion on cancelling/unsubscribing — withdrawal of terms and conditions, data initialization in the TV menu"
  ]},
  {type:"h", text:"Provision policy"},
  {type:"table", headers:["Purpose","Contents","Format","Platform"], rows:[
    ["CS","Detailed data on failure-occurred services","CSV","—"],
    ["GDPR/CCPA","Data for requesting a user's full usage range","Excel","T-LAMP"],
    ["Service Improvement","Data for improvement of TV product quality","CSV","—"],
    ["Index Analysis / Statistical Data / Serviceability","Per-smart-function analysis, statistics per country/platform, normal log service data","Dashboard","Intellytics"]
  ]},
  {type:"p", text:"How to request: T-LAMP — request through Jira or EP. Intellytics — request an account or access authority for dashboard access."}
]},
{n:5, title:"The Use of HE Data", complexity:"Medium", blocks:[
  {type:"p", text:"LGE data management flow: Collect/Secure → Integrate/Store → Analyze/Utilize."},
  {type:"ul", items:[
    "Categories: Customer Data (collected under customer's consent — device/app data, member management platform, internal system data) and Enterprise/Operability Data (R&D, procurement, production, quality, SCM, distribution, finance, sales, marketing, facility/inspection, process/device log)",
    "Storage: DDL (Device Data Lake) and EDL (Enterprise Data Lake), virtually integrated via Data Virtualization in the Data Portal",
    "Analysis/Utilize: Intellytics, T-LAMP, DAVID, HEDP (HE Data Platform); analysis platforms include Excel (individual download/local analysis), MSTR and Tableau (self-service BI), R and Python (AI/ML sandbox)",
    "Governed by DLMS (Data Life Cycle Management System) under Customer Data Governance"
  ]},
  {type:"p", text:"Roughly 40 data systems (excluding duplicates) are active in HE, with 15 customer data systems (identified/anonymized)."},
  {type:"h", text:"Main data used by team"},
  {type:"table", headers:["Team","Mainly used data","Data/system"], rows:[

    ["Platform Business","TV Watching Data","Intellytics, T-LAMP, Harmony System"],

    ["Sales/Marketing","TV Recognize/Search/Purchase Data, Customer VoC, Customer Trend","GMP, CDP, T-LAMP, OBS, EMP, Intellytics (VOC/CMR)"],

  {type:"p", text:"HE Data Platform Task Service — provides safe data on preferred time to HE members, via Jira (HEDATAPLFM project). Three service types: ① provide safe data to all members ② support extract/process works ③ data consulting (e.g. security and cost perspective checks, legal review and terms-revision process)."},
  {type:"p", text:"Use cases: StandbyMe Go UXP analysis (three Unique eXperience Points: high portability, screen for further experience, flexible use according to contents) built into a DAVID dashboard; LG Channel Home App 3.0 with personalized recommendation using LG Channel data, ACR data, and US CDP customer data; Hawkeye 2.0 (PainKiller) — a customer feedback pipeline that detects customer pain points before customers report them, plus Prosense (proactive sense for failure) automatic log collection and a Beta Program."}
]},
{n:6, title:"HE Company's DEJ", complexity:"High", blocks:[
  {type:"p", text:"DEJ = Development Experience Journey (the R&D-side counterpart to CEJ = Customer Experience Journey)."},
  {type:"p", text:"Why DEJ: changes in the way of work are required for HE members who develop/supply products aligned with the C-D-P system. Drivers: TV usability changing from Watching to Using; the era of customer experience (77% responded that product service experience affects brand image); microsegmentation of customer groups; expansion from product sales to subscription/service-oriented platform business."},
  {type:"p", text:"What DEJ is: how HE Company works to materialize “All / Smart / Agile / Perfect” products and services with differentiated platforms and innovative processes, by building a customer-centered development environment and changing the way they work for customer experience innovation."},
  {type:"h", text:"DEJ 3333 (memorize)"},
  {type:"table", headers:["Goal","Target"], rows:[

    ["3!!","Response in 3 days for Customer Experience Value/Improvement"],
    ["3!!!","Explore at least 3 distinguished Customer Experience Values every year"],
    ["3!!!!","30% increase in member's satisfaction (work efficiency)"]
  ]},
  {type:"p", text:"DEJ platform three phases: Explore Customer Experience Value → Materialize Customer Experience Value → Provide Customer Value / Monitoring."},
  {type:"h", text:"Roadmap"},
  {type:"table", headers:["Phase","Period","Focus"], rows:[

    ["DEJ 2.0","2024–2025","Integrate/advance DEJ Platform; advance customer data value"],

  {type:"p", text:"Vision: “Sync to You, Open to All.” Three-part experience ladder: Connect Me (common experience value) → Recognize Me (provide experience value more than expectation) → Fit in with Me (WoW!! provide experience value)."},
  {type:"p", text:"Systems named in the deck: HE DP (HE Data Platform), IC360 (customer understanding platform in LGE), Hawkeye (detect customer pain point in advance), HE-WIDH (webOS Integrated Data House) with DAVID (usability) and LGCAP (analyze ad service), HE-QDX (analyze integrated quality), HEAVEN (integrated development of circuit/power/picture quality/sound quality), HERMES (integrated development of mechanic/LCM/package), HE-VPDS (HW virtual verification), HEY!TAS (SW virtual verification), RMS/IMS (requirement/initiative management), NPDM + BOM Automization, PINE (webOS platform upgrade), MLOps, DEJ Portal, HE-DEJ Datalake, Beta Program."},
  {type:"p", text:"5 Main Customer Experiences (3C 2S): Connectivity, Care, Customization, Servitization, Sustainability. ⚠️ The user's compiled notes list “Core” as the second C — that is wrong. The deck says Care. Corrected here and flagged in the Check tab."},
  {type:"p", text:"Provide Customer Value pillars: Personalization (tailored recommendation service, ad, picture/sound quality settings, settings for disabled/seniors), Optimization (SW upgrade on right time via PINE), Specialization (develop new use experience products, e.g. StandbyMe Go)."}
]}

/* ===================== helpers ===================== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function textMatches(text, term){
  return !term || String(text).toLowerCase().indexOf(term.toLowerCase()) !== -1;
}
function hl(text, term){
  var esc = escapeHtml(text);
  if(!term) return esc;
  try{
    var safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("(" + safe + ")", "ig");
    return esc.replace(re, "<mark>$1</mark>");
  }catch(e){ return esc; }
}
function shuffleArr(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* generic block renderer, shared by Study + Cheat tabs */
function renderBlocks(blocks, term){
  var html = "";
  var anyMatch = !term;
  var pending = "";
  function flush(){ if(pending){ html += pending; pending = ""; } }
  for(var i = 0; i < blocks.length; i++){
    var b = blocks[i];
    if(b.type === "h"){ pending += '<h3 class="block-h">' + hl(b.text, term) + "</h3>"; continue; }
    if(b.type === "h4"){ pending += '<h4 class="block-h4">' + hl(b.text, term) + "</h4>"; continue; }
    if(b.type === "p"){
      if(term && !textMatches(b.text, term)) continue;
      flush();
      if(term) anyMatch = true;
      html += "<p>" + hl(b.text, term) + "</p>";
      continue;
    }
    if(b.type === "ul" || b.type === "ol"){
      var items = b.items.filter(function(it){ return !term || textMatches(it, term); });
      if(term && items.length === 0) continue;
      flush();
      if(term && items.length) anyMatch = true;
      var tag = b.type === "ul" ? "ul" : "ol";
      html += "<" + tag + ">" + items.map(function(it){ return "<li>" + hl(it, term) + "</li>"; }).join("") + "</" + tag + ">";
      continue;
    }
    if(b.type === "table"){
      var rows = b.rows.filter(function(r){ return !term || r.some(function(c){ return textMatches(c, term); }); });
      if(term && rows.length === 0) continue;
      flush();
      if(term && rows.length) anyMatch = true;
      html += '<div class="table-wrap"><table><thead><tr>' +
        b.headers.map(function(h){ return "<th>" + escapeHtml(h) + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        rows.map(function(r){ return "<tr>" + r.map(function(c){ return "<td>" + hl(c, term) + "</td>"; }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>";
      continue;
    }
  }
  return { html: html, anyMatch: anyMatch };
}

/* ===================== score / pass-line ===================== */
function computeScoreFor(section){
  var ids = section.order;
  var answered = 0, correct = 0;
  for(var i = 0; i < ids.length; i++){
    var a = section.answers[ids[i]];
    if(a){ answered++; if(a.correct) correct++; }
  }
  return { answered: answered, correct: correct, pct: answered ? Math.round((correct / answered) * 100) : 0 };
}
function computeScore(){ return computeScoreFor(state.drill); }
function computeBlanksScore(){ return computeScoreFor(state.blanks); }
function updateScoreStrip(){
  var s = state.scoreMode === "blanks" ? computeBlanksScore() : computeScore();
  document.getElementById("scoreLabel").textContent = state.scoreMode === "blanks" ? "BLANKS" : "DRILL";
  document.getElementById("scorePct").textContent = s.pct + "%";
  document.getElementById("scoreFrac").textContent = s.correct + "/" + s.answered;
  var fill = document.getElementById("passFill");
  fill.style.width = Math.min(s.pct, 100) + "%";
  fill.classList.toggle("pass", s.pct >= 80);
}

  });
  document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.remove("active"); });
  document.getElementById("tab-" + tab).classList.add("active");
  if(tab === "drill"){ state.scoreMode = "drill"; renderDrill(); }
  if(tab === "blanks"){ state.scoreMode = "blanks"; renderBlanks(); }
  if(tab === "study") renderStudy();

/* ===================== DRILL ===================== */
function buildDrillSet(subsetIds){
  var pool;
  if(subsetIds){
    pool = subsetIds.slice();
  } else if(state.drill.moduleFilter === "all"){
    pool = QUESTIONS.map(function(q){ return q.id; });
  } else if(state.drill.moduleFilter === "past"){
    var pastQs = QUESTIONS.filter(function(q){ return q.past; });
    if(state.drill.pastTripleOnly) pastQs = pastQs.filter(function(q){ return q.freq === 3; });
    pastQs = pastQs.slice().sort(function(a, b){ return b.freq - a.freq; });
    pool = pastQs.map(function(q){ return q.id; });
  } else {
    var m = state.drill.moduleFilter;
    pool = QUESTIONS.filter(function(q){ return q.m === m; }).map(function(q){ return q.id; });
  }
  if(state.drill.shuffle) pool = shuffleArr(pool);
  state.drill.order = pool;
  state.drill.index = 0;
  state.drill.answers = {};
}
function onDrillFilter(mod){
  state.drill.moduleFilter = (mod === "all" || mod === "past") ? mod : Number(mod);
  if(mod !== "past") state.drill.pastTripleOnly = false;
  buildDrillSet();
  renderDrill();
}
function onDrillPastTripleToggle(){
  state.drill.pastTripleOnly = !state.drill.pastTripleOnly;
  buildDrillSet();
  renderDrill();
}
function onDrillShuffleToggle(){
  state.drill.shuffle = !state.drill.shuffle;
  buildDrillSet();
  renderDrill();
}
function onDrillReset(){
  state.drill.flagged = {};
  buildDrillSet();
  renderDrill();
}
function onDrillOption(qid, idx){
  if(state.drill.answers[qid]) return;
  var q = QUESTIONS.filter(function(x){ return x.id === qid; })[0];
  state.drill.answers[qid] = { chosen: idx, correct: idx === q.a };
  renderDrill();
}
function onDrillNext(){
  state.drill.index++;
  renderDrill();
}
function onDrillFlag(qid){
  state.drill.flagged[qid] = !state.drill.flagged[qid];
  renderDrill();
}
function onDrillRetry(mode){
  var ids;
  if(mode === "wrong"){
    ids = state.drill.order.filter(function(id){
      var a = state.drill.answers[id];
      return a && !a.correct;
    });
  } else {
    ids = state.drill.order.filter(function(id){ return state.drill.flagged[id]; });
  }
  if(ids.length === 0) return;
  if(state.drill.shuffle) ids = shuffleArr(ids);
  buildDrillSet(ids);
  renderDrill();
}

function moduleTag(m){ return "M" + m; }

function renderDrill(){
  var el = document.getElementById("tab-drill");
  var chips = ["all", 1, 2, 3, 4, 5, 6, "past"].map(function(m){
    var label = m === "all" ? "All" : (m === "past" ? "PAST" : moduleTag(m));
    var active = state.drill.moduleFilter === m;
    return '<button class="chip' + (active ? " chip-active" : "") + '" onclick="onDrillFilter(\'' + m + '\')">' + label + "</button>";
  }).join("");

  var tripleChip = state.drill.moduleFilter === "past" ?
    '<button class="chip' + (state.drill.pastTripleOnly ? " chip-active" : "") + '" onclick="onDrillPastTripleToggle()">×3 only</button>' : "";

  var head = '<div class="panel drill-controls">' +
    '<div class="chip-row">' + chips + "</div>" +
    '<div class="drill-toggles">' +
      tripleChip +
      '<button class="chip' + (state.drill.shuffle ? " chip-active" : "") + '" onclick="onDrillShuffleToggle()">Shuffle</button>' +
      '<button class="chip chip-ghost" onclick="onDrillReset()">Reset</button>' +
    "</div>" +
  "</div>";

  var body;
  if(state.drill.order.length === 0){
    body = '<div class="panel"><p class="muted">No questions match this filter.</p></div>';
  } else if(state.drill.index >= state.drill.order.length){
    body = renderDrillSummary();
  } else {
    body = renderDrillQuestion();
  }
  el.innerHTML = head + body;
  updateScoreStrip();
}

function renderDrillQuestion(){
  var qid = state.drill.order[state.drill.index];
  var q = QUESTIONS.filter(function(x){ return x.id === qid; })[0];
  var a = state.drill.answers[qid];
  var flagged = !!state.drill.flagged[qid];

  var srcBadge = "";
  if(q.src === "deck") srcBadge = '<span class="badge badge-deck">DECK</span>';
  if(q.src === "notes") srcBadge = '<span class="badge badge-notes">NOTES</span>';
  if(q.past) srcBadge += '<span class="badge badge-past">PAST ×' + q.freq + " &middot; " + q.sat.join(" ") + "</span>";

  var optsHtml = q.opts.map(function(opt, idx){
    var cls = "option";
    if(a){
      if(idx === q.a) cls += " opt-correct";
      else if(idx === a.chosen) cls += " opt-wrong";
    }
    var disabled = a ? " disabled" : "";
    return '<button class="' + cls + '" ' + disabled + ' onclick="onDrillOption(\'' + qid + "', " + idx + ')">' +
      '<span class="opt-letter mono">' + String.fromCharCode(65 + idx) + "</span>" +
      '<span class="opt-text">' + escapeHtml(opt) + "</span>" +
    "</button>";
  }).join("");

  var why = a ? '<div class="why-line">' + escapeHtml(q.why) + "</div>" : "";
  var nextBtn = a ? '<button class="btn-primary" onclick="onDrillNext()">Next →</button>' : "";

  return '<div class="panel drill-question">' +
    '<div class="q-meta mono">' +
      '<span>' + escapeHtml(qid) + " &middot; " + moduleTag(q.m) + "</span>" +
      srcBadge +
      '<button class="flag-btn' + (flagged ? " flag-active" : "") + '" onclick="onDrillFlag(\'' + qid + '\')" aria-pressed="' + flagged + '">' + (flagged ? "★ Flagged" : "☆ Flag for review") + "</button>" +
    "</div>" +
    '<p class="q-text">' + escapeHtml(q.q) + "</p>" +
    '<div class="opt-list">' + optsHtml + "</div>" +
    why +
    '<div class="drill-progress mono muted">Question ' + (state.drill.index + 1) + " / " + state.drill.order.length + "</div>" +
    '<div class="drill-actions">' + nextBtn + "</div>" +
  "</div>";
}

function renderDrillSummary(){
  var s = computeScore();
  var byModule = {};
  state.drill.order.forEach(function(id){
    var q = QUESTIONS.filter(function(x){ return x.id === id; })[0];
    var a = state.drill.answers[id];
    if(!byModule[q.m]) byModule[q.m] = { correct: 0, total: 0 };
    byModule[q.m].total++;
    if(a && a.correct) byModule[q.m].correct++;
  });
  var weakest = null, weakestPct = 101;
  Object.keys(byModule).forEach(function(m){
    var d = byModule[m];
    var pct = d.total ? (d.correct / d.total) * 100 : 100;
    if(pct < weakestPct){ weakestPct = pct; weakest = m; }
  });
  var rows = Object.keys(byModule).sort().map(function(m){
    var d = byModule[m];
    var pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
    var mark = (m === weakest) ? ' <span class="badge badge-high">WEAKEST</span>' : "";
    return "<tr><td>" + moduleTag(m) + mark + "</td><td>" + d.correct + " / " + d.total + "</td><td>" + pct + "%</td></tr>";
  }).join("");

  var wrongCount = state.drill.order.filter(function(id){ var a = state.drill.answers[id]; return a && !a.correct; }).length;
  var flaggedCount = state.drill.order.filter(function(id){ return state.drill.flagged[id]; }).length;

  var pastIds = state.drill.order.filter(function(id){
    return QUESTIONS.filter(function(x){ return x.id === id; })[0].past;
  });
  var pastLine = "";
  if(pastIds.length){
    var pastCorrect = pastIds.filter(function(id){ var a = state.drill.answers[id]; return a && a.correct; }).length;
    var pastPct = Math.round((pastCorrect / pastIds.length) * 100);
    pastLine = '<p class="muted">Past-paper subset: <b class="mono">' + pastCorrect + " / " + pastIds.length + " (" + pastPct + "%)</b> — the best available predictor of real exam performance.</p>";
  }

  return '<div class="panel drill-summary">' +
    '<h3 class="block-h">Set complete — ' + s.correct + " / " + s.answered + " (" + s.pct + "%)</h3>" +
    '<p class="muted">Pass line is 80%. ' + (s.pct >= 80 ? "You cleared it on this set." : "Below pass line on this set — drill the weak module again.") + "</p>" +
    pastLine +
    '<div class="table-wrap"><table><thead><tr><th>Module</th><th>Score</th><th>%</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<div class="drill-actions">' +
      '<button class="btn-primary" ' + (wrongCount ? "" : "disabled") + ' onclick="onDrillRetry(\'wrong\')">Retry wrong only (' + wrongCount + ")</button>" +
      '<button class="btn-ghost" ' + (flaggedCount ? "" : "disabled") + ' onclick="onDrillRetry(\'flagged\')">Retry flagged (' + flaggedCount + ")</button>" +
    "</div>" +
  "</div>";
}

  state.blanks.order = pool;
  state.blanks.index = 0;
  state.blanks.answers = {};
}
function onBlanksFilter(mod){
  state.blanks.moduleFilter = mod === "all" ? "all" : Number(mod);
  buildBlanksSet();
  renderBlanks();
}
function onBlanksShuffleToggle(){
  state.blanks.shuffle = !state.blanks.shuffle;
  buildBlanksSet();
  renderBlanks();
}
function onBlanksReset(){
  state.blanks.hints = {};
  buildBlanksSet();
  renderBlanks();
}
function onBlankHintToggle(bid){
  state.blanks.hints[bid] = !state.blanks.hints[bid];
  renderBlanks();
}
function onBlankCheck(bid){
  var b = BLANKS.filter(function(x){ return x.id === bid; })[0];
  var inputs = document.querySelectorAll("#tab-blanks .blank-input[data-blank-idx]");
  var values = [];
  var allFilled = true;
  inputs.forEach(function(inp){
    var idx = Number(inp.dataset.blankIdx);
    values[idx] = inp.value;
    if(!inp.value.trim()) allFilled = false;
  });
  if(!allFilled || values.length === 0) return;
  var results = values.map(function(v, i){
    return blankAcceptedFor(b, i).indexOf(normalizeAns(v)) !== -1;
  });
  var correct = results.every(function(r){ return r; });
  state.blanks.answers[bid] = { values: values, results: results, correct: correct, revealed: false };
  renderBlanks();
}
function onBlankShowAnswer(bid){
  var b = BLANKS.filter(function(x){ return x.id === bid; })[0];
  state.blanks.answers[bid] = {
    values: b.ans.slice(),
    results: b.ans.map(function(){ return false; }),
    correct: false,
    revealed: true
  };
  renderBlanks();
}
function onBlankNext(){
  state.blanks.index++;
  renderBlanks();
}
function onBlankInputKeydown(e, bid){
  if(e.key !== "Enter") return;
  e.preventDefault();
  if(state.blanks.answers[bid]) onBlankNext();
  else onBlankCheck(bid);
}
function onBlanksRetry(mode){
  var ids;
  if(mode === "wrong"){
    ids = state.blanks.order.filter(function(id){
      var a = state.blanks.answers[id];
      return a && !a.correct;
    });
  } else {
    ids = [];
  }
  if(ids.length === 0) return;
  if(state.blanks.shuffle) ids = shuffleArr(ids);
  buildBlanksSet(ids);
  renderBlanks();
}

function renderBlanks(){
  var el = document.getElementById("tab-blanks");
  var chips = ["all", 1, 2, 3, 4, 5, 6].map(function(m){
    var label = m === "all" ? "All" : moduleTag(m);
    var active = state.blanks.moduleFilter === (m === "all" ? "all" : m);
    return '<button class="chip' + (active ? " chip-active" : "") + '" onclick="onBlanksFilter(\'' + m + '\')">' + label + "</button>";
  }).join("");

  var head = '<div class="panel drill-controls">' +
    '<div class="chip-row">' + chips + "</div>" +
    '<div class="drill-toggles">' +
      '<button class="chip' + (state.blanks.shuffle ? " chip-active" : "") + '" onclick="onBlanksShuffleToggle()">Shuffle</button>' +
      '<button class="chip chip-ghost" onclick="onBlanksReset()">Reset</button>' +
    "</div>" +
  "</div>";

  var body;
  if(state.blanks.order.length === 0){
    body = '<div class="panel"><p class="muted">No blanks match this filter.</p></div>';
  } else if(state.blanks.index >= state.blanks.order.length){
    body = renderBlanksSummary();
  } else {
    body = renderBlankQuestion();
  }
  el.innerHTML = head + body;
  if(state.scoreMode === "blanks") updateScoreStrip();
}

function renderBlankQuestion(){
  var bid = state.blanks.order[state.blanks.index];
  var b = BLANKS.filter(function(x){ return x.id === bid; })[0];
  var a = state.blanks.answers[bid];
  var parts = b.text.split("___");

  var sentence = "";
  for(var i = 0; i < parts.length; i++){
    sentence += escapeHtml(parts[i]);
    if(i < parts.length - 1){
      var val = a ? a.values[i] : "";
      var cls = "blank-input";
      var reveal = "";
      if(a){
        if(a.revealed){
          cls += " blank-revealed";
        } else if(a.results[i]){
          cls += " blank-correct";
        } else {
          cls += " blank-wrong";
          reveal = '<span class="blank-answer-reveal mono">' + escapeHtml(b.ans[i]) + "</span>";
        }
      }
      var w = Math.max(4, b.ans[i].length + 2);
      sentence += '<input type="text" class="' + cls + '" style="width:' + w + 'ch" ' +
        'data-blank-idx="' + i + '" value="' + escapeHtml(val) + '" ' + (a ? "disabled" : "") +
        ' autocomplete="off" autocapitalize="off" spellcheck="false" ' +
        'onkeydown="onBlankInputKeydown(event,\'' + bid + '\')">' + reveal;
    }
  }

  var hintShown = !!state.blanks.hints[bid];
  var hintHtml = hintShown ? '<div class="blank-hint">' + escapeHtml(b.hint) + "</div>" : "";
  var revealedNote = (a && a.revealed) ? '<div class="blank-revealed-note">Answer shown — marked incorrect.</div>' : "";

  var actions;
  if(a){
    actions = '<button class="btn-primary" onclick="onBlankNext()">Next →</button>';
  } else {
    actions =
      '<button class="btn-ghost" onclick="onBlankHintToggle(\'' + bid + '\')">' + (hintShown ? "Hide hint" : "Hint") + "</button>" +
      '<button class="btn-ghost" onclick="onBlankShowAnswer(\'' + bid + '\')">Show answer</button>' +
      '<button class="btn-primary" onclick="onBlankCheck(\'' + bid + '\')">Check</button>';
  }

  return '<div class="panel blank-question">' +
    '<div class="q-meta mono"><span>' + escapeHtml(bid) + " &middot; " + moduleTag(b.m) + "</span></div>" +
    '<div class="blank-sentence">' + sentence + "</div>" +
    hintHtml + revealedNote +
    '<div class="drill-progress mono muted">Item ' + (state.blanks.index + 1) + " / " + state.blanks.order.length + "</div>" +
    '<div class="drill-actions">' + actions + "</div>" +
  "</div>";
}

function renderBlanksSummary(){
  var s = computeBlanksScore();
  var byModule = {};
  state.blanks.order.forEach(function(id){
    var b = BLANKS.filter(function(x){ return x.id === id; })[0];
    var a = state.blanks.answers[id];
    if(!byModule[b.m]) byModule[b.m] = { correct: 0, total: 0 };
    byModule[b.m].total++;
    if(a && a.correct) byModule[b.m].correct++;
  });
  var weakest = null, weakestPct = 101;
  Object.keys(byModule).forEach(function(m){
    var d = byModule[m];
    var pct = d.total ? (d.correct / d.total) * 100 : 100;
    if(pct < weakestPct){ weakestPct = pct; weakest = m; }
  });
  var rows = Object.keys(byModule).sort().map(function(m){
    var d = byModule[m];
    var pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
    var mark = (m === weakest) ? ' <span class="badge badge-high">WEAKEST</span>' : "";
    return "<tr><td>" + moduleTag(m) + mark + "</td><td>" + d.correct + " / " + d.total + "</td><td>" + pct + "%</td></tr>";
  }).join("");

  var wrongCount = state.blanks.order.filter(function(id){ var a = state.blanks.answers[id]; return a && !a.correct; }).length;

  return '<div class="panel drill-summary">' +
    '<h3 class="block-h">Set complete — ' + s.correct + " / " + s.answered + " (" + s.pct + "%)</h3>" +
    '<p class="muted">Pass line is 80%. ' + (s.pct >= 80 ? "You cleared it on this set." : "Below pass line on this set — drill the weak module again.") + "</p>" +
    '<div class="table-wrap"><table><thead><tr><th>Module</th><th>Score</th><th>%</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<div class="drill-actions">' +
      '<button class="btn-primary" ' + (wrongCount ? "" : "disabled") + ' onclick="onBlanksRetry(\'wrong\')">Retry wrong only (' + wrongCount + ")</button>" +
    "</div>" +
  "</div>";
}

/* ===================== STUDY ===================== */
function onStudySearch(value){
  state.searchTerm = value.trim();
  renderStudy();
}
function onStudyToggle(n){
  state.study.open[n] = !state.study.open[n];
  renderStudy();
}
function renderStudy(){
  var el = document.getElementById("tab-study");
  var term = state.searchTerm;
  var badgeClass = { Easy: "badge-easy", Medium: "badge-medium", High: "badge-high" };

  var head = '<div class="panel">' +
    '<label class="mono search-label" for="studySearch">Search study content, cards &amp; cheat sheet</label>' +
    '<input id="studySearch" type="search" class="search-input" placeholder="e.g. IQR, Veracity, Chi-Square…" value="' + escapeHtml(term) + '" oninput="onStudySearch(this.value)">' +
  "</div>";

  var modulesHtml = STUDY.map(function(mod){
    var rendered = renderBlocks(mod.blocks, term);
    if(term && !rendered.anyMatch) return "";
    var isOpen = term ? true : !!state.study.open[mod.n];
    return '<div class="panel module">' +
      '<button class="module-header" onclick="onStudyToggle(' + mod.n + ')" aria-expanded="' + isOpen + '">' +
        '<span class="module-title"><span class="mono module-num">M' + mod.n + "</span> " + hl(mod.title, term) + "</span>" +
        '<span class="badge ' + badgeClass[mod.complexity] + '">' + mod.complexity + "</span>" +
        '<span class="chevron">' + (isOpen ? "−" : "+") + "</span>" +
      "</button>" +
      (isOpen ? '<div class="module-body">' + rendered.html + "</div>" : "") +
    "</div>";
  }).join("");

  if(term && modulesHtml.trim() === ""){
    modulesHtml = '<div class="panel"><p class="muted">No study content matches “' + escapeHtml(term) + '”.</p></div>';
  }

  el.innerHTML = head + modulesHtml;
  var input = document.getElementById("studySearch");
  if(input && document.activeElement !== input){
    var v = input.value;
    input.focus();
    input.setSelectionRange(v.length, v.length);
  }
}

/* ===================== CARDS ===================== */
function onCardsDeck(deck){
  state.cards.deck = deck;
  state.cards.index = 0;
  state.cards.flipped = false;
  renderCards();
}
function currentDeckList(){
  var term = state.searchTerm;
  var list = CARDS[state.cards.deck];
  if(!term) return list;
  return list.filter(function(c){ return textMatches(c.f, term) || textMatches(c.b, term); });
}
function onCardsFlip(){
  state.cards.flipped = !state.cards.flipped;
  renderCards();
}
function onCardsNav(delta){
  var list = currentDeckList();
  if(list.length === 0) return;
  state.cards.index = (state.cards.index + delta + list.length) % list.length;
  state.cards.flipped = false;
  renderCards();
}
function onCardKeydown(e){
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); onCardsFlip(); }
  else if(e.key === "ArrowRight"){ onCardsNav(1); }
  else if(e.key === "ArrowLeft"){ onCardsNav(-1); }
}
var touchStartX = null;
function onCardTouchStart(e){ touchStartX = e.changedTouches[0].clientX; }
function onCardTouchEnd(e){
  if(touchStartX === null) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 40){ onCardsNav(dx < 0 ? 1 : -1); }
  touchStartX = null;
}
function renderCards(){
  var el = document.getElementById("tab-cards");
  var term = state.searchTerm;

  var deckBtns = CARD_DECKS.map(function(d){
    var active = state.cards.deck === d[0];
    return '<button class="chip' + (active ? " chip-active" : "") + '" onclick="onCardsDeck(\'' + d[0] + '\')">' + d[1] + "</button>";
  }).join("");

  var head = '<div class="panel"><div class="chip-row">' + deckBtns + "</div></div>";

  var list = currentDeckList();
  var body;
  if(list.length === 0){
    body = '<div class="panel"><p class="muted">No cards match “' + escapeHtml(term) + '” in this deck.</p></div>';
  } else {
    if(state.cards.index >= list.length) state.cards.index = 0;
    var card = list[state.cards.index];
    var counter = String(state.cards.index + 1).padStart(2, "0") + " / " + String(list.length).padStart(2, "0");
    var isSubjective = state.cards.deck === "subjective";
    body = '<div class="panel cards-panel">' +
      '<div class="cards-counter mono muted">' + counter + "</div>" +
      '<div class="flashcard' + (state.cards.flipped ? " is-flipped" : "") + (isSubjective ? " flashcard-tall" : "") + '" tabindex="0" role="button" ' +
        'aria-label="Flashcard, press space or enter to flip, arrow keys to navigate" ' +
        'onclick="onCardsFlip()" onkeydown="onCardKeydown(event)" ontouchstart="onCardTouchStart(event)" ontouchend="onCardTouchEnd(event)">' +
        '<div class="flashcard-face flashcard-front"><div class="flashcard-scroll">' + hl(card.f, term) + "</div></div>" +
        '<div class="flashcard-face flashcard-back"><div class="flashcard-scroll">' + hl(card.b, term) + "</div></div>" +
      "</div>" +
      '<div class="cards-nav">' +
        '<button class="btn-ghost" onclick="onCardsNav(-1)" aria-label="Previous card">← Prev</button>' +
        '<button class="btn-ghost" onclick="onCardsFlip()">Flip</button>' +
        '<button class="btn-ghost" onclick="onCardsNav(1)" aria-label="Next card">Next →</button>' +
      "</div>" +
    "</div>";
  }
  el.innerHTML = head + body;
  var fc = el.querySelector(".flashcard");
  if(fc) fc.focus({ preventScroll: true });
}

/* ===================== CHEAT ===================== */
function renderCheat(){
  var el = document.getElementById("tab-cheat");
  var term = state.searchTerm;
  var rendered = renderBlocks(CHEAT_BLOCKS, term);
  var html = rendered.html;
  if(term && !rendered.anyMatch){
    html = '<p class="muted">No cheat-sheet lines match “' + escapeHtml(term) + '”.</p>';
  }
  el.innerHTML = '<div class="panel cheat-sheet">' +
    '<h2 class="block-h cheat-title">DX Level 1 — Cheat Sheet</h2>' +
    html +
  "</div>";
}

/* ===================== CHECK ===================== */
function renderCheck(){
  var el = document.getElementById("tab-check");
  var cards = CHECK_CLAIMS.map(function(c){
    var riskClass = c.risk.indexOf("High") === 0 ? "badge-high" : (c.risk.indexOf("Medium") === 0 ? "badge-medium" : "badge-easy");
    return '<div class="panel check-card">' +
      '<div class="check-claim">' + escapeHtml(c.claim) + "</div>" +
      '<div class="check-deck"><span class="mono muted">DECK SAYS:</span> ' + escapeHtml(c.deck) + "</div>" +
      '<span class="badge ' + riskClass + '">' + c.risk + " risk</span>" +
    "</div>";
  }).join("");

  var conflictCards = CHECK_CONFLICTS.map(function(c){
    return '<div class="panel check-card">' +
      '<div class="check-claim">' + escapeHtml(c.title) + "</div>" +
      '<div class="check-deck">' + escapeHtml(c.detail) + "</div>" +
      '<div class="check-resolution"><span class="mono muted">USE:</span> ' + escapeHtml(c.resolution) + "</div>" +
    "</div>";
  }).join("");

  el.innerHTML = '<div class="panel check-note">' +
    "<p>The exam is stated to be based only on the training materials provided. These claims appear in the compiled notes but do not trace to the source deck. Treat them with caution.</p>" +
  "</div>" + cards +
  '<h3 class="block-h">Conflicts inside the past papers</h3>' +
  '<div class="panel check-note"><p>Three recalled real-exam sittings sometimes disagree with each other or with the deck. Here is how to resolve each one.</p></div>' +
  conflictCards;
}

/* ===================== boot ===================== */
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ onTabSwitch(btn.dataset.tab); });
});
buildDrillSet();
buildBlanksSet();
renderDrill();

</script>
