<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Level 1 — Study App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:   #F2F4F8;
  --grid:     #DDE3ED;
  --panel:    #FFFFFF;
  --ink:      #131722;
  --muted:    #5A6478;
  --series-a: #6B2D8C;
  --series-b: #0E8F87;
  --alert:    #C2384A;
  --amber:    #B0761A;
  --font-display: 'Archivo', 'Helvetica Neue', Arial Narrow, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background-color: var(--ground);
  background-image:
    repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 24px),
    repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 24px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}

a { color: var(--series-a); }

/* ---------- focus ---------- */
:focus-visible{
  outline: 2px solid var(--series-a);
  outline-offset: 2px;
  border-radius: 2px;
}

/* ---------- layout shell ---------- */
.app-shell{
  max-width: 900px;
  margin: 0 auto;
  min-height: 100vh;
  background: rgba(255,255,255,0.0);
}

header.site-header{
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--panel);
  border-bottom: 1px solid var(--grid);
  padding: 10px 16px 12px;
}
.header-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  flex-wrap: wrap;
}
.brand{
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.02em;
  font-size: 1.15rem;
  text-transform: uppercase;
}
.brand small{
  display:block;
  font-family: var(--font-body);
  font-weight: 400;
  text-transform: none;
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: normal;
  margin-top: 2px;
}
.score-readout{
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--muted);
  text-align:right;
  white-space: nowrap;
}
.score-readout b{ color: var(--ink); font-size:1rem; }
.score-label{ color: var(--series-a); font-weight: 700; letter-spacing: 0.04em; margin-right: 2px; }

/* ---------- the pass line ---------- */
.pass-line{
  position: relative;
  margin-top: 10px;
  height: 34px;
}
.pass-line-track{
  position: relative;
  height: 14px;
  background: var(--ground);
  border: 1px solid var(--grid);
  border-radius: 2px;
  overflow: visible;
}
.pass-line-fill{
  position: absolute;
  top:0; left:0; bottom:0;
  width: 0%;
  background: var(--series-a);
  transition: width 0.25s ease, background-color 0.25s ease;
}
.pass-line-fill.pass{ background: var(--series-b); }
.pass-line-ticks{
  position: relative;
  height: 16px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--muted);
}
.pass-line-ticks i{
  position:absolute;
  top:2px;
  transform: translateX(-50%);
  border-left: 1px solid var(--grid);
  padding-left: 3px;
  font-style: normal;
  height: 6px;
}
.pass-line-rule{
  position:absolute;
  top:-4px; bottom:-4px;
  left: 80%;
  width: 0;
  border-left: 2px solid var(--alert);
}
.pass-line-rule .pass-label{
  position:absolute;
  top:-16px;
  left: 4px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--alert);
  white-space: nowrap;
}

/* ---------- tab bar ---------- */
nav.tab-bar{
  position: sticky;
  top: 0;
  z-index: 29;
  display:flex;
  gap: 4px;
  overflow-x: auto;
  background: var(--panel);
  border-bottom: 1px solid var(--grid);
  padding: 0 12px;
  -webkit-overflow-scrolling: touch;
}
.tab-btn{
  font-family: var(--font-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  font-size: 0.82rem;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  padding: 12px 12px 10px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
.tab-btn:hover{ color: var(--ink); }
.tab-btn[aria-selected="true"]{
  color: var(--ink);
  border-bottom-color: var(--series-a);
}

main{ padding: 16px; padding-bottom: 60px; }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

/* ---------- shared card/panel ---------- */
.panel{
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: 4px;
  padding: 16px;
}
.panel + .panel{ margin-top: 12px; }

.mono{ font-family: var(--font-mono); }
.muted{ color: var(--muted); }

.badge{
  display:inline-block;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid currentColor;
}
.badge-easy{ color: var(--series-b); }
.badge-medium{ color: var(--amber); }
.badge-high{ color: var(--alert); }
.badge-deck{ color: var(--series-a); }
.badge-notes{ color: var(--amber); }
.badge-past{ color: var(--series-b); }
.badge-tier1, .badge-tier2{ color: var(--alert); }
.badge-tier3{ color: var(--series-a); }
.badge-tier4, .badge-tier5{ color: var(--muted); }
.badge-muted{ color: var(--muted); }
.badge-prob{ letter-spacing: 0.02em; }
.prob-high{ color: var(--alert); }
.prob-mid{ color: var(--series-a); }
.prob-low{ color: var(--muted); }

table{
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  margin: 10px 0;
}
caption{ text-align:left; font-family: var(--font-mono); font-size:0.72rem; color:var(--muted); margin-bottom:4px; }
th, td{
  text-align: left;
  border: 1px solid var(--grid);
  padding: 6px 8px;
  vertical-align: top;
}
th{
  background: var(--ground);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.table-wrap{ overflow-x:auto; }

mark{
  background: #FCE8B4;
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}

button{ font-family: inherit; }

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; animation: none !important; }
}

/* ---------- chips / controls ---------- */
.chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  font-family: var(--font-mono);
  font-size: 0.78rem;
  background: var(--ground);
  border: 1px solid var(--grid);
  border-radius: 3px;
  padding: 6px 10px;
  color: var(--ink);
  cursor: pointer;
}
.chip:hover{ border-color: var(--series-a); }
.chip-active{
  background: var(--series-a);
  border-color: var(--series-a);
  color: #fff;
}
.chip-ghost{ color: var(--muted); }
.drill-controls{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; }
.drill-toggles{ display:flex; gap:6px; flex-wrap: wrap; }

/* ---------- tier legend ---------- */
.tier-legend{ margin-bottom: 10px; font-size: 0.82rem; }
.tier-legend summary{ cursor: pointer; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
.tier-legend-body{ margin-top: 8px; display: grid; gap: 4px; }
.tier-row{ display: flex; align-items: baseline; gap: 8px; }
.tier-dots{ font-family: var(--font-mono); width: 3.5em; flex: none; }
.tier-dots.t1, .tier-dots.t2{ color: var(--alert); }
.tier-dots.t3{ color: var(--series-a); }
.tier-dots.t4, .tier-dots.t5{ color: var(--muted); }

/* ---------- drill question ---------- */
.q-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:0.72rem; color:var(--muted); margin-bottom:10px; }
.flag-btn{
  margin-left:auto;
  background:none;
  border:1px solid var(--grid);
  border-radius:3px;
  padding:4px 8px;
  font-family: var(--font-mono);
  font-size:0.7rem;
  color: var(--muted);
  cursor:pointer;
}
.flag-active{ border-color: var(--amber); color: var(--amber); }
.q-text{
  font-size: 1.05rem;
  font-weight: 600;
  margin: 4px 0 16px;
}
.opt-list{ display:flex; flex-direction:column; gap:8px; }
.option{
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: 4px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 0.92rem;
  color: var(--ink);
}
.option:hover:not(:disabled){ border-color: var(--series-a); }
.option:disabled{ cursor: default; }
.opt-letter{
  flex: 0 0 auto;
  width: 22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  border: 1px solid var(--grid);
  border-radius: 3px;
  font-size: 0.72rem;
  color: var(--muted);
}
.opt-correct{ border-color: var(--series-b); background: rgba(14,143,135,0.08); }
.opt-correct .opt-letter{ border-color: var(--series-b); color: var(--series-b); }
.opt-wrong{ border-color: var(--alert); background: rgba(194,56,74,0.08); }
.opt-wrong .opt-letter{ border-color: var(--alert); color: var(--alert); }
.why-line{
  margin-top: 14px;
  padding: 10px 12px;
  background: var(--ground);
  border-left: 3px solid var(--series-a);
  font-size: 0.88rem;
  color: var(--ink);
}
.drill-progress{ margin-top: 14px; font-size: 0.72rem; }
.drill-actions{ margin-top: 12px; display:flex; gap:10px; flex-wrap:wrap; }
.btn-primary, .btn-ghost{
  font-family: var(--font-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 0.8rem;
  border-radius: 3px;
  padding: 10px 16px;
  cursor: pointer;
}
.btn-primary{ background: var(--series-a); border: 1px solid var(--series-a); color: #fff; }
.btn-primary:disabled{ opacity: 0.4; cursor:default; }
.btn-ghost{ background: var(--panel); border: 1px solid var(--grid); color: var(--ink); }
.btn-ghost:disabled{ opacity: 0.4; cursor:default; }

/* ---------- blanks ---------- */
.blank-sentence{
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 2.1;
  margin: 4px 0 6px;
}
.blank-input{
  font-family: var(--font-mono);
  font-size: 0.95rem;
  text-align: center;
  border: none;
  border-bottom: 2px solid var(--series-a);
  background: transparent;
  color: var(--ink);
  padding: 2px 4px;
  margin: 0 2px;
  min-width: 3ch;
}
.blank-input:disabled{ opacity: 1; }
.blank-input.blank-correct{ border-color: var(--series-b); color: var(--series-b); font-weight: 700; }
.blank-input.blank-wrong{ border-color: var(--alert); color: var(--alert); font-weight: 700; }
.blank-input.blank-revealed{ border-color: var(--amber); color: var(--amber); font-weight: 700; }
.blank-answer-reveal{
  display: inline-block;
  font-size: 0.78rem;
  color: var(--series-b);
  margin-left: 4px;
  white-space: nowrap;
}
.blank-hint{
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--ground);
  border-left: 3px solid var(--amber);
  font-size: 0.85rem;
  color: var(--ink);
}
.blank-revealed-note{
  margin-top: 10px;
  font-size: 0.78rem;
  color: var(--amber);
}

/* ---------- study ---------- */
.search-label{ display:block; font-size:0.7rem; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em; }
.search-input{
  width: 100%;
  font-family: var(--font-body);
  font-size: 0.95rem;
  padding: 10px 12px;
  border: 1px solid var(--grid);
  border-radius: 4px;
  background: var(--ground);
  color: var(--ink);
}
.module-header{
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
  flex-wrap: wrap;
}
.module-title{ font-weight: 700; flex: 1 1 auto; }
.module-num{ color: var(--series-a); margin-right: 4px; }
.module-meta{ font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); text-transform: uppercase; }
.chevron{ font-family: var(--font-mono); color: var(--muted); width: 16px; text-align:center; }
.module-body{ margin-top: 12px; }
.block-h{ font-family: var(--font-display); text-transform: uppercase; letter-spacing:0.02em; font-size: 0.95rem; margin: 18px 0 6px; }
.block-h:first-child{ margin-top: 0; }
.block-h4{ font-family: var(--font-display); font-size: 0.82rem; color: var(--muted); text-transform: uppercase; letter-spacing:0.03em; margin: 14px 0 4px; }
.module-body p, .module-body ul, .module-body ol{ font-size: 0.9rem; }
.module-body ul, .module-body ol{ padding-left: 1.2em; }
.module-body li{ margin: 3px 0; }
.callout-idea{
  margin: 10px 0;
  padding: 10px 12px;
  background: rgba(107,45,140,0.07);
  border-radius: 4px;
  font-size: 0.9rem;
}
.callout-idea .callout-label{ display:block; font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--series-a); margin-bottom: 4px; }
.callout-examangle{
  margin: 10px 0;
  padding: 10px 12px;
  border: 1px solid var(--series-b);
  border-left: 3px solid var(--series-b);
  border-radius: 4px;
  font-size: 0.9rem;
}
.callout-examangle .callout-label{ display:block; font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--series-b); margin-bottom: 4px; }

/* ---------- cards ---------- */
.cards-panel{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.cards-counter{ align-self:flex-end; font-size:0.78rem; }
.flashcard{
  position: relative;
  width: 100%;
  min-height: 200px;
  perspective: 1200px;
  cursor: pointer;
}
.flashcard-tall{ min-height: 280px; }
.flashcard-face{
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border: 1px solid var(--grid);
  border-radius: 4px;
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transform: rotateY(0deg);
  transition: transform 0.35s ease;
}
.flashcard-back{ transform: rotateY(180deg); background: var(--ground); }
.flashcard.is-flipped .flashcard-front{ transform: rotateY(-180deg); }
.flashcard.is-flipped .flashcard-back{ transform: rotateY(0deg); }
.flashcard-scroll{ max-height: 100%; overflow-y: auto; text-align: center; font-size: 0.95rem; line-height:1.45; }
.flashcard-back .flashcard-scroll{ font-family: var(--font-mono); font-size: 0.85rem; text-align:left; }
.cards-nav{ display:flex; gap:8px; }

/* ---------- cheat ---------- */
.cheat-title{ margin-top:0; }
.cheat-sheet ul{ margin: 4px 0 12px; }

/* ---------- check ---------- */
.check-note p{ margin:0; font-size:0.9rem; color:var(--muted); }
.check-card{ display:flex; flex-direction:column; gap:6px; }
.check-claim{ font-weight:700; }
.check-deck{ font-size: 0.88rem; color: var(--ink); }
.check-resolution{ font-size: 0.88rem; color: var(--series-b); padding-top: 4px; border-top: 1px solid var(--grid); }

/* ---------- past tab ---------- */
.segmented{ display:flex; border: 1px solid var(--grid); border-radius: 3px; overflow: hidden; width: fit-content; }
.segmented button{
  font-family: var(--font-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 0.78rem;
  background: var(--panel);
  border: none;
  padding: 8px 14px;
  color: var(--muted);
  cursor: pointer;
}
.segmented button.seg-active{ background: var(--series-a); color: #fff; }
.past-note{ font-size: 0.85rem; color: var(--muted); margin: 0; }
.subj-card{ display:flex; flex-direction:column; gap:10px; }
.subj-q{ font-size: 1rem; font-weight: 600; }
.subj-answer{
  padding: 10px 12px;
  background: var(--ground);
  border-left: 3px solid var(--series-b);
  font-size: 0.9rem;
  white-space: pre-line;
}

/* ---------- print ---------- */
@media print{
  body{ background: #fff !important; }
  header.site-header, nav.tab-bar, #tab-past, #tab-drill, #tab-blanks, #tab-study, #tab-cards, #tab-check{ display:none !important; }
  .panel{ border: none; padding: 0; }
  main{ padding: 0; }
  .cheat-sheet{ break-inside: avoid; }
}

/* ---------- responsive ---------- */
@media (max-width: 420px){
  .brand{ font-size: 1rem; }
  .score-readout{ font-size: 0.78rem; }
  main{ padding: 10px; }
  .panel{ padding: 12px; }
}
</style>
</head>
<body>
<div class="app-shell">

<header class="site-header">
  <div class="header-row">
    <div class="brand">DX LEVEL 1<small>2024 HE Domain &middot; 80 to pass</small></div>
    <div class="score-readout" id="scoreReadout"><span class="score-label mono" id="scoreLabel">PAST</span> <b id="scorePct">0%</b> &middot; <span id="scoreFrac">0/0</span></div>
  </div>
  <div class="pass-line" aria-hidden="false" role="img" aria-label="Score progress against the 80 percent pass line">
    <div class="pass-line-track">
      <div class="pass-line-fill" id="passFill"></div>
      <div class="pass-line-rule"><span class="pass-label">PASS</span></div>
    </div>
    <div class="pass-line-ticks">
      <i style="left:0%">0</i><i style="left:25%">25</i><i style="left:50%">50</i><i style="left:75%">75</i><i style="left:100%">100</i>
    </div>
  </div>
</header>

<nav class="tab-bar" id="tabBar" role="tablist" aria-label="Sections">
  <button class="tab-btn" role="tab" data-tab="past" aria-selected="true">Past</button>
  <button class="tab-btn" role="tab" data-tab="drill" aria-selected="false">Drill</button>
  <button class="tab-btn" role="tab" data-tab="blanks" aria-selected="false">Blanks</button>
  <button class="tab-btn" role="tab" data-tab="study" aria-selected="false">Study</button>
  <button class="tab-btn" role="tab" data-tab="cards" aria-selected="false">Cards</button>
  <button class="tab-btn" role="tab" data-tab="cheat" aria-selected="false">Cheat</button>
  <button class="tab-btn" role="tab" data-tab="check" aria-selected="false">Check</button>
</nav>

<main>
  <section class="tab-panel active" id="tab-past"></section>
  <section class="tab-panel" id="tab-drill"></section>
  <section class="tab-panel" id="tab-blanks"></section>
  <section class="tab-panel" id="tab-study"></section>
  <section class="tab-panel" id="tab-cards"></section>
  <section class="tab-panel" id="tab-cheat"></section>
  <section class="tab-panel" id="tab-check"></section>
</main>

</div>

<script>
"use strict";
const QUESTIONS = [
{id:"M1-23",m:1,q:"What is the correct order of the Journey for Cultural Consensus?",opts:["Understand → Recognize → Accept → Participate","Recognize → Understand → Accept → Participate","Recognize → Accept → Understand → Participate","Accept → Recognize → Understand → Participate"],a:1,why:"Recognize → Understand → Accept → Participate.",tier:1},
{id:"M1-24",m:1,q:"What is the FINAL stage in the Journey for Cultural Consensus?",opts:["Recognize","Understand","Participate","Accept"],a:2,why:"Participate — participating in the execution of changes.",tier:1},
{id:"M1-34",m:1,q:"Which is NOT one of the DX activity axes of the HE Division?",opts:["DX for Customer","DX for Company","Process Innovation","Business Model Innovation"],a:2,why:"The three axes are DX for Customer, DX for Company, Business Model Innovation.",tier:1},
{id:"M1-35",m:1,q:"In the C-D-P system, which are the three roles of DX?",opts:["Trigger, Accelerator, Tracker","Plan, Do, Check","Collect, Store, Analyze","Define, Measure, Improve"],a:0,why:"Trigger (insight), Accelerator (solutions), Tracker (monitor).",tier:1},
{id:"M1-36",m:1,q:"What is the stated CX Mission?",opts:["Market Leadership","Customer Delight","Zero Defects","Digital First"],a:1,why:"Mission = Customer Delight; Core Values = F.U.N; Basic Values = Q.C.D.",tier:1},
{id:"M1-17",m:1,q:"Does DX require learning and using every latest technology?",opts:["Yes, all tech is mandatory","No — the focus is business model innovation","Only for tech-industry companies","Only for the CEO"],a:1,why:"The deck answers 'No' to both tech questions explicitly.",tier:2},
{id:"M1-18",m:1,q:"'Introduction of Digital Technology ≠ ______'",opts:["Business Innovation","Completion of DX","Data Literacy","Operational Efficiency"],a:1,why:"Adopting tech is not the same as completing DX.",tier:2},
{id:"M1-19",m:1,q:"What is described as 'a key digital capability and a way to understand customers and businesses'?",opts:["3D Printing","The use of Big Data","Robotic arms","New materials"],a:1,why:"Big data use is the named key capability.",tier:2},
{id:"M1-25",m:1,q:"Choose the INCORRECT item as a Citizen Data Scientist capability.",opts:["Propose Task","Securing / Recruiting Top DX Talent","Simple Analysis","Collaboration with a specialized Data Scientist"],a:1,why:"The four are Propose Task, Simple Analysis, Collaboration, Leading Task. Recruiting is a trap.",tier:2},
{id:"M1-26",m:1,q:"What is a Citizen Data Scientist?",opts:["A professional with a PhD in AI","A field worker with data use capabilities","A government employee who tracks data","An IT technician who repairs sensors"],a:1,why:"Domain expert in the field who gains data capability.",tier:2},
{id:"M1-27",m:1,q:"Why are Citizen Data Scientists needed?",opts:["Professional data scientists are too expensive","The supply of professional data scientists is insufficient","To replace all professional data scientists","To manage office payroll"],a:1,why:"Market grows ~30%/yr but professional supply is insufficient.",tier:2},
{id:"M1-01",m:1,q:"What is the fundamental definition of Digitization?",opts:["Business Innovation","Digitization of Process","Conversion of Analogue to Digital","Creation of new Business Models"],a:2,why:"Digitization = data layer. Digitalization = process. DX = business.",tier:3},
{id:"M1-02",m:1,q:"Which term describes the 'Adaption' phase focusing on the digitization of processes?",opts:["Digitalization","Digital Transformation","Data Conversion","Analogue Adaptation"],a:0,why:"Digitalization is the middle stage — adapting processes.",tier:3},
{id:"M1-03",m:1,q:"What is the 'Common Agreement' on the definition of Digital Transformation?",opts:["Automating manual Excel tasks","Business Innovation focusing on Digital Technology","Increasing the number of IT staff","Replacing all analogue equipment with sensors"],a:1,why:"The deck's stated common agreement, verbatim.",tier:3},
{id:"M1-04",m:1,q:"Fill the blanks: Digitalization of (___) — Digitization of (___) — (___) innovation",opts:["Process / Information / Data","Information / Process / Business","Business / Data / Process","Data / Business / Information"],a:1,why:"Information → Process → Business. A known subjective question.",tier:3},
{id:"M1-22",m:1,q:"Most common reason companies fail at DX?",opts:["Lack of budget","Focusing only on 'Introducing Technology' and overlooking 'People'","Using too much Big Data","Not enough cloud storage"],a:1,why:"People — the actual subject of execution — is the overlooked factor.",tier:3},
{id:"M1-28",m:1,q:"Which role transforms practical issues into Data issues?",opts:["DX Project Team","DX Facilitator","Data Engineer","AI Specialist"],a:1,why:"DX Facilitator: find the KPI, turn practical issues into data issues.",tier:3},
{id:"M1-32",m:1,q:"Which work style aims to 'completely get rid of the reason of the issue' in advance?",opts:["Corrective","Predictive","Preventive","Traditional"],a:2,why:"Preventive (FMEA, DRBFM). Corrective = PDCA/DMAIC. Predictive = Big Data/AI.",tier:3},
{id:"M1-33",m:1,q:"Shifting work to 'Predictive' involves using what?",opts:["PDCA and DMAIC","Big Data and AI","FMEA and DRBFM","Manual checks"],a:1,why:"Predictive is the Big Data/AI tier.",tier:3},
{id:"M1-05",m:1,q:"Which economy is associated with Airbnb and Socar?",opts:["Subscription Economy","Platform Economy","Sharing Economy","On-Demand Economy"],a:2,why:"Sharing Economy — shared access to assets.",tier:4},
{id:"M1-08",m:1,q:"Which is NOT part of the Starbucks Digital Flywheel?",opts:["Rewards","Payment","Personalization","Physical Store Expansion"],a:3,why:"The flywheel is Rewards, Payment, Personalization, Ordering — all digital.",tier:4},
{id:"M1-11",m:1,q:"Nike's D2C stands for what?",opts:["Data to Computer","Digital to Consumer","Direct Communication with customers","Delivery to Cloud"],a:2,why:"The deck spells it as Direct Communication with customers.",tier:4},
{id:"M1-20",m:1,q:"DX success rate in traditional industries (oil, automobiles, pharma) as of 2019?",opts:["4–11%","26%","30%","70%"],a:0,why:"4–11% traditional; below 26% even in digital industries.",tier:4},
{id:"M1-21",m:1,q:"Overall DX success rate in 2017?",opts:["5%","8%","12%","20%"],a:0,why:"5% in 2017 → 8% in 2019.",tier:4},
{id:"M1-29",m:1,q:"Which role executes data collection and establishes the DB?",opts:["Data Scientist","AI Specialist","Data Engineer","Data Governance"],a:2,why:"Data Engineer builds collection and databases.",tier:4},
{id:"M1-30",m:1,q:"Which is responsible for Data Operation Strategy and constructing a Data Portal?",opts:["Data Scientist","Data Governance","DX Facilitator","Project Leader"],a:1,why:"Data Governance owns operation strategy and the portal.",tier:4},
{id:"M1-37",m:1,q:"What does F.U.N stand for in CX Core Values?",opts:["Fast, Useful, New","First, Unique, New","Friendly, Universal, Novel","Focused, Unified, Natural"],a:1,why:"First (No.1 beyond expectations), Unique (life-changing), New (never-before).",tier:4},
{id:"M1-38",m:1,q:"Q.C.D — the CX Basic Values — stands for:",opts:["Quality, Cost, Delivery","Quick, Clear, Direct","Quality, Customer, Data","Quantity, Cost, Design"],a:0,why:"The baseline values beneath F.U.N.",tier:4},
{id:"M1-39",m:1,q:"The 9 CEJ stages are grouped into which three phases?",opts:["Plan, Do, Check","Explore, Purchase, Use","Aware, Decide, Replace","Collect, Store, Analyze"],a:1,why:"Explore (1–3), Purchase (4–6), Use (7–9), with Feedback throughout.",tier:4},
{id:"M1-41",m:1,q:"Which is NOT one of the 4 elements the C-D-P Management System redesigns?",opts:["Organization","Process","Performance management","Product portfolio"],a:3,why:"The four are Organization, Process, Performance management, Corporate culture.",tier:4},
{id:"M1-43",m:1,q:"NPS is calculated as:",opts:["% satisfaction − % dissatisfaction","% of promoters − % of detractors","Revenue ÷ subscribers","Acquisition + Retention + Engagement"],a:1,why:"NPS = promoters − detractors (loyalty). CXR = satisfaction − dissatisfaction.",tier:4},
{id:"M1-44",m:1,q:"CXR is calculated as:",opts:["% of promoters − % of detractors","% satisfaction − % dissatisfaction","Total revenue ÷ users","Monthly active users"],a:1,why:"CXR measures product/contact-point competitiveness.",tier:4},
{id:"M1-45",m:1,q:"Which index measures satisfaction from the 'Moment of Truth' / customer contact point?",opts:["CXR-P","CXR-Mot","NPS","A.R.E"],a:1,why:"CXR-Mot covers store, delivery, CS, care. CXR-P covers product use.",tier:4},
{id:"M1-48",m:1,q:"Which is LGE's in-house integrated analytics system for AI and big data?",opts:["Data Lake","Intellytics","CPPM","Data NXI"],a:1,why:"Intellytics. Data Lake = raw data repository. CPPM = pain point management.",tier:4},
{id:"M2-10",m:2,q:"Correct order of the development stages of data-driven decision making?",opts:["Prediction → Description → Diagnosis → Prescription","Description → Diagnosis → Prediction → Prescription","Diagnosis → Description → Prediction → Prescription","Description → Prediction → Diagnosis → Prescription"],a:1,why:"What happened → Why → What will happen → What should I do.",tier:1},
{id:"M2-11",m:2,q:"Which decision-making stage answers 'What should I do?'",opts:["Descriptive","Diagnostic","Predictive","Prescriptive"],a:3,why:"Prescriptive is the highest-value, highest-difficulty stage.",tier:1},
{id:"M2-09",m:2,q:"Which statement about big data analysis is INCORRECT?",opts:["Insights can be obtained from big data","Singularities that were overlooked can be captured","We can better understand the population through sample surveys","A case-oriented inductive approach is possible"],a:2,why:"Big data lets you move FROM sample survey TO complete survey — that's the point.",tier:2},
{id:"M2-06",m:2,q:"What is the correct containment relationship?",opts:["ML ⊃ AI ⊃ Deep Learning","AI ⊃ Machine Learning ⊃ Deep Learning","Deep Learning ⊃ AI ⊃ ML","AI and ML are separate fields"],a:1,why:"AI is the outermost concept; rule-based algorithms also count as AI.",tier:3},
{id:"M2-12",m:2,q:"The 5-stage data analysis process is based on which methodology?",opts:["CRISP-DM","Six Sigma DMAIC","Agile Scrum","PDCA"],a:0,why:"CRISP-DM = Cross Industry Standard Process for Data Mining.",tier:3},
{id:"M2-13",m:2,q:"What is the correct order of the 5-stage data analysis process?",opts:["Collect → Define → Preprocess → Visualize → Insight","Define the Issue → Collect/Extract → Preprocess → Visualize/Analyze → Draw and Apply Insight","Define → Preprocess → Collect → Analyze → Insight","Collect → Preprocess → Define → Visualize → Insight"],a:1,why:"Defining the issue always comes first.",tier:3},
{id:"M2-01",m:2,q:"Which organization defines Big Data via Volume, Velocity, and Variety information assets?",opts:["McKinsey","Gartner","IDC","Wikipedia"],a:1,why:"Gartner owns the 3V definition.",tier:4},
{id:"M2-03",m:2,q:"According to the SOURCE DECK, which three V's characterize Big Data?",opts:["Volume, Velocity, Veracity","Volume, Velocity, Variety","Volume, Value, Variety","Velocity, Veracity, Value"],a:1,why:"The deck names Volume, Velocity, Variety (Gartner) and separately lists Variability, Visualization, Volatility.",src:"deck",tier:4},
{id:"M2-04",m:2,q:"According to your COMPILED NOTES, the '5 V's' add which two beyond Volume/Velocity/Variety?",opts:["Variability and Volatility","Veracity and Value","Visualization and Variability","Volatility and Visualization"],a:1,why:"Notes say Veracity + Value. The deck does NOT contain these — see the Check tab.",src:"notes",tier:4},
{id:"M2-05",m:2,q:"Which is NOT one of the 'More V's' listed in the deck?",opts:["Variability","Visualization","Volatility","Veracity"],a:3,why:"Deck's extras are Variability, Visualization, Volatility.",tier:4},
{id:"M2-07",m:2,q:"'Rule: rabbits like carrots. Fact: Bunny is a rabbit. Output: Bunny likes carrots.' This is an example of what?",opts:["Deep Learning","Deductive Reasoning (still AI)","Unsupervised Learning","Association Rule"],a:1,why:"Rule-based deductive reasoning is AI without being ML.",tier:4},
{id:"M2-08",m:2,q:"In the A-B-C relationship, what does Cloud provide?",opts:["Labeled training data","Computing power and data storage","Business strategy","Customer consent"],a:1,why:"A=AI, B=Big Data (more data → higher AI performance), C=Cloud (computing power).",tier:4},
{id:"M2-18",m:2,q:"Which two characteristics make Excel insufficient for Big Data?",opts:["Velocity and Value","Volume and Variety","Veracity and Volume","Variety and Volatility"],a:1,why:"Size it can't handle, plus structured/semi/unstructured types.",tier:4},
{id:"M2-19",m:2,q:"What is the primary target of Text Mining?",opts:["Numerical data","Categorized data","Text","Images only"],a:2,why:"Data Mining targets numerical/categorized data; Text Mining targets text.",tier:4},
{id:"M2-22",m:2,q:"Deep Learning is defined as:",opts:["Any rule-based algorithm","Processing information in an artificial neural network similar to human neurons","A method of collecting big data","A cloud storage technique"],a:1,why:"DL is one of several ML methods, using neural networks.",tier:4},
{id:"M2-25",m:2,q:"Big data enables which reasoning approach?",opts:["Only deduction","A case-oriented inductive approach","Neither induction nor deduction","Only rule-based reasoning"],a:1,why:"Induction from cases; 'data is a representation of facts.'",tier:4},
{id:"M2-27",m:2,q:"An A/B test is best described as:",opts:["Testing two hypotheses with ANOVA","Providing version A and B to two user groups and comparing results","Splitting data into training and test sets","Comparing two sampling methods"],a:1,why:"Used in digital marketing and business decision-making.",tier:4},
{id:"M3-13",m:3,q:"Arrange the data analysis methods in correct sequence.",opts:["DDA → CDA → EDA → PDA","DDA → EDA → CDA → PDA","EDA → DDA → CDA → PDA","DDA → EDA → PDA → CDA"],a:1,why:"Descriptive → Exploratory → Confirmatory → Predictive.",tier:1},
{id:"M3-15",m:3,q:"Which is NOT affected by outliers?",opts:["Mean","Standard Deviation","Range","Median"],a:3,why:"Median and IQR resist outliers; mean, SD and range do not.",tier:1},
{id:"M3-30",m:3,q:"What is the process of dividing data into similar groups called?",opts:["Regression Analysis","Classification Analysis","Cluster Analysis","Time Series Analysis"],a:2,why:"Cluster Analysis — unsupervised; homogeneity within, heterogeneity between.",tier:1},
{id:"M3-34",m:3,q:"Which time series component represents long-term fluctuations due to changes in population, resources, and technology?",opts:["Seasonal","Cycle","Trend","Irregular"],a:2,why:"Trend = long-term. Seasonal = 12-month cycles. Cycle = economic expansion/contraction.",tier:1},
{id:"M3-57",m:3,q:"Cluster analysis ensures:",opts:["Homogeneity between groups, heterogeneity within","Homogeneity within groups, heterogeneity between groups","Equal group sizes","Labeled training data"],a:1,why:"Similar inside, different outside. Most representative use is customer segmentation.",tier:1},
{id:"M3-04",m:3,q:"Which data quality means 'regardless of who collects or measures, and no matter how many repetitions, the values should be the same'?",opts:["Timeliness","Validity","Precision","Completeness"],a:2,why:"Precision = repeatability. Accuracy = closeness to the true value.",tier:2},
{id:"M3-05",m:3,q:"Which data quality means data should be close to the true values?",opts:["Precision","Accuracy","Validity","Consistency"],a:1,why:"Accuracy targets truth; precision targets consistency.",tier:2},
{id:"M3-06",m:3,q:"Which quality means the meaning and criteria of data are the same regardless of time and space?",opts:["Consistency","Completeness","Timeliness","Sufficiency"],a:0,why:"Consistency — same criteria, unit, measurement method.",tier:2},
{id:"M3-07",m:3,q:"Which quality is violated when a dataset contains missing values and outliers?",opts:["Validity","Completeness","Timeliness","Representativeness"],a:1,why:"Completeness: appropriate range, no missing values, no outliers.",tier:2},
{id:"M3-14",m:3,q:"Which analysis formulates hypotheses and verifies their truth for decision-making?",opts:["DDA","EDA","CDA","PDA"],a:2,why:"CDA = Confirmatory, the hypothesis-testing stage.",tier:2},
{id:"M3-22",m:3,q:"If P-value = 0.03 and α = 0.05, what do you conclude?",opts:["Choose H0 — no difference","Choose H1 — there is a difference","The test is invalid","Increase the sample size"],a:1,why:"P ≤ α → reject H0. P < 0.05 means there IS a difference.",tier:2},
{id:"M3-23",m:3,q:"Which test compares averages across THREE groups of continuous data?",opts:["2-Sample T-Test","ANOVA","2-Proportion Test","Chi-Square Test"],a:1,why:"3+ groups + continuous = ANOVA.",tier:2},
{id:"M3-24",m:3,q:"Which test compares a ratio across TWO groups of discrete data?",opts:["2-Sample T-Test","ANOVA","2-Proportion Test","Chi-Square Test"],a:2,why:"2 groups + discrete/ratio = 2-Proportion Test.",tier:2},
{id:"M3-31",m:3,q:"Which PDA type uses labeled data with a CONTINUOUS Y?",opts:["Classification Analysis","Regression Analysis","Cluster Analysis","Association Rule"],a:1,why:"Regression = supervised, continuous Y. Classification = supervised, discrete Y.",tier:2},
{id:"M3-32",m:3,q:"Which machine learning type uses UNLABELED data?",opts:["Supervised Learning","Unsupervised Learning","Reinforcement Learning","Deductive Learning"],a:1,why:"Unsupervised = problems without answers. Reinforcement learns via reward/punishment.",tier:2},
{id:"M3-01",m:3,q:"Data is extracted every Monday for 2 months. Which sampling method is this?",opts:["Simple Random Sampling","Systematic Sampling","Cluster Sampling","Stratified Random Sampling"],a:1,why:"Regular intervals of time or space = Systematic.",tier:3},
{id:"M3-02",m:3,q:"Which method divides the population into groups and then randomly samples from each group?",opts:["Simple Random","Systematic","Cluster","Stratified Random"],a:3,why:"Stratified — Gallup's 1936 method.",tier:3},
{id:"M3-03",m:3,q:"Which method selects a random cluster and then surveys within it?",opts:["Cluster Sampling","Stratified Sampling","Systematic Sampling","Simple Random Sampling"],a:0,why:"Cluster: pick the cluster first, then survey inside it.",tier:3},
{id:"M3-16",m:3,q:"For data sorted ascending with N values, the median is at which position?",opts:["N/2","(N+1)/2","(N−1)/2","N/2 + 1"],a:1,why:"(N+1)/2. For even N, average the two middle values.",tier:3},
{id:"M3-17",m:3,q:"For data [1, 2, 2, 2, 3] with mean 2, what is the variance?",opts:["0.4","0.5","2.0","1.0"],a:1,why:"Sum of Squares = 2; variance = 2 ÷ (5−1) = 0.5. Divide by n−1, not n.",tier:3},
{id:"M3-18",m:3,q:"Variance is calculated by dividing the Sum of Squares by what?",opts:["n","n − 1","n + 1","√n"],a:1,why:"Sample variance divides by (n − 1).",tier:3},
{id:"M3-21",m:3,q:"In a box plot, outlier fences are placed at what multiple of IQR?",opts:["1.0 × IQR","1.5 × IQR","2.0 × IQR","2.5 × IQR"],a:1,why:"1.5 × IQR marks mild outliers; beyond that are extreme outliers.",tier:3},
{id:"M3-53",m:3,q:"In hypothesis testing, the null hypothesis H0 states:",opts:["There is a difference","There is no difference","The sample is biased","The p-value is significant"],a:1,why:"H0 = no difference; H1 = there is a difference.",tier:3},
{id:"M3-54",m:3,q:"What significance level (α) is normally used?",opts:["1%","5%","10%","50%"],a:1,why:"5% is the deck's stated norm.",tier:3},
{id:"M3-58",m:3,q:"Which metric is most commonly used to evaluate regression model performance?",opts:["P-value","Test R²","IQR","Euclidean distance"],a:1,why:"Test R²; if models tie, Simple is Best.",tier:3},
{id:"M3-08",m:3,q:"In the 1936 election case, why did the Literary Digest poll fail despite surveying 2.36 million people?",opts:["The sample was too small","It surveyed only the affluent class — poor representativeness","It used stratified sampling","The data was collected too late"],a:1,why:"Bias beats size. Gallup got it right with only 1,500 via stratified sampling.",tier:4},
{id:"M3-09",m:3,q:"As data size increases, what happens to errors?",opts:["Both sampling and non-sampling error decrease","Sampling error decreases while non-sampling error increases","Both increase","Neither changes"],a:1,why:"Stated under Sufficiency.",tier:4},
{id:"M3-10",m:3,q:"Gold medal / Silver medal / Bronze medal is which data type?",opts:["Nominal","Ordinal","Interval","Ratio"],a:1,why:"Order exists but the differences aren't defined = Ordinal.",tier:4},
{id:"M3-11",m:3,q:"Temperature is which data type?",opts:["Nominal","Ordinal","Interval","Ratio"],a:2,why:"Interval — no absolute zero point.",tier:4},
{id:"M3-12",m:3,q:"'8m is twice the length of 4m' demonstrates which data type?",opts:["Interval","Ratio","Ordinal","Nominal"],a:1,why:"Ratio data has a true origin at 0, so ratios are meaningful.",tier:4},
{id:"M3-19",m:3,q:"Why are deviations squared before summing?",opts:["To make the unit smaller","Because without squaring the deviations sum to zero","To remove outliers","To convert to a percentage"],a:1,why:"(1−2)+(2−2)+(2−2)+(2−2)+(3−2) = 0, so squaring is required.",tier:4},
{id:"M3-20",m:3,q:"IQR is calculated as:",opts:["Q3 − Q1","Q2 − Q1","Max − Min","Q3 + Q1"],a:0,why:"Interquartile Range = Q3 − Q1, the box body length.",tier:4},
{id:"M3-25",m:3,q:"Line A has 34% defects and Line B 26%, but the P-value is greater than 0.05. What do you conclude?",opts:["Line A is significantly worse","There is no significant difference in defect rate","The data is invalid","Repeat with a chi-square test"],a:1,why:"Raw percentages can differ while the test finds no significant difference.",tier:4},
{id:"M3-26",m:3,q:"A correlation coefficient r = 0.8 but the p-value is 0.09. What is the conclusion?",opts:["Strong correlation confirmed","There is no correlation, regardless of r","Weak but valid correlation","Recalculate r"],a:1,why:"If p > 0.05 there is no correlation no matter what r shows.",tier:4},
{id:"M3-27",m:3,q:"Correlation coefficient r always falls between:",opts:["0 and 1","−1 and 1","−100 and 100","0 and 100"],a:1,why:"−1 to 1; ±1 = perfect linear relationship.",tier:4},
{id:"M3-28",m:3,q:"Which estimation reflects error by giving a range?",opts:["Point Estimation","Interval Estimation","Mode Estimation","Descriptive Estimation"],a:1,why:"Point estimation gives one value and ignores error.",tier:4},
{id:"M3-29",m:3,q:"What Z-score is used for a 95% confidence level?",opts:["1.64","1.96","2.33","2.58"],a:1,why:"95% → Z = 1.96. Sample SD may substitute when n ≥ 30.",tier:4},
{id:"M3-33",m:3,q:"KNN classifies a new point by:",opts:["Fitting a regression line","Calculating Euclidean distance and taking a majority vote of the K nearest","Clustering all data first","Testing a hypothesis"],a:1,why:"Distance → pick K nearest → majority vote.",tier:4},
{id:"M3-35",m:3,q:"'If shoppers buy diapers, they buy beer' is an example of:",opts:["Cluster Analysis","Association Rule Analysis","Regression Analysis","Time Series Analysis"],a:1,why:"Association Rule — the Shopping Cart Rule, If-Then co-occurrence.",tier:4},
{id:"M3-36",m:3,q:"If several predictive models have the same Test R², which should you choose?",opts:["The most complex one","The simplest one — Simple is Best","The one with most variables","The newest algorithm"],a:1,why:"Principles of Economics: simplest adequate model wins.",tier:4},
{id:"M3-37",m:3,q:"Which symbol represents the population standard deviation?",opts:["s","σ","X̄","μ"],a:1,why:"Population: μ, σ², σ. Sample: X̄, s², s.",tier:4},
{id:"M3-38",m:3,q:"X̄ represents:",opts:["Population average","Sample average","Population variance","Sample size"],a:1,why:"X̄ is the sample statistic; μ is the population parameter.",tier:4},
{id:"M3-40",m:3,q:"An athlete won Bronze, Silver, Gold, Gold, Gold. Why is 'average 2.4 medals' meaningless?",opts:["The sample is too small","Medal rank is ordinal — intervals cannot be perceived","Gold should be weighted higher","The mode should always be used"],a:1,why:"Median = Gold, Mode = Gold at 60%. Averaging an ordinal scale is invalid here.",tier:4},
{id:"M3-41",m:3,q:"Which measure of centre is appropriate for nominal data?",opts:["Mean","Median","Mode","Range"],a:2,why:"E.g. 45 men vs 30 women → mode = men at 60% occupancy.",tier:4},
{id:"M3-44",m:3,q:"Which is NOT one of the four EDA types?",opts:["Data distribution","Comparison by category","Changes over time","Hypothesis testing"],a:3,why:"Hypothesis testing is CDA. EDA's fourth type is finding correlations between variables.",tier:4},
{id:"M3-46",m:3,q:"Which graph best shows the relationship between two continuous variables?",opts:["Pie chart","Scatter plot","Pareto chart","Stacked bar chart"],a:1,why:"Scatter plots reveal positive/negative/no correlation.",tier:4},
{id:"M3-49",m:3,q:"Data appears uncorrelated overall, but splits into Product A (negative) and Product B (positive). This is:",opts:["Scope restraint","Group classification / sample fragmentation","Sampling error","An outlier effect"],a:1,why:"'The art of data analysis is to reduce dimensions rather than expand them.'",tier:4},
{id:"M3-51",m:3,q:"Which is NOT one of the five statistics shown by a box plot?",opts:["Minimum","Q1","Mode","Maximum"],a:2,why:"Min, Q1, Median (Q2), Q3, Max — plus outliers. Mode is not shown.",tier:4},
{id:"M3-52",m:3,q:"A box plot is described as especially effective for:",opts:["Predicting future values","Comparing distributions between groups","Testing hypotheses","Calculating correlation"],a:1,why:"Also identifies skew by comparing mean vs median.",tier:4},
{id:"M3-55",m:3,q:"Three age groups rated new product proposals and the P-value was less than 0.05. Conclusion?",opts:["The three groups do not differ","The three groups differ","The test should be redone as a t-test","There is a correlation"],a:1,why:"P < 0.05 → reject H0 → the groups differ. This was the ANOVA case.",tier:4},
{id:"M3-56",m:3,q:"What is the minimum sample size for substituting the sample SD when the population SD is unknown?",opts:["n ≥ 10","n ≥ 20","n ≥ 30","n ≥ 100"],a:2,why:"n ≥ 30 is stated as sufficient observations.",tier:4},
{id:"M4-01",m:4,q:"What is TV Device Data?",opts:["Only broadcast viewing records","All behavioral information data used by users via Smart TVs","Manufacturing data from the TV factory","Retail sales data for TVs"],a:1,why:"All user behavioral data via Smart TV.",tier:5},
{id:"M4-02",m:4,q:"Which log becomes the starting point for data collection?",opts:["Search Log","Activation Log","Normal Log","VOD Selection Log"],a:1,why:"Generated when the user first accesses the server to use the Smart TV.",tier:5},
{id:"M4-03",m:4,q:"Which platform holds device-IDENTIFICATION data?",opts:["Intellytics","T-LAMP","SDP","CPPM"],a:1,why:"T-LAMP = identified device data. Intellytics = non-identification.",tier:5},
{id:"M4-04",m:4,q:"Content usage inside CP apps such as Netflix and YouTube is:",opts:["Collected in full","Collected only with consent","NOT collected","Collected after 5 minutes"],a:2,why:"Explicitly stated as not collected.",tier:5},
{id:"M4-07",m:4,q:"Which is NOT a trigger for TV data destruction?",opts:["Automatic deletion at end of saving period","User request under GDPR/CCPA","Service cancellation / terms withdrawal","Quarterly server maintenance"],a:3,why:"Three triggers only: period expiry, user request, unsubscription.",tier:5},
{id:"M5-01",m:5,q:"What is a Data Lake?",opts:["A backup server","A repository for various types of raw data in LG Electronics","A customer survey tool","A dashboard product"],a:1,why:"Raw data repository, central to LGE's integrate/store layer.",tier:5},
{id:"M5-02",m:5,q:"How do HE members request data extraction or consulting?",opts:["By email to the CEO","Through Jira (HEDATAPLFM project)","Through a paper form","Via the TV settings menu"],a:1,why:"HE Data Platform Task Service runs through Jira.",tier:5},
{id:"M5-03",m:5,q:"Which system detects customer pain points before customers report them?",opts:["HERMES","Hawkeye","HEAVEN","PINE"],a:1,why:"Hawkeye 2.0 (PainKiller) — preemptive pain point detection.",tier:5},
