<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Level 1 — Study App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:   #F2F4F8;
  --grid:     #DDE3ED;
  --panel:    #FFFFFF;
  --ink:      #131722;
  --muted:    #5A6478;
  --series-a: #6B2D8C;
  --series-b: #0E8F87;
  --alert:    #C2384A;
  --amber:    #B0761A;
  --font-display: 'Archivo', 'Helvetica Neue', Arial Narrow, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background-color: var(--ground);
  background-image:
    repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 24px),
    repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 24px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}

a { color: var(--series-a); }

/* ---------- focus ---------- */
:focus-visible{
  outline: 2px solid var(--series-a);
  outline-offset: 2px;
  border-radius: 2px;
}

/* ---------- layout shell ---------- */
.app-shell{
  max-width: 900px;
  margin: 0 auto;
  min-height: 100vh;
  background: rgba(255,255,255,0.0);
}

header.site-header{
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--panel);
  border-bottom: 1px solid var(--grid);
  padding: 10px 16px 12px;
}
.header-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  flex-wrap: wrap;
}
.brand{
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.02em;
  font-size: 1.15rem;
  text-transform: uppercase;
}
.brand small{
  display:block;
  font-family: var(--font-body);
  font-weight: 400;
  text-transform: none;
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: normal;
  margin-top: 2px;
}
.score-readout{
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--muted);
  text-align:right;
  white-space: nowrap;
}
.score-readout b{ color: var(--ink); font-size:1rem; }
.score-label{ color: var(--series-a); font-weight: 700; letter-spacing: 0.04em; margin-right: 2px; }

/* ---------- the pass line ---------- */
.pass-line{
  position: relative;
  margin-top: 10px;
  height: 34px;
}
.pass-line-track{
  position: relative;
  height: 14px;
  background: var(--ground);
  border: 1px solid var(--grid);
  border-radius: 2px;
  overflow: visible;
}
.pass-line-fill{
  position: absolute;
  top:0; left:0; bottom:0;
  width: 0%;
  background: var(--series-a);
  transition: width 0.25s ease, background-color 0.25s ease;
}
.pass-line-fill.pass{ background: var(--series-b); }
.pass-line-ticks{
  position: relative;
  height: 16px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--muted);
}
.pass-line-ticks i{
  position:absolute;
  top:2px;
  transform: translateX(-50%);
  border-left: 1px solid var(--grid);
  padding-left: 3px;
  font-style: normal;
  height: 6px;
}
.pass-line-rule{
  position:absolute;
  top:-4px; bottom:-4px;
  left: 80%;
  width: 0;
  border-left: 2px solid var(--alert);
}
.pass-line-rule .pass-label{
  position:absolute;
  top:-16px;
  left: 4px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--alert);
  white-space: nowrap;
}

/* ---------- tab bar ---------- */
nav.tab-bar{
  position: sticky;
  top: 0;
  z-index: 29;
  display:flex;
  gap: 4px;
  overflow-x: auto;
  background: var(--panel);
  border-bottom: 1px solid var(--grid);
  padding: 0 12px;
  -webkit-overflow-scrolling: touch;
}
nav.tab-bar.stuck{ top: 0; }
.tab-btn{
  font-family: var(--font-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  font-size: 0.82rem;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  padding: 12px 12px 10px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
.tab-btn:hover{ color: var(--ink); }
.tab-btn[aria-selected="true"]{
  color: var(--ink);
  border-bottom-color: var(--series-a);
}

main{ padding: 16px; padding-bottom: 60px; }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

/* ---------- shared card/panel ---------- */
.panel{
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: 4px;
  padding: 16px;
}
.panel + .panel{ margin-top: 12px; }

.mono{ font-family: var(--font-mono); }
.muted{ color: var(--muted); }

.badge{
  display:inline-block;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid currentColor;
}
.badge-easy{ color: var(--series-b); }
.badge-medium{ color: var(--amber); }
.badge-high{ color: var(--alert); }
.badge-deck{ color: var(--series-a); }
.badge-notes{ color: var(--amber); }
.badge-past{ color: var(--series-b); }

table{
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  margin: 10px 0;
}
caption{ text-align:left; font-family: var(--font-mono); font-size:0.72rem; color:var(--muted); margin-bottom:4px; }
th, td{
  text-align: left;
  border: 1px solid var(--grid);
  padding: 6px 8px;
  vertical-align: top;
}
th{
  background: var(--ground);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.table-wrap{ overflow-x:auto; }

mark{
  background: #FCE8B4;
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}

button{ font-family: inherit; }

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; animation: none !important; }
}

/* ---------- chips / controls ---------- */
.chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  font-family: var(--font-mono);
  font-size: 0.78rem;
  background: var(--ground);
  border: 1px solid var(--grid);
  border-radius: 3px;
  padding: 6px 10px;
  color: var(--ink);
  cursor: pointer;
}
.chip:hover{ border-color: var(--series-a); }
.chip-active{
  background: var(--series-a);
  border-color: var(--series-a);
  color: #fff;
}
.chip-ghost{ color: var(--muted); }
.drill-controls{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; }
.drill-toggles{ display:flex; gap:6px; }

/* ---------- drill question ---------- */
.q-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:0.72rem; color:var(--muted); margin-bottom:10px; }
.flag-btn{
  margin-left:auto;
  background:none;
  border:1px solid var(--grid);
  border-radius:3px;
  padding:4px 8px;
  font-family: var(--font-mono);
  font-size:0.7rem;
  color: var(--muted);
  cursor:pointer;
}
.flag-active{ border-color: var(--amber); color: var(--amber); }
.q-text{
  font-size: 1.05rem;
  font-weight: 600;
  margin: 4px 0 16px;
}
.opt-list{ display:flex; flex-direction:column; gap:8px; }
.option{
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  background: var(--panel);
  border: 1px solid var(--grid);
  border-radius: 4px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 0.92rem;
  color: var(--ink);
}
.option:hover:not(:disabled){ border-color: var(--series-a); }
.option:disabled{ cursor: default; }
.opt-letter{
  flex: 0 0 auto;
  width: 22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  border: 1px solid var(--grid);
  border-radius: 3px;
  font-size: 0.72rem;
  color: var(--muted);
}
.opt-correct{ border-color: var(--series-b); background: rgba(14,143,135,0.08); }
.opt-correct .opt-letter{ border-color: var(--series-b); color: var(--series-b); }
.opt-wrong{ border-color: var(--alert); background: rgba(194,56,74,0.08); }
.opt-wrong .opt-letter{ border-color: var(--alert); color: var(--alert); }
.why-line{
  margin-top: 14px;
  padding: 10px 12px;
  background: var(--ground);
  border-left: 3px solid var(--series-a);
  font-size: 0.88rem;
  color: var(--ink);
}
.drill-progress{ margin-top: 14px; font-size: 0.72rem; }
.drill-actions{ margin-top: 12px; display:flex; gap:10px; flex-wrap:wrap; }

/* ---------- blanks ---------- */
.blank-sentence{
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 2.1;
  margin: 4px 0 6px;
}
.blank-input{
  font-family: var(--font-mono);
  font-size: 0.95rem;
  text-align: center;
  border: none;
  border-bottom: 2px solid var(--series-a);
  background: transparent;
  color: var(--ink);
  padding: 2px 4px;
  margin: 0 2px;
  min-width: 3ch;
}
.blank-input:disabled{ opacity: 1; }
.blank-input.blank-correct{ border-color: var(--series-b); color: var(--series-b); font-weight: 700; }
.blank-input.blank-wrong{ border-color: var(--alert); color: var(--alert); font-weight: 700; }
.blank-input.blank-revealed{ border-color: var(--amber); color: var(--amber); font-weight: 700; }
.blank-answer-reveal{
  display: inline-block;
  font-size: 0.78rem;
  color: var(--series-b);
  margin-left: 4px;
  white-space: nowrap;
}
.blank-hint{
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--ground);
  border-left: 3px solid var(--amber);
  font-size: 0.85rem;
  color: var(--ink);
}
.blank-revealed-note{
  margin-top: 10px;
  font-size: 0.78rem;
  color: var(--amber);
}
.btn-primary, .btn-ghost{
  font-family: var(--font-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 0.8rem;
  border-radius: 3px;
  padding: 10px 16px;
  cursor: pointer;
}
.btn-primary{ background: var(--series-a); border: 1px solid var(--series-a); color: #fff; }
.btn-primary:disabled{ opacity: 0.4; cursor:default; }
.btn-ghost{ background: var(--panel); border: 1px solid var(--grid); color: var(--ink); }
.btn-ghost:disabled{ opacity: 0.4; cursor:default; }

/* ---------- study ---------- */
.search-label{ display:block; font-size:0.7rem; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em; }
.search-input{
  width: 100%;
  font-family: var(--font-body);
  font-size: 0.95rem;
  padding: 10px 12px;
  border: 1px solid var(--grid);
  border-radius: 4px;
  background: var(--ground);
  color: var(--ink);
}
.module-header{
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
}
.module-title{ font-weight: 700; flex: 1 1 auto; }
.module-num{ color: var(--series-a); margin-right: 4px; }
.chevron{ font-family: var(--font-mono); color: var(--muted); width: 16px; text-align:center; }
.module-body{ margin-top: 12px; }
.block-h{ font-family: var(--font-display); text-transform: uppercase; letter-spacing:0.02em; font-size: 0.95rem; margin: 18px 0 6px; }
.block-h:first-child{ margin-top: 0; }
.block-h4{ font-family: var(--font-display); font-size: 0.82rem; color: var(--muted); text-transform: uppercase; letter-spacing:0.03em; margin: 14px 0 4px; }
.module-body p, .module-body ul, .module-body ol{ font-size: 0.9rem; }
.module-body ul, .module-body ol{ padding-left: 1.2em; }
.module-body li{ margin: 3px 0; }

/* ---------- cards ---------- */
.cards-panel{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.cards-counter{ align-self:flex-end; font-size:0.78rem; }
.flashcard{
  position: relative;
  width: 100%;
  min-height: 200px;
  perspective: 1200px;
  cursor: pointer;
}
.flashcard-tall{ min-height: 280px; }
.flashcard-face{
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border: 1px solid var(--grid);
  border-radius: 4px;
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transform: rotateY(0deg);
  transition: transform 0.35s ease;
}
.flashcard-back{ transform: rotateY(180deg); background: var(--ground); }
.flashcard.is-flipped .flashcard-front{ transform: rotateY(-180deg); }
.flashcard.is-flipped .flashcard-back{ transform: rotateY(0deg); }
.flashcard-scroll{ max-height: 100%; overflow-y: auto; text-align: center; font-size: 0.95rem; line-height:1.45; }
.flashcard-back .flashcard-scroll{ font-family: var(--font-mono); font-size: 0.85rem; text-align:left; }
.cards-nav{ display:flex; gap:8px; }

/* ---------- cheat ---------- */
.cheat-title{ margin-top:0; }
.cheat-sheet ul{ margin: 4px 0 12px; }

/* ---------- check ---------- */
.check-note p{ margin:0; font-size:0.9rem; color:var(--muted); }
.check-card{ display:flex; flex-direction:column; gap:6px; }
.check-claim{ font-weight:700; }
.check-deck{ font-size: 0.88rem; color: var(--ink); }
.check-resolution{ font-size: 0.88rem; color: var(--series-b); padding-top: 4px; border-top: 1px solid var(--grid); }

/* ---------- print ---------- */
@media print{
  body{ background: #fff !important; }
  header.site-header, nav.tab-bar, #tab-drill, #tab-blanks, #tab-study, #tab-cards, #tab-check{ display:none !important; }
  .panel{ border: none; padding: 0; }
  main{ padding: 0; }
  .cheat-sheet{ break-inside: avoid; }
}

/* ---------- responsive ---------- */
@media (max-width: 420px){
  .brand{ font-size: 1rem; }
  .score-readout{ font-size: 0.78rem; }
  main{ padding: 10px; }
  .panel{ padding: 12px; }
}

</style>
</head>
<body>
<div class="app-shell">

<header class="site-header">
  <div class="header-row">
    <div class="brand">DX LEVEL 1<small>2024 HE Domain &middot; 80 to pass</small></div>
    <div class="score-readout" id="scoreReadout"><span class="score-label mono" id="scoreLabel">DRILL</span> <b id="scorePct">0%</b> &middot; <span id="scoreFrac">0/0</span></div>
  </div>
  <div class="pass-line" aria-hidden="false" role="img" aria-label="Score progress against the 80 percent pass line">
    <div class="pass-line-track">
      <div class="pass-line-fill" id="passFill"></div>
      <div class="pass-line-rule"><span class="pass-label">PASS</span></div>
    </div>
    <div class="pass-line-ticks">
      <i style="left:0%">0</i><i style="left:25%">25</i><i style="left:50%">50</i><i style="left:75%">75</i><i style="left:100%">100</i>
    </div>
  </div>
</header>

<nav class="tab-bar" id="tabBar" role="tablist" aria-label="Sections">
  <button class="tab-btn" role="tab" data-tab="drill" aria-selected="true">Drill</button>
  <button class="tab-btn" role="tab" data-tab="blanks" aria-selected="false">Blanks</button>
  <button class="tab-btn" role="tab" data-tab="study" aria-selected="false">Study</button>
  <button class="tab-btn" role="tab" data-tab="cards" aria-selected="false">Cards</button>
  <button class="tab-btn" role="tab" data-tab="cheat" aria-selected="false">Cheat</button>
  <button class="tab-btn" role="tab" data-tab="check" aria-selected="false">Check</button>
</nav>

<main>
  <section class="tab-panel active" id="tab-drill"></section>
  <section class="tab-panel" id="tab-blanks"></section>
  <section class="tab-panel" id="tab-study"></section>
  <section class="tab-panel" id="tab-cards"></section>
  <section class="tab-panel" id="tab-cheat"></section>
  <section class="tab-panel" id="tab-check"></section>
</main>

</div>

<script>
"use strict";
const QUESTIONS = [
{id:"M1-01",m:1,q:"What is the fundamental definition of Digitization?",opts:["Business Innovation","Digitization of Process","Conversion of Analogue to Digital","Creation of new Business Models"],a:2,why:"Digitization = data layer. Digitalization = process. DX = business."},
{id:"M1-02",m:1,q:"Which term describes the 'Adaption' phase focusing on the digitization of processes?",opts:["Digitalization","Digital Transformation","Data Conversion","Analogue Adaptation"],a:0,why:"Digitalization is the middle stage — adapting processes."},
{id:"M1-03",m:1,q:"What is the 'Common Agreement' on the definition of Digital Transformation?",opts:["Automating manual Excel tasks","Business Innovation focusing on Digital Technology","Increasing the number of IT staff","Replacing all analogue equipment with sensors"],a:1,why:"The deck's stated common agreement, verbatim."},
{id:"M1-04",m:1,q:"Fill the blanks: Digitalization of (___) — Digitization of (___) — (___) innovation",opts:["Process / Information / Data","Information / Process / Business","Business / Data / Process","Data / Business / Information"],a:1,why:"Information → Process → Business. A known subjective question."},
{id:"M1-05",m:1,q:"Which economy is associated with Airbnb and Socar?",opts:["Subscription Economy","Platform Economy","Sharing Economy","On-Demand Economy"],a:2,why:"Sharing Economy — shared access to assets."},
{id:"M1-06",m:1,q:"Which economic model is exemplified by Netflix and Dollar Shave Club?",opts:["Sharing Economy","Subscription Economy","On-Demand Economy","Traditional Economy"],a:1,why:"Recurring payment for ongoing access = Subscription."},
{id:"M1-07",m:1,q:"The 'Platform Economy' is represented by which group?",opts:["Netflix, YouTube, Hulu","Airbnb, Zipcar, Lyft","Facebook, Instagram, TikTok","Uber, Starbucks, Amazon"],a:2,why:"Social platforms connecting many-to-many users."},
{id:"M1-08",m:1,q:"Which is NOT part of the Starbucks Digital Flywheel?",opts:["Rewards","Payment","Personalization","Physical Store Expansion"],a:3,why:"The flywheel is Rewards, Payment, Personalization, Ordering — all digital."},
{id:"M1-09",m:1,q:"When did Starbucks introduce Free Wi-Fi in all branches?",opts:["2008","2012","2015","2021"],a:0,why:"Free Wi-Fi 2008; Fast Drive Thru 2012."},
{id:"M1-10",m:1,q:"What did Starbucks introduce in 2012?",opts:["Siren Order","Fast Drive Thru","Mobile Payment","Customized Menu"],a:1,why:"2012 = Fast Drive Thru."},
{id:"M1-11",m:1,q:"Nike's D2C stands for what?",opts:["Data to Computer","Digital to Consumer","Direct Communication with customers","Delivery to Cloud"],a:2,why:"The deck spells it as Direct Communication with customers."},
{id:"M1-12",m:1,q:"Which Nike acquisition provided 'Preference/Behavior Data'?",opts:["RTFKT","Zodiac","NRC","NTC"],a:1,why:"Zodiac = behavior data. RTFKT = Fashion NFT."},
{id:"M1-13",m:1,q:"What is Nike's Metaverse + NFT service called?",opts:["Nike Training Club","Nike Running Club","Nike Cryptokicks","Nike Digital Flywheel"],a:2,why:"Cryptokicks = Metaverse + NFT."},
{id:"M1-14",m:1,q:"What share of Nike's annual sales is targeted for D2C by 2025?",opts:["25%","30%","50%","70%"],a:2,why:"30% at the time of the deck, targeting 50% by '25."},
{id:"M1-15",m:1,q:"Which Nike community engages runners?",opts:["NTC","NRC","RTFKT","SNKRS"],a:1,why:"NRC = Nike Running Club; NTC = Nike Training Club."},
{id:"M1-16",m:1,q:"Which Amazon service targets students?",opts:["Prime Student","Amazon Locker","Prime Video","Whole Foods Discount"],a:0,why:"Prime Student is the named student benefit."},
{id:"M1-17",m:1,q:"Does DX require learning and using every latest technology?",opts:["Yes, all tech is mandatory","No — the focus is business model innovation","Only for tech-industry companies","Only for the CEO"],a:1,why:"The deck answers 'No' to both tech questions explicitly."},
{id:"M1-18",m:1,q:"'Introduction of Digital Technology ≠ ______'",opts:["Business Innovation","Completion of DX","Data Literacy","Operational Efficiency"],a:1,why:"Adopting tech is not the same as completing DX."},
{id:"M1-19",m:1,q:"What is described as 'a key digital capability and a way to understand customers and businesses'?",opts:["3D Printing","The use of Big Data","Robotic arms","New materials"],a:1,why:"Big data use is the named key capability."},
{id:"M1-20",m:1,q:"DX success rate in traditional industries (oil, automobiles, pharma) as of 2019?",opts:["4–11%","26%","30%","70%"],a:0,why:"4–11% traditional; below 26% even in digital industries."},
{id:"M1-21",m:1,q:"Overall DX success rate in 2017?",opts:["5%","8%","12%","20%"],a:0,why:"5% in 2017 → 8% in 2019."},
{id:"M1-22",m:1,q:"Most common reason companies fail at DX?",opts:["Lack of budget","Focusing only on 'Introducing Technology' and overlooking 'People'","Using too much Big Data","Not enough cloud storage"],a:1,why:"People — the actual subject of execution — is the overlooked factor."},
{id:"M1-23",m:1,q:"What is the correct order of the Journey for Cultural Consensus?",opts:["Understand → Recognize → Accept → Participate","Recognize → Understand → Accept → Participate","Recognize → Accept → Understand → Participate","Accept → Recognize → Understand → Participate"],a:1,why:"Recognize → Understand → Accept → Participate."},
{id:"M1-24",m:1,q:"What is the FINAL stage in the Journey for Cultural Consensus?",opts:["Recognize","Understand","Participate","Accept"],a:2,why:"Participate — participating in the execution of changes."},
{id:"M1-25",m:1,q:"Choose the INCORRECT item as a Citizen Data Scientist capability.",opts:["Propose Task","Securing / Recruiting Top DX Talent","Simple Analysis","Collaboration with a specialized Data Scientist"],a:1,why:"The four are Propose Task, Simple Analysis, Collaboration, Leading Task. Recruiting is a trap."},
{id:"M1-26",m:1,q:"What is a Citizen Data Scientist?",opts:["A professional with a PhD in AI","A field worker with data use capabilities","A government employee who tracks data","An IT technician who repairs sensors"],a:1,why:"Domain expert in the field who gains data capability."},
{id:"M1-27",m:1,q:"Why are Citizen Data Scientists needed?",opts:["Professional data scientists are too expensive","The supply of professional data scientists is insufficient","To replace all professional data scientists","To manage office payroll"],a:1,why:"Market grows ~30%/yr but professional supply is insufficient."},
{id:"M1-28",m:1,q:"Which role transforms practical issues into Data issues?",opts:["DX Project Team","DX Facilitator","Data Engineer","AI Specialist"],a:1,why:"DX Facilitator: find the KPI, turn practical issues into data issues."},
{id:"M1-29",m:1,q:"Which role executes data collection and establishes the DB?",opts:["Data Scientist","AI Specialist","Data Engineer","Data Governance"],a:2,why:"Data Engineer builds collection and databases."},
{id:"M1-30",m:1,q:"Which is responsible for Data Operation Strategy and constructing a Data Portal?",opts:["Data Scientist","Data Governance","DX Facilitator","Project Leader"],a:1,why:"Data Governance owns operation strategy and the portal."},
{id:"M1-31",m:1,q:"What is the primary function of the DX CoE?",opts:["Building physical sensors","Spreading DX special capability and providing Use Cases","Hiring only AI majors","Replacing the Project Leader"],a:1,why:"CoE = Center of Excellence: spread capability, provide use cases, support tasks."},
{id:"M1-32",m:1,q:"Which work style aims to 'completely get rid of the reason of the issue' in advance?",opts:["Corrective","Predictive","Preventive","Traditional"],a:2,why:"Preventive (FMEA, DRBFM). Corrective = PDCA/DMAIC. Predictive = Big Data/AI."},
{id:"M1-33",m:1,q:"Shifting work to 'Predictive' involves using what?",opts:["PDCA and DMAIC","Big Data and AI","FMEA and DRBFM","Manual checks"],a:1,why:"Predictive is the Big Data/AI tier."},
{id:"M1-34",m:1,q:"Which is NOT one of the DX activity axes of the HE Division?",opts:["DX for Customer","DX for Company","Process Innovation","Business Model Innovation"],a:2,why:"The three axes are DX for Customer, DX for Company, Business Model Innovation."},
{id:"M1-35",m:1,q:"In the C-D-P system, which are the three roles of DX?",opts:["Trigger, Accelerator, Tracker","Plan, Do, Check","Collect, Store, Analyze","Define, Measure, Improve"],a:0,why:"Trigger (insight), Accelerator (solutions), Tracker (monitor)."},
{id:"M2-01",m:2,q:"Which organization defines Big Data via Volume, Velocity, and Variety information assets?",opts:["McKinsey","Gartner","IDC","Wikipedia"],a:1,why:"Gartner owns the 3V definition."},
{id:"M2-02",m:2,q:"Which definition describes data beyond the storage/management/analysis scope of a typical DBMS, and is explicitly subjective and changing?",opts:["Gartner","McKinsey","IDC","NIA"],a:1,why:"McKinsey — the definition is subjective and will continue to change."},
{id:"M2-03",m:2,q:"According to the SOURCE DECK, which three V's characterize Big Data?",opts:["Volume, Velocity, Veracity","Volume, Velocity, Variety","Volume, Value, Variety","Velocity, Veracity, Value"],a:1,why:"The deck names Volume, Velocity, Variety (Gartner) and separately lists Variability, Visualization, Volatility.",src:"deck"},
{id:"M2-04",m:2,q:"According to your COMPILED NOTES, the '5 V's' add which two beyond Volume/Velocity/Variety?",opts:["Variability and Volatility","Veracity and Value","Visualization and Variability","Volatility and Visualization"],a:1,why:"Notes say Veracity + Value. The deck does NOT contain these — see the Check tab.",src:"notes"},
{id:"M2-05",m:2,q:"Which is NOT one of the 'More V's' listed in the deck?",opts:["Variability","Visualization","Volatility","Veracity"],a:3,why:"Deck's extras are Variability, Visualization, Volatility."},
{id:"M2-06",m:2,q:"What is the correct containment relationship?",opts:["ML ⊃ AI ⊃ Deep Learning","AI ⊃ Machine Learning ⊃ Deep Learning","Deep Learning ⊃ AI ⊃ ML","AI and ML are separate fields"],a:1,why:"AI is the outermost concept; rule-based algorithms also count as AI."},
{id:"M2-07",m:2,q:"'Rule: rabbits like carrots. Fact: Bunny is a rabbit. Output: Bunny likes carrots.' This is an example of what?",opts:["Deep Learning","Deductive Reasoning (still AI)","Unsupervised Learning","Association Rule"],a:1,why:"Rule-based deductive reasoning is AI without being ML."},
{id:"M2-08",m:2,q:"In the A-B-C relationship, what does Cloud provide?",opts:["Labeled training data","Computing power and data storage","Business strategy","Customer consent"],a:1,why:"A=AI, B=Big Data (more data → higher AI performance), C=Cloud (computing power)."},
{id:"M2-09",m:2,q:"Which statement about big data analysis is INCORRECT?",opts:["Insights can be obtained from big data","Singularities that were overlooked can be captured","We can better understand the population through sample surveys","A case-oriented inductive approach is possible"],a:2,why:"Big data lets you move FROM sample survey TO complete survey — that's the point."},
{id:"M2-10",m:2,q:"Correct order of the development stages of data-driven decision making?",opts:["Prediction → Description → Diagnosis → Prescription","Description → Diagnosis → Prediction → Prescription","Diagnosis → Description → Prediction → Prescription","Description → Prediction → Diagnosis → Prescription"],a:1,why:"What happened → Why → What will happen → What should I do."},
{id:"M2-11",m:2,q:"Which decision-making stage answers 'What should I do?'",opts:["Descriptive","Diagnostic","Predictive","Prescriptive"],a:3,why:"Prescriptive is the highest-value, highest-difficulty stage."},
{id:"M2-12",m:2,q:"The 5-stage data analysis process is based on which methodology?",opts:["CRISP-DM","Six Sigma DMAIC","Agile Scrum","PDCA"],a:0,why:"CRISP-DM = Cross Industry Standard Process for Data Mining."},
{id:"M2-13",m:2,q:"What is the correct order of the 5-stage data analysis process?",opts:["Collect → Define → Preprocess → Visualize → Insight","Define the Issue → Collect/Extract → Preprocess → Visualize/Analyze → Draw and Apply Insight","Define → Preprocess → Collect → Analyze → Insight","Collect → Preprocess → Define → Visualize → Insight"],a:1,why:"Defining the issue always comes first."},
{id:"M3-01",m:3,q:"Data is extracted every Monday for 2 months. Which sampling method is this?",opts:["Simple Random Sampling","Systematic Sampling","Cluster Sampling","Stratified Random Sampling"],a:1,why:"Regular intervals of time or space = Systematic."},
{id:"M3-02",m:3,q:"Which method divides the population into groups and then randomly samples from each group?",opts:["Simple Random","Systematic","Cluster","Stratified Random"],a:3,why:"Stratified — Gallup's 1936 method."},
{id:"M3-03",m:3,q:"Which method selects a random cluster and then surveys within it?",opts:["Cluster Sampling","Stratified Sampling","Systematic Sampling","Simple Random Sampling"],a:0,why:"Cluster: pick the cluster first, then survey inside it."},
{id:"M3-04",m:3,q:"Which data quality means 'regardless of who collects or measures, and no matter how many repetitions, the values should be the same'?",opts:["Timeliness","Validity","Precision","Completeness"],a:2,why:"Precision = repeatability. Accuracy = closeness to the true value."},
{id:"M3-05",m:3,q:"Which data quality means data should be close to the true values?",opts:["Precision","Accuracy","Validity","Consistency"],a:1,why:"Accuracy targets truth; precision targets consistency."},
{id:"M3-06",m:3,q:"Which quality means the meaning and criteria of data are the same regardless of time and space?",opts:["Consistency","Completeness","Timeliness","Sufficiency"],a:0,why:"Consistency — same criteria, unit, measurement method."},
{id:"M3-07",m:3,q:"Which quality is violated when a dataset contains missing values and outliers?",opts:["Validity","Completeness","Timeliness","Representativeness"],a:1,why:"Completeness: appropriate range, no missing values, no outliers."},
{id:"M3-08",m:3,q:"In the 1936 election case, why did the Literary Digest poll fail despite surveying 2.36 million people?",opts:["The sample was too small","It surveyed only the affluent class — poor representativeness","It used stratified sampling","The data was collected too late"],a:1,why:"Bias beats size. Gallup got it right with only 1,500 via stratified sampling."},
{id:"M3-09",m:3,q:"As data size increases, what happens to errors?",opts:["Both sampling and non-sampling error decrease","Sampling error decreases while non-sampling error increases","Both increase","Neither changes"],a:1,why:"Stated under Sufficiency."},
{id:"M3-10",m:3,q:"Gold medal / Silver medal / Bronze medal is which data type?",opts:["Nominal","Ordinal","Interval","Ratio"],a:1,why:"Order exists but the differences aren't defined = Ordinal."},
{id:"M3-11",m:3,q:"Temperature is which data type?",opts:["Nominal","Ordinal","Interval","Ratio"],a:2,why:"Interval — no absolute zero point."},
{id:"M3-12",m:3,q:"'8m is twice the length of 4m' demonstrates which data type?",opts:["Interval","Ratio","Ordinal","Nominal"],a:1,why:"Ratio data has a true origin at 0, so ratios are meaningful."},
{id:"M3-13",m:3,q:"Arrange the data analysis methods in correct sequence.",opts:["DDA → CDA → EDA → PDA","DDA → EDA → CDA → PDA","EDA → DDA → CDA → PDA","DDA → EDA → PDA → CDA"],a:1,why:"Descriptive → Exploratory → Confirmatory → Predictive."},
{id:"M3-14",m:3,q:"Which analysis formulates hypotheses and verifies their truth for decision-making?",opts:["DDA","EDA","CDA","PDA"],a:2,why:"CDA = Confirmatory, the hypothesis-testing stage."},
{id:"M3-15",m:3,q:"Which is NOT affected by outliers?",opts:["Mean","Standard Deviation","Range","Median"],a:3,why:"Median and IQR resist outliers; mean, SD and range do not."},
{id:"M3-16",m:3,q:"For data sorted ascending with N values, the median is at which position?",opts:["N/2","(N+1)/2","(N−1)/2","N/2 + 1"],a:1,why:"(N+1)/2. For even N, average the two middle values."},
{id:"M3-17",m:3,q:"For data [1, 2, 2, 2, 3] with mean 2, what is the variance?",opts:["0.4","0.5","2.0","1.0"],a:1,why:"Sum of Squares = 2; variance = 2 ÷ (5−1) = 0.5. Divide by n−1, not n."},
{id:"M3-18",m:3,q:"Variance is calculated by dividing the Sum of Squares by what?",opts:["n","n − 1","n + 1","√n"],a:1,why:"Sample variance divides by (n − 1)."},
{id:"M3-19",m:3,q:"Why are deviations squared before summing?",opts:["To make the unit smaller","Because without squaring the deviations sum to zero","To remove outliers","To convert to a percentage"],a:1,why:"(1−2)+(2−2)+(2−2)+(2−2)+(3−2) = 0, so squaring is required."},
{id:"M3-20",m:3,q:"IQR is calculated as:",opts:["Q3 − Q1","Q2 − Q1","Max − Min","Q3 + Q1"],a:0,why:"Interquartile Range = Q3 − Q1, the box body length."},
{id:"M3-21",m:3,q:"In a box plot, outlier fences are placed at what multiple of IQR?",opts:["1.0 × IQR","1.5 × IQR","2.0 × IQR","2.5 × IQR"],a:1,why:"1.5 × IQR marks mild outliers; beyond that are extreme outliers."},
{id:"M3-22",m:3,q:"If P-value = 0.03 and α = 0.05, what do you conclude?",opts:["Choose H0 — no difference","Choose H1 — there is a difference","The test is invalid","Increase the sample size"],a:1,why:"P ≤ α → reject H0. P < 0.05 means there IS a difference."},
{id:"M3-23",m:3,q:"Which test compares averages across THREE groups of continuous data?",opts:["2-Sample T-Test","ANOVA","2-Proportion Test","Chi-Square Test"],a:1,why:"3+ groups + continuous = ANOVA."},
{id:"M3-24",m:3,q:"Which test compares a ratio across TWO groups of discrete data?",opts:["2-Sample T-Test","ANOVA","2-Proportion Test","Chi-Square Test"],a:2,why:"2 groups + discrete/ratio = 2-Proportion Test."},
{id:"M3-25",m:3,q:"Line A has 34% defects and Line B 26%, but the P-value is greater than 0.05. What do you conclude?",opts:["Line A is significantly worse","There is no significant difference in defect rate","The data is invalid","Repeat with a chi-square test"],a:1,why:"Raw percentages can differ while the test finds no significant difference."},
{id:"M3-26",m:3,q:"A correlation coefficient r = 0.8 but the p-value is 0.09. What is the conclusion?",opts:["Strong correlation confirmed","There is no correlation, regardless of r","Weak but valid correlation","Recalculate r"],a:1,why:"If p > 0.05 there is no correlation no matter what r shows."},
{id:"M3-27",m:3,q:"Correlation coefficient r always falls between:",opts:["0 and 1","−1 and 1","−100 and 100","0 and 100"],a:1,why:"−1 to 1; ±1 = perfect linear relationship."},
{id:"M3-28",m:3,q:"Which estimation reflects error by giving a range?",opts:["Point Estimation","Interval Estimation","Mode Estimation","Descriptive Estimation"],a:1,why:"Point estimation gives one value and ignores error."},
{id:"M3-29",m:3,q:"What Z-score is used for a 95% confidence level?",opts:["1.64","1.96","2.33","2.58"],a:1,why:"95% → Z = 1.96. Sample SD may substitute when n ≥ 30."},
{id:"M3-30",m:3,q:"What is the process of dividing data into similar groups called?",opts:["Regression Analysis","Classification Analysis","Cluster Analysis","Time Series Analysis"],a:2,why:"Cluster Analysis — unsupervised; homogeneity within, heterogeneity between."},
{id:"M3-31",m:3,q:"Which PDA type uses labeled data with a CONTINUOUS Y?",opts:["Classification Analysis","Regression Analysis","Cluster Analysis","Association Rule"],a:1,why:"Regression = supervised, continuous Y. Classification = supervised, discrete Y."},
{id:"M3-32",m:3,q:"Which machine learning type uses UNLABELED data?",opts:["Supervised Learning","Unsupervised Learning","Reinforcement Learning","Deductive Learning"],a:1,why:"Unsupervised = problems without answers. Reinforcement learns via reward/punishment."},
{id:"M3-33",m:3,q:"KNN classifies a new point by:",opts:["Fitting a regression line","Calculating Euclidean distance and taking a majority vote of the K nearest","Clustering all data first","Testing a hypothesis"],a:1,why:"Distance → pick K nearest → majority vote."},
{id:"M3-34",m:3,q:"Which time series component represents long-term fluctuations due to changes in population, resources, and technology?",opts:["Seasonal","Cycle","Trend","Irregular"],a:2,why:"Trend = long-term. Seasonal = 12-month cycles. Cycle = economic expansion/contraction."},
{id:"M3-35",m:3,q:"'If shoppers buy diapers, they buy beer' is an example of:",opts:["Cluster Analysis","Association Rule Analysis","Regression Analysis","Time Series Analysis"],a:1,why:"Association Rule — the Shopping Cart Rule, If-Then co-occurrence."},
{id:"M3-36",m:3,q:"If several predictive models have the same Test R², which should you choose?",opts:["The most complex one","The simplest one — Simple is Best","The one with most variables","The newest algorithm"],a:1,why:"Principles of Economics: simplest adequate model wins."},
{id:"M4-01",m:4,q:"What is TV Device Data?",opts:["Only broadcast viewing records","All behavioral information data used by users via Smart TVs","Manufacturing data from the TV factory","Retail sales data for TVs"],a:1,why:"All user behavioral data via Smart TV."},
{id:"M4-02",m:4,q:"Which log becomes the starting point for data collection?",opts:["Search Log","Activation Log","Normal Log","VOD Selection Log"],a:1,why:"Generated when the user first accesses the server to use the Smart TV."},
{id:"M4-03",m:4,q:"Which platform holds device-IDENTIFICATION data?",opts:["Intellytics","T-LAMP","SDP","CPPM"],a:1,why:"T-LAMP = identified device data. Intellytics = non-identification."},
{id:"M4-04",m:4,q:"Content usage inside CP apps such as Netflix and YouTube is:",opts:["Collected in full","Collected only with consent","NOT collected","Collected after 5 minutes"],a:2,why:"Explicitly stated as not collected."},
{id:"M4-05",m:4,q:"Broadcast Watching Log requires a minimum use duration of:",opts:["1 minute","5 minutes","10 minutes","30 minutes"],a:1,why:"Minimum 5 minutes of use under watching-information consent."},
{id:"M4-06",m:4,q:"Which is NOT one of the three TV data collection review gates?",opts:["Legal Review","Privacy Compliance","CP Contract Review","Marketing Approval"],a:3,why:"The three gates are Legal Review, Privacy Compliance, CP Contract Review."},
{id:"M4-07",m:4,q:"Which is NOT a trigger for TV data destruction?",opts:["Automatic deletion at end of saving period","User request under GDPR/CCPA","Service cancellation / terms withdrawal","Quarterly server maintenance"],a:3,why:"Three triggers only: period expiry, user request, unsubscription."},
{id:"M4-08",m:4,q:"The TV data storage flow is:",opts:["1 week then 1 year","1 month then 2 years","3 months then 5 years","Indefinite retention"],a:1,why:"Single unit of data stored 1 month, then 2 years in T-LAMP/Intellytics/SDP."},
{id:"M5-01",m:5,q:"What is a Data Lake?",opts:["A backup server","A repository for various types of raw data in LG Electronics","A customer survey tool","A dashboard product"],a:1,why:"Raw data repository, central to LGE's integrate/store layer."},
{id:"M5-02",m:5,q:"How do HE members request data extraction or consulting?",opts:["By email to the CEO","Through Jira (HEDATAPLFM project)","Through a paper form","Via the TV settings menu"],a:1,why:"HE Data Platform Task Service runs through Jira."},
{id:"M5-03",m:5,q:"Which system detects customer pain points before customers report them?",opts:["HERMES","Hawkeye","HEAVEN","PINE"],a:1,why:"Hawkeye 2.0 (PainKiller) — preemptive pain point detection."},
{id:"M5-04",m:5,q:"Which two lakes are virtually integrated in the Data Portal?",opts:["DDL and EDL","T-LAMP and SDP","CDP and CRM","GMP and OBS"],a:0,why:"Device Data Lake and Enterprise Data Lake, joined by Data Virtualization."},
{id:"M5-05",m:5,q:"Which team primarily uses CPPM and customer profile data?",opts:["R&D","CS / Quality","Platform Business","Procurement"],a:1,why:"CS/Quality works on purchased-customer VoC and pain points."},
{id:"M6-01",m:6,q:"DEJ stands for:",opts:["Data Engineering Journey","Development Experience Journey","Digital Enterprise Journey","Device Evaluation Journey"],a:1,why:"The R&D-side counterpart to CEJ."},
{id:"M6-02",m:6,q:"In DEJ 3333, what does the first '3!' target?",opts:["Check Pain Point/Requirement in 3 hours","Respond within 3 days","3 CX values per year","30% satisfaction increase"],a:0,why:"3 hours → 3 days → 3 values/year → 30% satisfaction."},
{id:"M6-03",m:6,q:"Which DEJ phase covers 2024–2025?",opts:["DEJ 1.0","DEJ 2.0","DEJ 3.0","DEJ 4.0"],a:1,why:"1.0 = 2018–2023; 2.0 = 2024–2025; 3.0 = 2026~."},
{id:"M6-04",m:6,q:"What are the 5 Main Customer Experiences (3C 2S)?",opts:["Connectivity, Core, Customization, Servitization, Sustainability","Connectivity, Care, Customization, Servitization, Sustainability","Connectivity, Care, Cost, Servitization, Sustainability","Connectivity, Care, Customization, Service, Speed"],a:1,why:"Care, not Core. Your compiled notes have this wrong — see the Check tab."},
{id:"M6-05",m:6,q:"HE's stated vision phrase is:",opts:["Life's Good","Sync to You, Open to All","Innovation for All","Customer First, Always"],a:1,why:"Sync to You, Open to All."},
{id:"M1-36",m:1,q:"What is the stated CX Mission?",opts:["Market Leadership","Customer Delight","Zero Defects","Digital First"],a:1,why:"Mission = Customer Delight; Core Values = F.U.N; Basic Values = Q.C.D."},
{id:"M1-37",m:1,q:"What does F.U.N stand for in CX Core Values?",opts:["Fast, Useful, New","First, Unique, New","Friendly, Universal, Novel","Focused, Unified, Natural"],a:1,why:"First (No.1 beyond expectations), Unique (life-changing), New (never-before)."},
{id:"M1-38",m:1,q:"Q.C.D — the CX Basic Values — stands for:",opts:["Quality, Cost, Delivery","Quick, Clear, Direct","Quality, Customer, Data","Quantity, Cost, Design"],a:0,why:"The baseline values beneath F.U.N."},
{id:"M1-39",m:1,q:"The 9 CEJ stages are grouped into which three phases?",opts:["Plan, Do, Check","Explore, Purchase, Use","Aware, Decide, Replace","Collect, Store, Analyze"],a:1,why:"Explore (1–3), Purchase (4–6), Use (7–9), with Feedback throughout."},
{id:"M1-40",m:1,q:"Which is the 6th stage of the CEJ?",opts:["Deliver","On-board","Use","Purchase"],a:1,why:"Aware, Explore, Decide, Purchase, Deliver, On-board, Use, Maintain, Replace."},
{id:"M1-41",m:1,q:"Which is NOT one of the 4 elements the C-D-P Management System redesigns?",opts:["Organization","Process","Performance management","Product portfolio"],a:3,why:"The four are Organization, Process, Performance management, Corporate culture."},
{id:"M1-42",m:1,q:"In the '21 DDM best-practice case, which segment was targeted?",opts:["First-time TV buyers","Customers with a UHD TV more than 5 years old","Customers in the 20s age group","Commercial display buyers"],a:1,why:"Replacement-cycle targeting via discounts on the Smart TV home screen."},
{id:"M1-43",m:1,q:"NPS is calculated as:",opts:["% satisfaction − % dissatisfaction","% of promoters − % of detractors","Revenue ÷ subscribers","Acquisition + Retention + Engagement"],a:1,why:"NPS = promoters − detractors (loyalty). CXR = satisfaction − dissatisfaction."},
{id:"M1-44",m:1,q:"CXR is calculated as:",opts:["% of promoters − % of detractors","% satisfaction − % dissatisfaction","Total revenue ÷ users","Monthly active users"],a:1,why:"CXR measures product/contact-point competitiveness."},
{id:"M1-45",m:1,q:"Which index measures satisfaction from the 'Moment of Truth' / customer contact point?",opts:["CXR-P","CXR-Mot","NPS","A.R.E"],a:1,why:"CXR-Mot covers store, delivery, CS, care. CXR-P covers product use."},
{id:"M1-46",m:1,q:"ARPU is defined as:",opts:["Total revenue ÷ number of subscribers","Promoters minus detractors","Monthly active users","Acquisition rate per user"],a:0,why:"Average Revenue Per User."},
{id:"M1-47",m:1,q:"A.R.E Index stands for:",opts:["Analyze, Report, Execute","Acquisition, Retention, Engagement","Awareness, Reach, Effectiveness","Accuracy, Reliability, Efficiency"],a:1,why:"Measures customer loyalty by stage."},
{id:"M1-48",m:1,q:"Which is LGE's in-house integrated analytics system for AI and big data?",opts:["Data Lake","Intellytics","CPPM","Data NXI"],a:1,why:"Intellytics. Data Lake = raw data repository. CPPM = pain point management."},
{id:"M1-49",m:1,q:"Which role sets the budget and value-evaluates the final products?",opts:["Project Leader","Champion / Sponsor","DX Facilitator","Data Governance"],a:1,why:"Champion/Sponsor presents core tasks, stimulates the project, sets budget."},
{id:"M2-14",m:2,q:"Which source defines Big Data as next-generation technology to draw value from large-scale data at super-fast speed?",opts:["Gartner","McKinsey","IDC","NIA"],a:2,why:"IDC — super-fast collection, discovery, analysis."},
{id:"M2-15",m:2,q:"Which source describes Big Data as the overall process/platform covering HW, SW and all processes?",opts:["Wikipedia","NIA","Gartner","IDC"],a:1,why:"NIA = National Information Society Agency."},
{id:"M2-16",m:2,q:"What is the correct data speed spectrum?",opts:["Real Time → Near Real Time → Periodic → Batch","Batch → Periodic → Near Real Time → Real Time","Periodic → Batch → Real Time → Near Real Time","Batch → Real Time → Periodic → Near Real Time"],a:1,why:"Slowest to fastest: Batch → Periodic → Near Real Time → Real Time."},
{id:"M2-17",m:2,q:"What is the correct data scale spectrum?",opts:["TB → PB → EB → ZB → YB","TB → EB → PB → ZB → YB","PB → TB → EB → YB → ZB","GB → TB → ZB → EB → PB"],a:0,why:"Tera → Peta → Exa → Zetta → Yotta."},
{id:"M2-18",m:2,q:"Which two characteristics make Excel insufficient for Big Data?",opts:["Velocity and Value","Volume and Variety","Veracity and Volume","Variety and Volatility"],a:1,why:"Size it can't handle, plus structured/semi/unstructured types."},
{id:"M2-19",m:2,q:"What is the primary target of Text Mining?",opts:["Numerical data","Categorized data","Text","Images only"],a:2,why:"Data Mining targets numerical/categorized data; Text Mining targets text."},
{id:"M2-20",m:2,q:"Which method is used by Text Mining but NOT by Data Mining?",opts:["Machine Learning","Ontology and Language Process","Regression","Clustering"],a:1,why:"Text Mining adds Indexing, Language Process, Ontology."},
{id:"M2-21",m:2,q:"Text Mining is best described as:",opts:["A type of structured data mining","A type of unstructured data mining","A statistical hypothesis test","A sampling method"],a:1,why:"Explicitly stated in the deck."},
{id:"M2-22",m:2,q:"Deep Learning is defined as:",opts:["Any rule-based algorithm","Processing information in an artificial neural network similar to human neurons","A method of collecting big data","A cloud storage technique"],a:1,why:"DL is one of several ML methods, using neural networks."},
{id:"M2-23",m:2,q:"Which is NOT listed as a machine learning algorithm in the deck?",opts:["Random Forest","Support Vector Machine","K-Nearest Neighbor","Chi-Square Test"],a:3,why:"Chi-square is a hypothesis test, not an ML algorithm."},
{id:"M2-24",m:2,q:"Regarding singularities, the deck states:",opts:["Singularities should always be deleted","Sometimes the occurrence of singularity itself is a hidden pattern","Singularities only occur in small data","Singularities invalidate the analysis"],a:1,why:"Capturing overlooked singularities is one of the four advantages."},
{id:"M2-25",m:2,q:"Big data enables which reasoning approach?",opts:["Only deduction","A case-oriented inductive approach","Neither induction nor deduction","Only rule-based reasoning"],a:1,why:"Induction from cases; 'data is a representation of facts.'"},
{id:"M2-26",m:2,q:"Who said 'It's easy to lie with statistics, but it's hard to tell the truth without statistics'?",opts:["John Tukey","Andrejs Dunkels","Gartner","W. Edwards Deming"],a:1,why:"Dunkels — quoted in the DDDM section. Tukey is quoted in the EDA section."},
{id:"M2-27",m:2,q:"An A/B test is best described as:",opts:["Testing two hypotheses with ANOVA","Providing version A and B to two user groups and comparing results","Splitting data into training and test sets","Comparing two sampling methods"],a:1,why:"Used in digital marketing and business decision-making."},
{id:"M3-37",m:3,q:"Which symbol represents the population standard deviation?",opts:["s","σ","X̄","μ"],a:1,why:"Population: μ, σ², σ. Sample: X̄, s², s."},
{id:"M3-38",m:3,q:"X̄ represents:",opts:["Population average","Sample average","Population variance","Sample size"],a:1,why:"X̄ is the sample statistic; μ is the population parameter."},
{id:"M3-39",m:3,q:"'Would you cross a river with an average depth of 1 metre?' illustrates:",opts:["The Flaw of Average","Sampling error","The Central Limit Theorem","Outlier detection"],a:0,why:"Actual depths were 0.5M and 3.2M — the mean hides the spread."},
{id:"M3-40",m:3,q:"An athlete won Bronze, Silver, Gold, Gold, Gold. Why is 'average 2.4 medals' meaningless?",opts:["The sample is too small","Medal rank is ordinal — intervals cannot be perceived","Gold should be weighted higher","The mode should always be used"],a:1,why:"Median = Gold, Mode = Gold at 60%. Averaging an ordinal scale is invalid here."},
{id:"M3-41",m:3,q:"Which measure of centre is appropriate for nominal data?",opts:["Mean","Median","Mode","Range"],a:2,why:"E.g. 45 men vs 30 women → mode = men at 60% occupancy."},
{id:"M3-42",m:3,q:"How many data points are needed in 3 dimensions if 10 suffice in 1 dimension?",opts:["30","100","1000","10000"],a:2,why:"10 → 100 → 1000. More variables need exponentially more data."},
{id:"M3-43",m:3,q:"Which is NOT part of a Data Quality Report?",opts:["Number of missing values","Number of outliers","Data size","Company revenue"],a:3,why:"Quality block: type, size, missing, outliers, consistency. Summary: average, mode, median, SD."},
{id:"M3-44",m:3,q:"Which is NOT one of the four EDA types?",opts:["Data distribution","Comparison by category","Changes over time","Hypothesis testing"],a:3,why:"Hypothesis testing is CDA. EDA's fourth type is finding correlations between variables."},
{id:"M3-45",m:3,q:"Which graph is most suitable for checking share by category for a discrete variable?",opts:["Histogram","Scatter plot","Pareto chart","Control chart"],a:2,why:"Discrete → pie, donut, stacked bar, Pareto."},
{id:"M3-46",m:3,q:"Which graph best shows the relationship between two continuous variables?",opts:["Pie chart","Scatter plot","Pareto chart","Stacked bar chart"],a:1,why:"Scatter plots reveal positive/negative/no correlation."},
{id:"M3-47",m:3,q:"Who said EDA is 'the attitude, flexibility, and spontaneity to discover what we believe exists, as well as what we believe does not exist'?",opts:["Andrejs Dunkels","John Tukey","Gartner","Alan Turing"],a:1,why:"Tukey, the originator of EDA."},
{id:"M3-48",m:3,q:"Roughly what proportion of EDA findings may simply confirm what is already known?",opts:["20%","50%","80%","100%"],a:2,why:"About 80% — results still need validation and interpretation to yield insight."},
{id:"M3-49",m:3,q:"Data appears uncorrelated overall, but splits into Product A (negative) and Product B (positive). This is:",opts:["Scope restraint","Group classification / sample fragmentation","Sampling error","An outlier effect"],a:1,why:"'The art of data analysis is to reduce dimensions rather than expand them.'"},
{id:"M3-50",m:3,q:"A correlation is visible over a wide range but disappears over a narrow range. This caution is called:",opts:["Sample fragmentation","Scope/range constraint","Non-sampling error","Multicollinearity"],a:1,why:"Always check the range of the analysis scope."},
{id:"M3-51",m:3,q:"Which is NOT one of the five statistics shown by a box plot?",opts:["Minimum","Q1","Mode","Maximum"],a:2,why:"Min, Q1, Median (Q2), Q3, Max — plus outliers. Mode is not shown."},
{id:"M3-52",m:3,q:"A box plot is described as especially effective for:",opts:["Predicting future values","Comparing distributions between groups","Testing hypotheses","Calculating correlation"],a:1,why:"Also identifies skew by comparing mean vs median."},
{id:"M3-53",m:3,q:"In hypothesis testing, the null hypothesis H0 states:",opts:["There is a difference","There is no difference","The sample is biased","The p-value is significant"],a:1,why:"H0 = no difference; H1 = there is a difference."},
{id:"M3-54",m:3,q:"What significance level (α) is normally used?",opts:["1%","5%","10%","50%"],a:1,why:"5% is the deck's stated norm."},
{id:"M3-55",m:3,q:"Three age groups rated new product proposals and the P-value was less than 0.05. Conclusion?",opts:["The three groups do not differ","The three groups differ","The test should be redone as a t-test","There is a correlation"],a:1,why:"P < 0.05 → reject H0 → the groups differ. This was the ANOVA case."},
{id:"M3-56",m:3,q:"What is the minimum sample size for substituting the sample SD when the population SD is unknown?",opts:["n ≥ 10","n ≥ 20","n ≥ 30","n ≥ 100"],a:2,why:"n ≥ 30 is stated as sufficient observations."},
{id:"M3-57",m:3,q:"Cluster analysis ensures:",opts:["Homogeneity between groups, heterogeneity within","Homogeneity within groups, heterogeneity between groups","Equal group sizes","Labeled training data"],a:1,why:"Similar inside, different outside. Most representative use is customer segmentation."},
{id:"M3-58",m:3,q:"Which metric is most commonly used to evaluate regression model performance?",opts:["P-value","Test R²","IQR","Euclidean distance"],a:1,why:"Test R²; if models tie, Simple is Best."},
{id:"M4-09",m:4,q:"T-LAMP stands for:",opts:["TV Log Analytics Management Platform","Total Log Access Management Portal","TV Live Application Monitoring Platform","Terminal Log Archive Management Program"],a:0,why:"Device-identification platform, webOS 3.0 onward."},
{id:"M4-10",m:4,q:"Which log stores CONTEXT NAME, MESSAGE ID, and Message Data as JSON key:value?",opts:["Activation Log","TV Normal Log","Search Log","App Installation Log"],a:1,why:"Normal Log saves all user actions from smart functions, services and apps."},
{id:"M4-11",m:4,q:"Which log records Media Type values such as RF, STB, and IP?",opts:["TV Watching Log","VOD Selection Log","Normal Log","Activation Log"],a:0,why:"Broadcast via antenna / set-top box / LG Channel."},
{id:"M4-12",m:4,q:"Which log contains 'domain' values like TV Show, LiveTV, Movie, and YouTube?",opts:["VOD Selection Log","Search Log","Watching Log","App Use History Log"],a:1,why:"Domain = the search category in the integrated search app."},
{id:"M4-13",m:4,q:"Live EPG metadata is currently serviced for how many countries?",opts:["7","14","20","32"],a:1,why:"14 countries; created on the server, not received from the TV."},
{id:"M4-14",m:4,q:"The Activation start date differs from what?",opts:["The date of the first search","The actual TV purchase date","The app installation date","The date of consent"],a:1,why:"It records when the server was linked, not when the TV was bought."},
{id:"M4-15",m:4,q:"Which consent tier covers the Voice Search Log?",opts:["Basic Terms","Watching Information","Voice Service","No consent needed"],a:2,why:"Basic → Activation/Install/Search/UCM. Watching → Broadcast/VOD/Normal. Voice → Voice Search."},
{id:"M4-16",m:4,q:"Personal identification information must be:",opts:["Stored in plain text for CS access","Transmitted in a secured section, never in plain text","Shared with CP partners","Deleted immediately on collection"],a:1,why:"Privacy Compliance gate — safe collection."},
{id:"M4-17",m:4,q:"GDPR/CCPA full-usage-history requests are provided in which format and platform?",opts:["CSV via Intellytics","Excel via T-LAMP","Dashboard via Intellytics","GZ via SDP"],a:1,why:"CS → CSV; GDPR/CCPA → Excel via T-LAMP; Index Analysis → Dashboard via Intellytics."},
{id:"M4-18",m:4,q:"How is access to Intellytics requested?",opts:["Through Jira or EP","By requesting an account or access authority for dashboard access","By email to Legal","Through the TV settings menu"],a:1,why:"T-LAMP goes through Jira or EP; Intellytics is an account/authority request."},
{id:"M5-06",m:5,q:"What is LGE's three-step data management flow?",opts:["Collect/Secure → Integrate/Store → Analyze/Utilize","Plan → Do → Check","Extract → Transform → Load","Define → Measure → Improve"],a:0,why:"The backbone of the module."},
{id:"M5-07",m:5,q:"DDL and EDL are integrated in the Data Portal by means of:",opts:["Manual export","Data Virtualization","Physical migration","Cloud backup"],a:1,why:"Device Data Lake + Enterprise Data Lake, virtually integrated."},
{id:"M5-08",m:5,q:"DLMS stands for:",opts:["Data Lake Management System","Data Life Cycle Management System","Device Log Monitoring System","Digital License Management Service"],a:1,why:"Operates under Customer Data Governance."},
{id:"M5-09",m:5,q:"Which tools are named as the self-service BI layer?",opts:["R and Python","MSTR and Tableau","Excel and Jira","T-LAMP and SDP"],a:1,why:"Excel = individual/local; MSTR & Tableau = self-service BI; R & Python = AI/ML sandbox."},
{id:"M5-10",m:5,q:"Which team primarily uses Buzz Matrix?",opts:["CX","R&D","Sales/Marketing","Procurement"],a:0,why:"CX uses Buzz Matrix, T-LAMP, Intellytics for customer VoC and TV use data."},
{id:"M5-11",m:5,q:"Which system provides automatic log collection for proactive failure sensing?",opts:["Prosense","DAVID","HERMES","LGCAP"],a:0,why:"Prosense sits alongside Hawkeye 2.0 (PainKiller) and the Beta Program."},
{id:"M6-06",m:6,q:"What percentage responded that product service experience affects brand image?",opts:["55%","66%","77%","88%"],a:2,why:"77% — one of the drivers for DEJ."},
{id:"M6-07",m:6,q:"DEJ aims to materialize products and services that are:",opts:["Cheap, Fast, Simple, Local","All, Smart, Agile, Perfect","Bold, Clear, Direct, Open","Safe, Secure, Stable, Scalable"],a:1,why:"The stated four qualities."},
{id:"M6-08",m:6,q:"What are the three phases of the DEJ platform?",opts:["Collect → Store → Analyze","Explore → Materialize → Provide/Monitor Customer Value","Plan → Build → Ship","Recognize → Understand → Accept"],a:1,why:"Mirrors CEJ's Explore → Purchase → Use."},
{id:"M6-09",m:6,q:"Which period does DEJ 1.0 cover?",opts:["2018–2023","2024–2025","2026 onward","2015–2018"],a:0,why:"1.0 expanded the serve platform and data connectivity."},
{id:"M6-10",m:6,q:"What is the three-part DEJ experience ladder?",opts:["Connect Me → Recognize Me → Fit in with Me","Aware → Explore → Decide","Trigger → Accelerator → Tracker","First → Unique → New"],a:0,why:"Common value → beyond expectation → WoW!! experience value."},
{id:"M6-11",m:6,q:"HEAVEN supports the integrated development of:",opts:["Mechanic, LCM, package","Circuit, power, picture quality, sound quality","SW virtual verification","Requirement management"],a:1,why:"HERMES covers mechanical/LCM/package; HEY!TAS is SW virtual verification."},
{id:"M6-12",m:6,q:"Which system handles SW virtual verification?",opts:["HE-VPDS","HEY!TAS","HERMES","PINE"],a:1,why:"HE-VPDS is HW virtual verification; HEY!TAS is SW."},
{id:"M6-13",m:6,q:"Under 'Provide Customer Value', which pillar covers SW upgrades delivered at the right time via PINE?",opts:["Personalization","Optimization","Specialization","Servitization"],a:1,why:"Personalization = tailored services; Optimization = PINE upgrades; Specialization = new products like StandbyMe Go."},
{id:"P-01",m:1,past:true,freq:2,sat:["A","C"],q:"Choose the INCORRECT statement regarding Domain DX capabilities required by the company.",opts:["Propose Task","Securing Top DX Talent / Recruitment of Top Talent","Simple Analysis","Collaboration with a specialized Data Scientist"],a:1,why:"The four required capabilities are Propose Task, Simple Analysis, Collaborate with Specialized Data Scientist, Leading Task. Same trap as P-02, different wording."},
{id:"P-02",m:1,past:true,freq:2,sat:["A","C"],q:"What HE is NOT looking for in domain specialists' capabilities?",opts:["Propose tasks","Simple Analyse","Hire the DX specialist","Collaborate with Specialized data scientist"],a:2,why:"The C-sitting wording of the P-01 trap. Hiring is not a domain-specialist capability."},
{id:"P-03",m:1,past:true,freq:1,sat:["A"],q:"Which of the following correctly describes the order of the three stages of digital change?",opts:["Digitalization → Digitization → Digital Transformation","Digital Transformation → Digitalization → Digitization","Digitization → Digitalization → Digital Transformation","Digitization → Digital Transformation → Digitalization"],a:2,why:"Digitization (of information) → Digitalization (of process) → Digital Transformation (business innovation)."},
{id:"P-04",m:1,past:true,freq:2,sat:["B","C"],q:"Pick the INCORRECT one related to DX capability.",opts:["Transformation should be led by field workers","Transformation should be led by an expert (consultant)","Big data use is a key digital capability","Domain DX capability is required by the field"],a:1,why:"Led by field workers, NOT consultants."},
{id:"P-05",m:1,past:true,freq:3,sat:["A","B","C"],q:"Select the INCORRECT statement regarding the HE headquarters DX status / DX activity axes.",opts:["DX for customers","DX for company","Business model innovation","Process innovation"],a:3,why:"The three axes are DX for Customer, DX for Company, Business Model Innovation. Appeared in ALL THREE sittings."},
{id:"P-06",m:1,past:true,freq:2,sat:["B","C"],q:"The use of what is a key digital capability, a way to understand customers and businesses, and a gift to us from customers?",opts:["Cloud computing","Big Data","Blockchain","Robotics"],a:1,why:"Recalled verbatim from two sittings."},
{id:"P-07",m:2,past:true,freq:3,sat:["A","B","C"],q:"Which of the following is a CORRECT description of data-driven vs intuition-driven decision-making?",opts:["Intuition-based decision-making relies on facts and data","Data-driven decision-making draws inspiration from previous experience","Intuition-based decision-making inherently carries risk","Data-driven decision-making selects the best guess without evidence"],a:2,why:"Intuition relies on previous experience and carries risk; data-driven is based on facts. In B and C this was worded as 'data-driven decision making relies on facts'. ALL THREE sittings."},
{id:"P-08",m:2,past:true,freq:3,sat:["A","B","C"],q:"What is the correct order of development stages of big-data-based decision-making?",opts:["Prediction → Description → Diagnosis → Prescription","Description → Diagnosis → Prediction → Prescription","Diagnosis → Description → Prediction → Prescription","Description → Prediction → Diagnosis → Prescription"],a:1,why:"What happened → Why → What will happen → What should I do. ALL THREE sittings."},
{id:"P-09",m:2,past:true,freq:2,sat:["A","C"],q:"Which of the following is INCORRECT about the significance/characteristics of big data analysis?",opts:["Insights can be obtained from big data","It is possible to capture singularities that have been overlooked","We can better understand the population through sample surveys","A case-centered inductive approach is possible based on big data"],a:2,why:"Big data changes analysis FROM a sample survey TO a complete/total survey. See the Check tab — the C-sitting recall of this item is unreliable."},
{id:"P-10",m:3,past:true,freq:1,sat:["A"],q:"\"Regardless of who collects or measures, and no matter how many times it is repeated, the values should be the same.\" Which data quality is being explained?",opts:["Timeliness","Validity","Consistency","Completeness"],a:2,why:"Marked as Consistency in the A answer key. Note this overlaps the deck's definition of Precision — see the Check tab."},
{id:"P-11",m:3,past:true,freq:2,sat:["B","C"],q:"Data is getting updated on a monthly basis, so the team lead cannot get weekly updates. Which data quality is lacking?",opts:["Validity","Accuracy","Timeliness","Precision"],a:2,why:"Timeliness = data obtainable when needed, without excessive delay."},
{id:"P-12",m:3,past:true,freq:3,sat:["A","B","C"],q:"Which of the following is NOT affected by outliers (abnormal data)?",opts:["Mean","Standard Deviation","Range","Median"],a:3,why:"Median and IQR resist outliers. Asked in A with named options; in B and C as the definition wording (see P-13). ALL THREE sittings."},
{id:"P-13",m:3,past:true,freq:2,sat:["B","C"],q:"The factor of outliers does not affect which term?",opts:["Mean","The value located in the middle when data is sorted in ascending order","Standard deviation","Range"],a:1,why:"The B/C wording of P-12 — the median described rather than named."},
{id:"P-14",m:3,past:true,freq:2,sat:["B","C"],q:"Find the correct option describing a dependent variable.",opts:["A variable whose value is fixed by the analyst","A variable whose value changes depending on the situation or conditions","A variable that never appears in the model","A constant added to the regression equation"],a:1,why:"Y is the dependent/response/outcome variable; X is independent/explanatory/predictor."},
{id:"P-15",m:3,past:true,freq:3,sat:["A","B","C"],q:"What is called the process of dividing the data into similar groups?",opts:["Regression Analysis","Classification Analysis","Cluster Analysis","Time Series Analysis"],a:2,why:"Cluster Analysis — unsupervised learning. ALL THREE sittings."},
{id:"P-16",m:3,past:true,freq:3,sat:["A","B","C"],q:"Which time series component represents \"long-term fluctuations due to changes in population, resources, and technology\"?",opts:["Seasonal","Cycle","Trend","Irregular"],a:2,why:"Trend = long-term, slow directional change. In B and C this was asked with four graph images — the uniformly increasing graph is the answer. ALL THREE sittings."},
{id:"P-17",m:3,past:true,freq:1,sat:["C"],q:"What data analysis method is used to verify hypothesis testing and quantify the results?",opts:["CDA","EDA","DDA","PDA"],a:0,why:"Confirmatory Data Analysis is the hypothesis-testing stage."},
{id:"P-18",m:3,past:true,freq:2,sat:["B","C"],q:"Choose the perfect match: which analysis generates the function to do proper prediction?",opts:["DDA","EDA","CDA","PDA"],a:3,why:"PDA builds Y = f(X) for prediction."},
{id:"P-19",m:3,past:true,freq:1,sat:["C"],q:"Which of the following is NOT a Basic Principle of Model Development?",opts:["Best Fitting","Most parsimonious","Practically Reasonable","Variance optimization"],a:3,why:"The three are Best Fitting, Principles of Economics (most parsimonious), Practically Reasonable."},
{id:"P-20",m:3,past:true,freq:1,sat:["A"],q:"If data is being extracted every Monday for 2 months, what type of data extraction method is this?",opts:["Simple Random Sampling","Systematic Sampling","Cluster Sampling","Stratified Random Sampling"],a:1,why:"Regular intervals of time = Systematic. Asked as a subjective in A."},
{id:"P-21",m:3,past:true,freq:2,sat:["A","C"],q:"Which hypothesis test compares 2 groups for continuous data?",opts:["2-Sample T-Test","ANOVA Test","2-Proportion Test","Chi-Square Test"],a:0,why:"Subjective in A; embedded in the C case study as Q25."},
{id:"P-22",m:3,past:true,freq:2,sat:["A","C"],q:"Arrange the following into the correct sequence: DDA, PDA, EDA, CDA.",opts:["DDA → CDA → EDA → PDA","DDA → EDA → CDA → PDA","EDA → DDA → CDA → PDA","DDA → EDA → PDA → CDA"],a:1,why:"Descriptive → Exploratory → Confirmatory → Predictive. Subjective in A; case study Q24 in C."},
{id:"P-23",m:2,past:true,freq:2,sat:["B","C"],q:"Choose the correct one regarding labelled and unlabelled data.",opts:["HTML data is the labelled data","Most of the social media data is unlabeled data","Labeled data cannot be stored","Unlabeled data cannot be captured"],a:1,why:"Social media arrives as raw content with no outcome attached. HTML tags describe structure, not labels."},
{id:"P-24",m:3,past:true,freq:1,sat:["C"],q:"A company compares new vs existing components, tested across three production lines (A, B, C), with samples randomly selected from each. Which hypothesis test applies?",opts:["ANOVA Test","2-Sample T-Test","Chi-Square Test","2-Proportion Test"],a:1,why:"THE key trap. Three lines are sampling strata, not comparison groups. New vs existing = 2 groups, performance = continuous → 2-Sample T-Test."},
{id:"P-25",m:3,past:true,freq:1,sat:["C"],q:"In that same three-production-line scenario, what data extraction method is used?",opts:["Systematic Sampling","Simple Random Sampling","Stratified Sampling","Cluster Sampling"],a:2,why:"Population divided into groups (lines), then randomly sampled from each group."},
{id:"P-26",m:3,past:true,freq:1,sat:["C"],q:"What is true about EDA?",opts:["Box-plot is the mostly used graph in EDA","Can find the correlation between variables","Can help in determining the outliers","Can find patterns which can't be done by CDA"],a:2,why:"Marked answer is outlier determination. Note options 1 and 2 are also defensible per the deck — see the Check tab. Do not over-index on this item."},
];

const BLANKS = [

{id:"F2-01",m:2,text:"Gartner's three V's of Big Data are ___, ___, and ___.",ans:["Volume","Velocity","Variety"],alt:[],hint:"Size, speed, diversity."},

{id:"F2-03",m:2,text:"The containment relationship is AI ⊃ ___ ⊃ ___.",ans:["Machine Learning","Deep Learning"],alt:["ML","DL"],hint:"Outermost to innermost."},

{id:"F2-06",m:2,text:"The four stages of data-driven decision making are Descriptive, ___, ___, and ___.",ans:["Diagnostic","Predictive","Prescriptive"],alt:[],hint:"What happened → why → what will → what should I do."},
{id:"F2-07",m:2,text:"The five-stage analysis process is based on the ___ methodology.",ans:["CRISP-DM"],alt:["CRISP DM","CRISPDM"],hint:"Cross Industry Standard Process for Data Mining."},
{id:"F2-08",m:2,text:"Stage 1 of the analysis process is ___ the Issue.",ans:["Define"],alt:[],hint:"Always before collecting anything."},
{id:"F2-09",m:2,text:"Excel is insufficient for Big Data because of ___ and ___.",ans:["Volume","Variety"],alt:[],hint:"Size, plus structured/semi/unstructured types."},

{id:"F3-01",m:3,text:"The four analysis methods in order are ___ → ___ → ___ → ___.",ans:["DDA","EDA","CDA","PDA"],alt:[],hint:"Descriptive, Exploratory, Confirmatory, Predictive."},
{id:"F3-02",m:3,text:"The median of a sorted dataset is the ___-th value.",ans:["(N+1)/2"],alt:["(n+1)/2","N+1/2","(N + 1) / 2"],hint:"For even N, average the two middle values."},
