{id:"S-05",freq:3,sat:["24/03","25/05","18/09"],q:"Fill the blanks: Digitalization of (___) — Digitization of (___) — (___) innovation. [a: data, b: information, c: process, d: business]",a:"Information — Process — Business, i.e. option bcd.",prob:67},
{id:"S-06",freq:2,sat:["11/05","25/05"],q:"The use of what is a key digital capability, a way to understand customers and businesses, and a gift to us from customers?",a:"Big Data.",prob:50},
{id:"S-07",freq:1,sat:["24/03"],q:"If data is being extracted every Monday for 2 months, what type of data extraction method is this?",a:"Systematic Sampling — sampling at regular intervals of time or space.",prob:33},
{id:"S-08",freq:1,sat:["25/05"],q:"CASE STUDY: A company compares performance of new vs existing components, tested across three production lines (A, B, C), samples randomly selected from each. (i) What data extraction method? (ii) What analysis sequence? (iii) Which hypothesis test?",a:"(i) Stratified Sampling — population divided into groups (the lines), randomly sampled from each. (ii) DDA → EDA → CDA — it stops at CDA because the goal is a decision, not a prediction. (iii) 2-Sample T-Test — the three lines are sampling strata, NOT comparison groups; new vs existing is two groups and performance is continuous.",prob:33},
{id:"S-09",freq:0,sat:[],q:"Why do most digital transformation efforts fail?",a:"Companies focus only on introducing technology and overlook the actual subject of execution: people. Success is 4–11% in traditional industries, below 26% in digital ones (5% in 2017, 8% in 2019). Contributing causes: no cultural consensus, transformation driven by consultants rather than field workers, weak Domain DX capability. The fix is Domain DX capability — field workers becoming Citizen Data Scientists and leading DX tasks themselves.",prob:15},
{id:"S-10",freq:0,sat:[],q:"What is a Citizen Data Scientist and why is one needed?",a:"A field worker who combines domain expertise with data/AI capability, able to (1) propose a task, (2) do simple analysis, (3) collaborate with a specialized data scientist, (4) lead a task. Needed because the big data analysis market grows ~30% annually while the supply of professional data scientists is insufficient, and Big Data/AI capability is becoming a basic capability rather than a specialism.",prob:15},
{id:"S-11",freq:1,sat:["18/09"],prob:33,q:"What is the type of machine learning which is used with correct data with a label?",a:"Supervised Learning — learning from problems that come with their answers. Unsupervised uses unlabelled data; Reinforcement learns from reward and punishment with no fixed dataset."},
{id:"S-12",freq:2,sat:["25/05","18/09"],prob:50,q:"CASE SCENARIO: What type of data extraction method will be used?",a:"Stratified Random Sampling — the population is divided into groups (production lines, cities, regions) and samples are drawn randomly from each group. Contrast with Cluster Sampling, which takes everything from a few randomly chosen clusters."}
];


const STUDY = [
{n:1, title:"DX in HE Company", complexity:"Easy", pastFreq:"Heavy (4 of 4 papers)", priority:"2nd", blocks:[
  {type:"idea", text:"Digital Transformation is a business change that happens to use technology — not a technology change that happens to affect business. Almost every M1 question is a test of whether you've internalised that distinction."},
  {type:"h4", text:"The three stages of digital change"},
  {type:"p", text:"People use \"going digital\" to mean three different things, and the exam wants you to separate them. Think of a company that still keeps paper invoices in a filing cabinet:"},
  {type:"ol", items:[
    "Digitization — you scan the invoices into PDFs. The data changed form, analogue to digital. Nothing else about the company changed.",
    "Digitalization — you scrap the filing cabinet entirely and run approvals through software. The process changed. Work happens differently now.",
    "Digital Transformation — you realise the invoice data lets you offer customers instant credit, and you launch that as a new business line. The business changed."
  ]},
  {type:"table", headers:["Term","Focus","Meaning"], rows:[
    ["Digitization","Data","Conversion of Analogue to Digital"],
    ["Digitalization","Process","Adaption — digitizing a process"],
    ["Digital Transformation","Business","Creation — business innovation"]
  ]},
  {type:"p", text:"The deck also drills this as a fill-in-the-blank: Digitalization of (Information) — Digitization of (Process) — (Business) innovation."},
  {type:"examangle", text:"Asked as an ordering question (\"which correctly describes the order of the three stages?\" → Digitization → Digitalization → Digital Transformation) and as a fill-in-the-blank where the options are lettered a: data, b: information, c: process, d: business and the answer is bcd."},
  {type:"p", text:"The stated common agreement: DX is \"Business Innovation focusing on Digital Technology\" — most often phrased as a business model innovation using digital technology."},
  {type:"h4", text:"What DX is not — the negation traps"},
  {type:"p", text:"The exam loves these, because they're where people's intuitions are wrong:"},
  {type:"ul", items:[
    "Introducing digital technology ≠ completing DX. Buying the tools is the start, not the finish.",
    "You do not need to know and use every available technology.",
    "Learning and using the latest technology does not by itself constitute DX.",
    "Transformation should be led by field workers, not by consultants. This one appears repeatedly — the instinct is to say \"bring in experts,\" and that's exactly the wrong answer."
  ]},
  {type:"h4", text:"Why DX usually fails"},
  {type:"p", text:"The numbers are bleak, and the exam asks for them:"},
  {type:"table", headers:["Metric","Value"], rows:[
    ["Success rate, traditional industries (oil, auto, pharma)","4–11%"],
    ["Success rate, digital industries (tech, media, telecom)","Below 26%"],
    ["Overall success rate, 2017","5%"],
    ["Overall success rate, 2019","8%"],
    ["Big data analysis market annual growth","~30%"]
  ]},
  {type:"p", text:"McKinsey figures cited in the deck: over 80% of companies set up digitalization measures after COVID-19, but only 30% achieved the value they targeted. Of the remaining 70%, 44% missed their target entirely and 26% created only limited value. Where digitalization did succeed, it generated 66% more value and improved capabilities by 82%."},
  {type:"p", text:"The stated reason for failure: companies focus only on introducing technology and overlook the actual subject of execution — people."},
  {type:"h4", text:"Getting people on board: the Journey for Cultural Consensus"},
  {type:"p", text:"Since people are the failure point, the deck defines a four-step path for bringing them along. The logic is sequential and worth feeling rather than memorising: you can't accept something you don't understand, and you can't participate in something you haven't accepted."},
  {type:"p", text:"Recognize → Understand → Accept → Participate"},
  {type:"p", text:"Recognize the changes are happening → understand the direction they're going → accept the method being proposed → participate in executing them."},
  {type:"examangle", text:"Appeared as a subjective in all three recalled sittings. Note one recalled answer sheet writes it as awareness → accept → understand, which is a transcription slip — the deck and the other two sheets agree on Understand before Accept."},
  {type:"h4", text:"The Citizen Data Scientist"},
  {type:"p", text:"The market for big data analysis grows about 30% a year, but there aren't enough professional data scientists to meet it. The response isn't to hire more of them — it's to give data capability to the people who already understand the work."},
  {type:"p", text:"A Citizen Data Scientist is a field worker with data capability. Four things they can do:"},
  {type:"ol", items:["Propose Task","Simple Analysis","Collaboration with a Specialized Data Scientist","Leading Task"]},
  {type:"examangle", text:"Appeared in two sittings, both times as \"choose the INCORRECT one.\" The trap option is always some flavour of \"Securing Top DX Talent\" / \"Recruitment of Top Talent\" / \"Hire the DX specialist.\" Recruiting is the opposite of the point: the whole concept exists because you can't just hire your way out."},
  {type:"p", text:"Related: the modern professional data scientist is not described as an \"AI major\" but as someone who majored in a specific engineering discipline and is also an AI specialist."},
  {type:"h4", text:"Who does what — DX roles"},
  {type:"table", headers:["Role","Responsibility"], rows:[
    ["Champion / Sponsor","Present core tasks, stimulate the project, set budget, value-evaluate final products"],
    ["Project Leader","Confirm range and direction, manage products per stage"],
    ["DX Facilitator","Find the task's KPI, transform practical issues into Data issues, autonomous execution of DX duties"],
    ["DX Project team","Field-work specialists; apply analysis output, check practical results"],
    ["DX Strategy","Strategy establishment and operation, resource allocation, change management"],
    ["DX CoE","Spread DX capability, provide Use Cases, instruct and support tasks"],
    ["Data Scientist","Develop the analysis model, draw results"],
    ["Data Governance","Strategy of data operation, construct the Data Portal"],
    ["Data Engineer","Execute data collection, establish the DB"],
    ["AI Specialist","AI design, AI application"]
  ]},
  {type:"p", text:"The two most distinctive: the Facilitator is the translator between the shop floor and the analysts, and Governance owns the plumbing strategy."},
  {type:"h4", text:"How work itself evolves"},
  {type:"table", headers:["Style","Approach","Tools"], rows:[
    ["Corrective","Fix problems after they arise; prevent recurrence","PDCA, DMAIC"],
    ["Preventive","Remove the cause of the issue in advance","FMEA, DRBFM"],
    ["Predictive","Predict and respond before issues occur","Big Data, AI"]
  ]},
  {type:"p", text:"Read it as a timeline relative to the problem: after it happens → before it happens → before it can even form."},
  {type:"h4", text:"The C-D-P Operating System"},
  {type:"p", text:"C-D-P = CX – DX – Performance. The dashes matter: plain \"CDP\" means something else entirely (Career Development Path, or Customer Data Platform)."},
  {type:"p", text:"The relationship is causal. CX is the goal — what the customer feels. DX is the enabler that makes CX possible. Performance is the result you measure."},
  {type:"p", text:"DX plays three roles inside that system, which map cleanly onto before / during / after:"},
  {type:"ol", items:[
    "Trigger — understand customers and identify insight using data (before: figure out what to build)",
    "Accelerator — provide digital-technology solutions for CX implementation (during: build it)",
    "Tracker — monitor CX delivery using data (after: check it landed)"
  ]},
  {type:"h4", text:"What CX actually means"},
  {type:"p", text:"Mission: Customer Delight. Beneath it sit two tiers of value: Core Values — F.U.N: First (a No.1 experience beyond expectation), Unique (life-changing, differentiated), New (never-before-seen). Basic Values — Q.C.D: Quality, Cost, Delivery."},
  {type:"p", text:"Q.C.D is the floor you must not fall below; F.U.N is the ceiling you're reaching for."},
  {type:"p", text:"The Customer Experience Journey (CEJ) — 9 stages: Aware → Explore → Decide → Purchase → Deliver → On-board → Use → Maintain → Replace."},
  {type:"p", text:"Grouped into three phases — Explore (stages 1–3), Purchase (4–6), Use (7–9) — with Feedback running throughout. Notice it's a loop, not a line: Replace feeds back into Aware."},
  {type:"examangle", text:"\"What is the term used for the total experience and emotions a customer undergoes throughout the CEJ?\" → CX (Customer Experience). This appeared as a subjective in all three recalled sittings. It is the single most repeated question in the evidence."},
  {type:"p", text:"The C-D-P Management System redesigns four things: ① Organization ② Process ③ Performance management ④ Corporate culture."},
  {type:"p", text:"5 Key Customer Experiences (3C 2S): Connectivity, Care, Customization, Servitization, Sustainability. (Care — not \"Core.\" A widely-circulated set of notes gets this wrong.)"},
  {type:"h4", text:"HE Company's three DX axes"},
  {type:"ol", items:["DX for Customer — CX innovation","DX for Company — cost structure innovation","Business Model Innovation — new revenue"]},
  {type:"examangle", text:"Appeared in all three sittings as \"which is NOT one of the axes?\" The answer is always Process Innovation. It's a convincing distractor precisely because process innovation sounds like exactly the sort of thing that would be on the list."},
  {type:"h4", text:"Measurement glossary"},
  {type:"table", headers:["Term","Definition"], rows:[
    ["NPS (Net Promoter Score)","% of promoters − % of detractors — measures loyalty"],
    ["CXR (Customer eXperience Rating)","% satisfaction − % dissatisfaction — measures competitiveness"],
    ["CXR-P","Satisfaction from the \"Product Use\" perspective"],
    ["CXR-Mot","Satisfaction at the \"Moment of Truth\" / contact point"],
    ["A.R.E Index","Acquisition, Retention, Engagement"],
    ["ARPU","Total revenue ÷ number of subscribers"],
    ["MAU","Monthly Activity Users"]
  ]},
  {type:"p", text:"NPS and CXR have near-identical formulas — subtraction of one percentage from another. The difference is what is subtracted: promoters/detractors for NPS, satisfied/dissatisfied for CXR."},
  {type:"p", text:"Systems: Data Lake (repository for raw data types in LGE), Intellytics (LGE's in-house integrated AI/big-data analytics system), CPPM (Customer Pain Point Management platform)."}
]},
{n:2, title:"Big Data and AI", complexity:"Easy", pastFreq:"Moderate (4 of 4 papers)", priority:"3rd", blocks:[
  {type:"idea", text:"Big data isn't defined by being large. It's defined by being large enough, fast enough, and varied enough that your old tools break — which forces new methods, which unlock things that weren't possible before."},
  {type:"h4", text:"What makes data \"big\""},
  {type:"p", text:"Gartner's definition is the one to know: cost-effective, innovative information assets characterised by Volume (high volume), Velocity (high speed), and Variety (diversity), enabling better implications and decision-making."},
  {type:"p", text:"The deck separately lists further V's: Variability, Visualization, Volatility."},
  {type:"p", text:"⚠ Source conflict. A widely-circulated set of notes claims a \"5 V's\" set including Veracity and Value. Those two terms appear nowhere in the source deck. Both versions are drilled in the app with source badges — see the Check tab."},
  {type:"p", text:"Supporting spectrums: speed runs Batch → Periodic → Near Real Time → Real Time; scale runs TB → PB → EB → ZB → YB; structure covers structured, semi-structured, and unstructured."},
  {type:"p", text:"Why Excel breaks: Volume (more rows than it can hold) and Variety (it expects tidy columns, but real data includes text, voice, and images)."},
  {type:"h4", text:"AI, Machine Learning, Deep Learning"},
  {type:"p", text:"These are nested, not parallel: AI ⊃ Machine Learning ⊃ Deep Learning."},
  {type:"ul", items:[
    "AI — technology that recognises, deduces, behaves, and adapts like a human",
    "Machine Learning — improving that function by having the computer learn for itself",
    "Deep Learning — processing information through an artificial neural network modelled on human neurons"
  ]},
  {type:"p", text:"The point people miss: rule-based systems are still AI. The deck's example — Rule: \"rabbits like carrots.\" Fact: \"Bunny is a rabbit.\" Output: \"Bunny likes carrots.\" — is deductive reasoning with no learning whatsoever, and it counts as AI."},
  {type:"p", text:"The A-B-C relationship: AI needs Big Data (more data → higher AI performance), which needs Cloud (computing power and storage). Each one is the precondition for the one before it."},
  {type:"h4", text:"Labelled vs unlabelled data"},
  {type:"p", text:"A label is the correct answer attached to a record — the Y you're trying to predict. Data with labels supports supervised learning; data without needs unsupervised learning."},
  {type:"examangle", text:"A recalled question offers four statements and asks which is correct. Answer: \"Most of the social media data is unlabeled data.\" The distractors: \"HTML data is labelled data\" (HTML tags describe structure, not outcomes), \"Labeled data cannot be stored\" (false — it's exactly what gets stored as training data), \"Unlabeled data cannot be captured\" (false — capturing it is easy; the problem is it has no answers attached)."},
  {type:"h4", text:"What big data analysis lets you do"},
  {type:"p", text:"Four stated advantages:"},
  {type:"ol", items:[
    "Obtain insight — see the whole and the parts together",
    "Capture overlooked singularities — and note that the occurrence of a singularity can itself be a hidden pattern, so outliers aren't automatically noise",
    "Shift from a sample survey to a complete survey — you're no longer estimating the population from a slice; you have the population",
    "Enable a case-oriented inductive approach — reasoning up from cases rather than down from theory"
  ]},
  {type:"examangle", text:"Appeared in two sittings as \"which is INCORRECT?\" The answer is \"We can better understand the population through sample surveys.\" It's wrong because it points backwards — big data's advantage is precisely that it replaces sample surveys with complete ones."},
  {type:"h4", text:"Data-driven decision making"},
  {type:"p", text:"\"It's easy to lie with statistics, but it's hard to tell the truth without statistics.\" — Andrejs Dunkels"},
  {type:"p", text:"Intuition-based decision-making relies on previous experience and inherently carries risk. Data-driven decision-making is based on facts and data."},
  {type:"p", text:"The four stages climb in both value and difficulty — each answers a harder question than the last:"},
  {type:"table", headers:["Stage","Question"], rows:[
    ["Descriptive","What happened? (looking back)"],
    ["Diagnostic","Why did it happen? (looking back, deeper)"],
    ["Predictive","What will happen? (looking forward)"],
    ["Prescriptive","What should I do? (looking forward, and acting)"]
  ]},
  {type:"examangle", text:"Both of these appeared in all three sittings — the stage ordering, and the intuition-vs-data contrast. Learn them cold."},
  {type:"p", text:"A/B Test: provide version A and version B to two groups of users and compare the results. Used in digital marketing and business decisions."},
  {type:"h4", text:"The analysis process"},
  {type:"p", text:"Based on CRISP-DM (Cross Industry Standard Process for Data Mining). The deck's five-stage version:"},
  {type:"ol", items:[
    "Define the Issue — understand the field; define the problem",
    "Collect/Extract Data — define requirements, obtain data",
    "Preprocess Data — fix missing values and errors",
    "Visualize and Analyze",
    "Draw and Apply Insight"
  ]},
  {type:"p", text:"The deck's cooking analogy: Ingredient → Utensils → Chef → Cuisine → Customer Delight. Note stage 1 — you define the problem before touching data. Collecting first and looking for a question afterwards is the classic failure."}
]},
{n:3, title:"Data Types and Analysis Methods", complexity:"High", pastFreq:"Heaviest (4 of 4 papers)", priority:"1st", blocks:[
  {type:"idea", text:"Everything in this module hangs off one chain: what type is your data → which measure of centre applies → which test you're allowed to run. Get that chain and most of M3 answers itself. This is the highest-yield module in the exam."},
  {type:"h4", text:"Population, sample, parameter, statistic"},
  {type:"p", text:"The population is everyone you care about (all adult males in South Korea). The sample is the slice you actually measure (a thousand of them)."},
  {type:"p", text:"A number describing the population is a parameter; the same number describing your sample is a statistic. Different symbols, same concepts:"},
  {type:"table", headers:["Measure","Parameter (population)","Statistic (sample)"], rows:[
    ["Average","μ","X̄"],
    ["Variance","σ²","s²"],
    ["Standard deviation","σ","s"]
  ]},
  {type:"p", text:"Greek for the truth you can't see; Latin for the estimate you can."},
  {type:"h4", text:"Four ways to sample"},
  {type:"table", headers:["Method","How it works","Recognise it by"], rows:[
    ["Simple Random","Every individual has an equal chance","\"equal chance,\" \"at random\""],
    ["Stratified Random","Split the population into groups, then randomly sample from each group","\"divided into groups, sampled from each\""],
    ["Systematic","Sample at regular intervals of time or space","\"every Monday,\" \"every hundredth item\""],
    ["Cluster","Pick whole clusters at random, then survey inside them","\"select entire clusters\""]
  ]},
  {type:"p", text:"The pair that gets confused is Stratified vs Cluster. In stratified you take some from every group. In cluster you take all (or a random sample) from some groups."},
  {type:"examangle", text:"\"Data is extracted every Monday for 2 months\" → Systematic. \"Tested across three production lines, samples randomly selected from each\" → Stratified. Both are recalled real questions."},
  {type:"h4", text:"Eight marks of good data"},
  {type:"table", headers:["Criterion","Plain meaning"], rows:[
    ["Validity","It actually captures the concept you want to know"],
    ["Timeliness","You can get it when you need it, without excessive delay"],
    ["Consistency","Meaning, criteria, and units are the same across time and space"],
    ["Representativeness","The sample genuinely stands for the population"],
    ["Accuracy","It's close to the true value"],
    ["Precision","Same value regardless of who measures or how many repetitions"],
    ["Completeness","Appropriate range, no missing values, no outliers"],
    ["Sufficiency","There's enough of it"]
  ]},
  {type:"p", text:"Accuracy vs Precision is the classic confusion. Picture a dartboard: accurate means your darts cluster on the bullseye; precise means they cluster tightly — possibly in completely the wrong place. Accuracy is about truth; precision is about repeatability."},
  {type:"p", text:"Representativeness — the 1936 story. Literary Digest mailed ten million ballots and got 2.36 million responses, then predicted Landon would win. Gallup surveyed 1,500 people using stratified sampling and correctly predicted Roosevelt at 56% (he won with 62%). The Digest had polled only the affluent. Bias beats size — a huge biased sample is worse than a small balanced one."},
  {type:"p", text:"Sufficiency, three wrinkles: as data grows, sampling error falls but non-sampling error rises. Each extra variable multiplies the data you need (10 points in 1 dimension → 100 in 2D → 1000 in 3D). And for rare events — a 0.1% complaint rate — even 1,000 customers may yield nothing to analyse."},
  {type:"examangle", text:"\"Data is updated monthly so the lead can't get weekly updates\" → Timeliness (appeared twice). \"Regardless of who measures or how many repetitions, values should be the same\" → the deck calls this Precision, but a real past paper marked it Consistency. If both appear as options, choose Precision; if only Consistency is offered, choose it. See the Check tab."},
  {type:"h4", text:"Data types — the measurement ladder"},
  {type:"p", text:"Four types, and each rung adds one ability the rung below didn't have."},
  {type:"table", headers:["Class","Type","What it adds","Examples"], rows:[
    ["Discrete","Nominal","Names only — no order","Men/Women, Material 1/2/3, defect counts"],
    ["Discrete","Ordinal","Order, but undefined gaps","Gold/Silver/Bronze, High/Middle/Low"],
    ["Continuous","Interval","Equal, meaningful gaps — but no true zero","Temperature, productivity index"],
    ["Continuous","Ratio","A true zero meaning \"none\"","Length, volume — 8m is twice 4m"]
  ]},
  {type:"ul", items:[
    "Nominal: you can count and find a mode. Material 3 isn't \"more\" than Material 1.",
    "Ordinal: you can rank and find a median. But Bronze→Silver isn't necessarily the same distance as Silver→Gold, which is why \"average 2.4 medals\" is meaningless.",
    "Interval: you can add, subtract, and take a mean. But 0°C doesn't mean \"no temperature,\" so 20°C is not twice as hot as 10°C.",
    "Ratio: zero genuinely means none, so multiplication works."
  ]},
  {type:"p", text:"The test for Interval vs Ratio: can you sensibly say \"twice as much\"? Yes → ratio. No → interval."},
  {type:"p", text:"(One quirk: the deck files \"number of defects\" under Nominal. Strictly a count has a true zero and behaves like ratio data — the deck is sorting by discrete-vs-continuous first. Answer as the deck has it, but don't let it muddle the interval/ratio idea.)"},
  {type:"h4", text:"Variables"},
  {type:"p", text:"Y = f(X). Y is the dependent / response / outcome variable — the thing whose value changes depending on conditions. X is the independent / explanatory / predictor variable — the thing you set or observe. In Y = 2X + 3, the 2 is the coefficient and 3 is the constant."},
  {type:"examangle", text:"Appeared twice, phrased as \"find the correct option describing a variable\" with the answer being \"variable value changes depending on the situation or conditions\" — i.e. the dependent variable."},
  {type:"h4", text:"The four analyses — DDA → EDA → CDA → PDA"},
  {type:"p", text:"This is the spine of the module. Read it as one investigation deepening:"},
  {type:"table", headers:["Stage","Name","What you're doing","Everyday phrasing"], rows:[
    ["DDA","Descriptive","Summarise what the data says","\"What have we got?\""],
    ["EDA","Exploratory","Look from many angles for patterns","\"What's interesting here?\""],
    ["CDA","Confirmatory","Test whether a pattern is real","\"Is that difference actually real?\""],
    ["PDA","Predictive","Use the confirmed relationship to forecast","\"What happens next time?\""]
  ]},
  {type:"p", text:"You stop when you've met your objective — not every task needs all four. DDA alone may finish an assignment; EDA yields insight; CDA yields a decision; PDA yields workplace innovation."},
  {type:"examangle", text:"The ordering question appeared twice. Also asked in reverse: \"which method verifies hypothesis testing and quantifies it?\" → CDA. \"Which generates the function to do proper prediction?\" → PDA."},
  {type:"h4", text:"DDA — describing what you have"},
  {type:"p", text:"Any dataset can be pinned down by two things, the way a circle needs only a centre and a radius: where it sits (central tendency) and how spread out it is (dispersion)."},
  {type:"table", headers:["Measure","How","Use it for","Outliers?"], rows:[
    ["Mean X̄ = (1/n)Σxᵢ","Add everything, divide by count","Continuous data","Badly affected"],
    ["Median","Sort ascending, take the (N+1)/2-th value","Ordinal and continuous","Resistant"],
    ["Mode","Most frequent value","Any type, especially nominal","Resistant"]
  ]},
  {type:"p", text:"For even N, average the two middle values: 2,3,4,5,6,7,7,8,9,9 → median 6.5. For odd N: 2,3,4,5,6,7,7,8,9 → median 6."},
  {type:"p", text:"The Flaw of Average: would you wade a river with an average depth of 1 metre? Actual depths were 0.5m and 3.2m. The mean hid the thing that would drown you."},
  {type:"table", headers:["Measure","Formula"], rows:[
    ["Sum of Squares","Σ(xᵢ − X̄)²"],
    ["Variance s²","Sum of Squares ÷ (n − 1)"],
    ["Standard deviation s","√s²"],
    ["Range","Max − Min"]
  ]},
  {type:"p", text:"Why square the deviations? Because without squaring they cancel to zero every time. For [1,2,2,2,3] with mean 2: (1−2)+(2−2)+(2−2)+(2−2)+(3−2) = 0. Squaring makes every deviation positive so they accumulate."},
  {type:"p", text:"Work the deck's example until it's automatic — data [1, 2, 2, 2, 3], mean 2: Sum of Squares = 1 + 0 + 0 + 0 + 1 = 2. Variance = 2 ÷ (5 − 1) = 0.5 (divide by n−1, not n). Standard deviation = √0.5. Range = 3 − 1 = 2."},
  {type:"p", text:"Outlier sensitivity — resistant: Median, IQR. Sensitive: Mean, Standard Deviation, Range."},
  {type:"examangle", text:"\"Which is NOT affected by outliers?\" → Median. Appeared in all three sittings, sometimes with the median described rather than named (\"the value located in the middle when sorted in ascending order\")."},
  {type:"h4", text:"EDA — looking for what you didn't expect"},
  {type:"p", text:"Numbers hide things that pictures reveal. With large, complex data you often can't see anything at all without a graph."},
  {type:"p", text:"Four kinds of exploration: ① distribution ② comparison by category ③ change over time ④ correlations between variables."},
  {type:"p", text:"Picking a graph: discrete variables → pie, donut, stacked bar, Pareto. Continuous → histogram, box plot. Over time → line, bar, control chart, box plot. Relationships → scatter plot."},
  {type:"p", text:"The box plot is the workhorse. It shows five numbers at once — minimum, Q1 (25%), Q2/median (50%), Q3 (75%), maximum — plus outliers."},
  {type:"ul", items:[
    "IQR = Q3 − Q1 — the length of the box, holding the middle half of the data",
    "Outlier fences sit at 1.5 × IQR beyond the box; anything past that is a mild outlier, and further still is extreme",
    "Quartile positions: Q1 = X₍₍ₙ₊₁₎/₄₎, Q2 = X₍₂₍ₙ₊₁₎/₄₎, Q3 = X₍₃₍ₙ₊₁₎/₄₎"
  ]},
  {type:"p", text:"What it buys you: five statistics at a glance, outlier identification, a read on skew (compare mean against median), and — the stated strength — comparing distributions between groups."},
  {type:"p", text:"Two traps EDA can spring: Sample fragmentation — data that looks uncorrelated overall may split into Product A trending down and Product B trending up. \"The art of data analysis is to reduce dimensions rather than expand them.\" Scope constraint — a correlation visible across a wide range can vanish inside a narrow one. Always check the range you're looking at."},
  {type:"p", text:"\"EDA is the attitude, flexibility, and spontaneity to discover what we believe exists, as well as what we believe does not exist.\" — John Tukey"},
  {type:"p", text:"A sobering note from the deck: roughly 80% of EDA findings just confirm what you already knew. Results still need validation and interpretation before they're insight."},
  {type:"h4", text:"CDA — deciding whether it's real"},
  {type:"p", text:"You've spotted a difference. Is it genuine, or could it easily be chance? That's the entire purpose of CDA."},
  {type:"p", text:"The four steps:"},
  {type:"ol", items:[
    "Set up hypotheses. H0 (null) = there is no difference. H1 (alternative) = there is a difference. You always start from \"nothing is going on\" and make the data argue you out of it.",
    "Set the significance level α — normally 5%.",
    "Calculate the P-value using a statistics tool.",
    "Decide. P ≤ α → reject H0, choose H1 (real difference). P > α → keep H0 (no difference)."
  ]},
  {type:"p", text:"The shorthand to carry in: P < 0.05 → there IS a difference. P > 0.05 → there is NO difference."},
  {type:"p", text:"Choosing the test — two questions only: is the data continuous or discrete? and how many groups am I comparing?"},
  {type:"table", headers:["","Continuous data","Discrete data"], rows:[
    ["2 groups","2-Sample T-Test","2-Proportion Test"],
    ["3+ groups","ANOVA","Chi-Square Test"],
    ["Relationship between variables","Correlation Analysis","—"]
  ]},
  {type:"examangle", text:"The single most instructive question in the past papers. A case study: \"compare performance improvement of new vs existing components, tested across three production lines A, B, C, samples randomly selected from each.\" Answer: 2-Sample T-Test. The \"three lines\" are the sampling strata, not the comparison groups. What's being compared is new vs existing — two groups — and performance is continuous. Always identify what is being compared, not how many subgroups the scenario mentions."},
  {type:"p", text:"A second trap, from the deck's own worked case: Line A had 340 defects in 1,000 (34%), Line B had 170 in 660 (26%). The percentages differ — but the P-value came out greater than 0.05, so the conclusion is no significant difference. Raw percentages differing is not the same as a real difference."},
  {type:"p", text:"Correlation coefficient r: always between −1 and 1; ±1 is a perfect linear relationship, 0 is none. Affected by outliers. Still needs its p-value — if p > 0.05 there is no correlation regardless of how impressive r looks."},
  {type:"p", text:"Point vs interval estimation: a point estimate is one number (\"average height 174cm\") and hides the error. An interval estimate gives a range with a confidence level (\"between 160 and 188 with 95% probability\") and shows it."},
  {type:"p", text:"Confidence interval: CI = X̄ ± Z × (s/√n). Z = 1.96 for 95%. You may substitute the sample SD for the unknown population SD once n ≥ 30."},
  {type:"h4", text:"PDA — forecasting the unknown"},
  {type:"p", text:"PDA builds Y = f(X) so you can estimate a Y you haven't observed. It does two jobs: description (explain why a result occurs and how much each cause contributes) and presumption (predict an unknown or future outcome)."},
  {type:"p", text:"Machine learning is how the function gets built. The machine tries candidate functions F1…Fn and keeps the one with minimum error. Humans design the setup; the machine does the predicting. The deck's split: 1,000,000 records → 700,000 training, 300,000 test."},
  {type:"table", headers:["Type","Data","The analogy"], rows:[
    ["Supervised","Labelled","Studying with the answer key"],
    ["Unsupervised","Unlabelled","Studying with no answer key — find the structure yourself"],
    ["Reinforcement","No fixed dataset","Learning by reward and punishment"]
  ]},
  {type:"table", headers:["Type","Learning","Y","What it does"], rows:[
    ["Regression","Supervised","Continuous","Estimate a numeric outcome from inputs"],
    ["Classification","Supervised","Discrete","Sort an object into a predefined category"],
    ["Cluster","Unsupervised","—","Find groups that weren't defined in advance"],
    ["Time Series","(special case of regression)","—","Analyse data ordered by time"],
    ["Association Rule","—","—","Find what co-occurs with what"]
  ]},
  {type:"p", text:"The cleanest way to hold Regression vs Classification: both are supervised, and the only difference is whether Y is a number or a category."},
  {type:"p", text:"Regression — evaluated most commonly by Test R². If several models score the same, Simple is Best. The deck's R example: Behavior Change = 0.9769 + 0.5815 × Systemic Pressure; since p < 0.05, systemic pressure genuinely affects behaviour change."},
  {type:"p", text:"Classification / KNN — calculate the Euclidean distance from the new point to all existing points, take the K nearest, and classify by majority vote."},
  {type:"p", text:"Cluster — divide observations so there's homogeneity within groups and heterogeneity between them. Signature application: customer segmentation. Also useful for preprocessing (data reduction, outlier detection)."},
  {type:"examangle", text:"\"What is the process of dividing data into similar groups?\" → Cluster Analysis. Appeared in all three sittings."},
  {type:"table", headers:["Component","What it is"], rows:[
    ["Trend","Long-term movement from changes in population, resources, technology"],
    ["Seasonal","Repeating on a 12-month cycle"],
    ["Cycle","Irregular economic expansion and contraction"],
    ["Irregular","Unexplained, random"]
  ]},
  {type:"examangle", text:"\"Which component represents long-term fluctuations due to changes in population, resources and technology?\" → Trend. Appeared in all three sittings; sometimes shown as four graphs, where the steadily rising line is the answer."},
  {type:"p", text:"Association Rule — the \"shopping cart rule,\" finding If-Then co-occurrence. Classic examples: bread → milk; diapers → beer. Sequence Analysis is the version where a time gap separates the If from the Then. Recommendation engines use Collaborative Filtering (people similar to you liked this) and Content-based Filtering (things similar to what you liked). Caution: some associations are accidental or trivially obvious — buy bread and butter ⇒ buy milk [90%] tells you nothing."},
  {type:"p", text:"Three principles of model development: ① Best Fitting ② Principles of Economics (most parsimonious) ③ Practically Reasonable. Accuracy is not the only criterion — practical usefulness counts."},
  {type:"examangle", text:"Asked as \"which is NOT a basic principle?\" with \"Variance optimization\" as the false option."}
]},

/* ===================== helpers ===================== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function textMatches(text, term){
  return !term || String(text).toLowerCase().indexOf(term.toLowerCase()) !== -1;
}
function hl(text, term){
  var esc = escapeHtml(text);
  if(!term) return esc;
  try{
    var safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("(" + safe + ")", "ig");
    return esc.replace(re, "<mark>$1</mark>");
  }catch(e){ return esc; }
}
function mdText(text, term){
  var html = hl(text, term);
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
  return html;
}
function shuffleArr(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function moduleTag(m){ return "M" + m; }
function byId(list, id){ return list.filter(function(x){ return x.id === id; })[0]; }

/* generic block renderer, shared by Study + Cheat tabs */
function renderBlocks(blocks, term){
  var html = "";
  var anyMatch = !term;
  var pending = "";
  function flush(){ if(pending){ html += pending; pending = ""; } }
  for(var i = 0; i < blocks.length; i++){
    var b = blocks[i];
    if(b.type === "h"){ pending += '<h3 class="block-h">' + hl(b.text, term) + "</h3>"; continue; }
    if(b.type === "h4"){ pending += '<h4 class="block-h4">' + hl(b.text, term) + "</h4>"; continue; }
    if(b.type === "p"){
      if(term && !textMatches(b.text, term)) continue;
      flush();
      if(term) anyMatch = true;
      html += "<p>" + mdText(b.text, term) + "</p>";
      continue;
    }
    if(b.type === "idea" || b.type === "examangle"){
      if(term && !textMatches(b.text, term)) continue;
      flush();
      if(term) anyMatch = true;
      var cls = b.type === "idea" ? "callout-idea" : "callout-examangle";
      var label = b.type === "idea" ? "The one idea" : "Exam angle";
      html += '<div class="' + cls + '"><span class="callout-label">' + label + '</span>' + mdText(b.text, term) + "</div>";
      continue;
    }
    if(b.type === "ul" || b.type === "ol"){
      var items = b.items.filter(function(it){ return !term || textMatches(it, term); });
      if(term && items.length === 0) continue;
      flush();
      if(term && items.length) anyMatch = true;
      var tag = b.type === "ul" ? "ul" : "ol";
      html += "<" + tag + ">" + items.map(function(it){ return "<li>" + mdText(it, term) + "</li>"; }).join("") + "</" + tag + ">";
      continue;
    }
    if(b.type === "table"){
      var rows = b.rows.filter(function(r){ return !term || r.some(function(c){ return textMatches(c, term); }); });
      if(term && rows.length === 0) continue;
      flush();
      if(term && rows.length) anyMatch = true;
      html += '<div class="table-wrap"><table><thead><tr>' +
        b.headers.map(function(h){ return "<th>" + escapeHtml(h) + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        rows.map(function(r){ return "<tr>" + r.map(function(c){ return "<td>" + mdText(c, term) + "</td>"; }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>";
      continue;
    }
  }
  return { html: html, anyMatch: anyMatch };
}

function tierBadge(tier, prob){
  var m = TIER_META[tier];
  var stars = '<span class="badge badge-tier' + tier + '" title="Tier ' + tier + ' — ' + m.label + " (" + m.note + ')">' + m.stars + "</span>";
  if(prob == null) return stars;
  return stars + probBadge(prob);
}
/* prob: estimated % chance the topic appears on the next paper, from four papers.
   Rule of succession (k+1)/6 over the four papers for anything actually seen;
   unseen topics are estimated from the share of paper slots left over. */
function probFor(item){
  if(item.prob != null) return item.prob;   // past/subjective: already explicit
  switch(item.tier){
    case 1: return 67;
    case 2: return 50;
    case 3: return 33;
    case 4: return item.m === 3 ? 10 : 8;
    default: return 2;
  }
}
function probBadge(prob){
  var band = prob >= 67 ? "prob-high" : (prob >= 33 ? "prob-mid" : "prob-low");
  return '<span class="badge badge-prob ' + band + '" title="Estimated chance this topic appears on the next paper">' + prob + "%</span>";
}

/* ===================== score / pass-line ===================== */
function computeScoreFor(section){
  var ids = section.order;
  var answered = 0, correct = 0;
  for(var i = 0; i < ids.length; i++){
    var a = section.answers[ids[i]];
    if(a){ answered++; if(a.correct) correct++; }
  }
  return { answered: answered, correct: correct, pct: answered ? Math.round((correct / answered) * 100) : 0 };
}
function computeScore(){ return computeScoreFor(state.drill); }
function computeBlanksScore(){ return computeScoreFor(state.blanks); }
function computePastScore(){ return computeScoreFor(state.past); }
function updateScoreStrip(){
  var s, label;
  if(state.scoreMode === "blanks"){ s = computeBlanksScore(); label = "BLANKS"; }
  else if(state.scoreMode === "past"){ s = computePastScore(); label = "PAST"; }
  else { s = computeScore(); label = "DRILL"; }
  document.getElementById("scoreLabel").textContent = label;
  document.getElementById("scorePct").textContent = s.pct + "%";
  document.getElementById("scoreFrac").textContent = s.correct + "/" + s.answered;
  var fill = document.getElementById("passFill");
  fill.style.width = Math.min(s.pct, 100) + "%";
  fill.classList.toggle("pass", s.pct >= 80);
}

/* ===================== tabs ===================== */
function onTabSwitch(tab){
  state.tab = tab;
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.setAttribute("aria-selected", btn.dataset.tab === tab ? "true" : "false");
  });
  document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.remove("active"); });
  document.getElementById("tab-" + tab).classList.add("active");
  if(tab === "past"){ state.scoreMode = "past"; renderPast(); }
  if(tab === "drill"){ state.scoreMode = "drill"; renderDrill(); }
  if(tab === "blanks"){ state.scoreMode = "blanks"; renderBlanks(); }
  if(tab === "study") renderStudy();
  if(tab === "cards") renderCards();
  if(tab === "cheat") renderCheat();
  if(tab === "check") renderCheck();
}

function tierLegendHtml(){
  var rows = [1,2,3,4,5].map(function(t){
    var m = TIER_META[t];
    return '<div class="tier-row"><span class="tier-dots mono ' + m.cls + '">' + m.stars + '</span>' +
      '<span><b>Tier ' + t + '</b> — ' + m.label + " (" + m.note + ")</span></div>";
  }).join("");
  return '<details class="tier-legend"><summary>Tier legend</summary><div class="tier-legend-body">' + rows + "</div></details>";
}

/* ===================== DRILL ===================== */
function buildDrillSet(subsetIds){
  var pool;
  if(subsetIds){
    pool = subsetIds.slice();
  } else {
    var list = QUESTIONS.slice();
    if(state.drill.moduleFilter !== "all"){
      var m = state.drill.moduleFilter;
      list = list.filter(function(q){ return q.m === m; });
    }
    if(state.drill.tier12Only) list = list.filter(function(q){ return q.tier <= 2; });
    if(state.drill.priority) list = list.slice().sort(function(a, b){ return a.tier - b.tier; });
    pool = list.map(function(q){ return q.id; });
    if(!state.drill.priority) pool = shuffleArr(pool);
  }
  state.drill.order = pool;
  state.drill.index = 0;
  state.drill.answers = {};
}
function onDrillFilter(mod){
  state.drill.moduleFilter = mod === "all" ? "all" : Number(mod);
  buildDrillSet();
  renderDrill();
}
function onDrillPriorityToggle(){
  state.drill.priority = !state.drill.priority;
  buildDrillSet();
  renderDrill();
}
function onDrillTier12Toggle(){
  state.drill.tier12Only = !state.drill.tier12Only;
  buildDrillSet();
  renderDrill();
}
function onDrillReset(){
  state.drill.flagged = {};
  buildDrillSet();
  renderDrill();
}
function onDrillOption(qid, idx){
  if(state.drill.answers[qid]) return;
  var q = byId(QUESTIONS, qid);
  state.drill.answers[qid] = { chosen: idx, correct: idx === q.a };
  renderDrill();
}
function onDrillNext(){
  state.drill.index++;
  renderDrill();
}
function onDrillFlag(qid){
  state.drill.flagged[qid] = !state.drill.flagged[qid];
  renderDrill();
}
function onDrillRetry(mode){
  var ids;
  if(mode === "wrong"){
    ids = state.drill.order.filter(function(id){
      var a = state.drill.answers[id];
      return a && !a.correct;
    });
  } else {
    ids = state.drill.order.filter(function(id){ return state.drill.flagged[id]; });
  }
  if(ids.length === 0) return;
  buildDrillSet(ids);
  renderDrill();
}

function renderDrill(){
  var el = document.getElementById("tab-drill");
  var chips = ["all", 1, 2, 3, 4, 5, 6].map(function(m){
    var label = m === "all" ? "All" : moduleTag(m);
    var active = state.drill.moduleFilter === m;
    return '<button class="chip' + (active ? " chip-active" : "") + '" onclick="onDrillFilter(\'' + m + '\')">' + label + "</button>";
  }).join("");

  var head = tierLegendHtml() + '<div class="panel drill-controls">' +
    '<div class="chip-row">' + chips + "</div>" +
    '<div class="drill-toggles">' +
      '<button class="chip' + (state.drill.tier12Only ? " chip-active" : "") + '" onclick="onDrillTier12Toggle()">Tier 1–2 only</button>' +
      '<button class="chip' + (state.drill.priority ? " chip-active" : "") + '" onclick="onDrillPriorityToggle()">Priority</button>' +
      '<button class="chip chip-ghost" onclick="onDrillReset()">Reset</button>' +
    "</div>" +
  "</div>";

  var body;
  if(state.drill.order.length === 0){
    body = '<div class="panel"><p class="muted">No questions match this filter.</p></div>';
  } else if(state.drill.index >= state.drill.order.length){
    body = renderDrillSummary();
  } else {
    body = renderDrillQuestion();
  }
  el.innerHTML = head + body;
  if(state.scoreMode === "drill") updateScoreStrip();
}

function renderDrillQuestion(){
  var qid = state.drill.order[state.drill.index];
  var q = byId(QUESTIONS, qid);
  var a = state.drill.answers[qid];
  var flagged = !!state.drill.flagged[qid];

  var srcBadge = "";
  if(q.src === "deck") srcBadge = '<span class="badge badge-deck">DECK</span>';
  if(q.src === "notes") srcBadge = '<span class="badge badge-notes">NOTES</span>';

  var optsHtml = q.opts.map(function(opt, idx){
    var cls = "option";
    if(a){
      if(idx === q.a) cls += " opt-correct";
      else if(idx === a.chosen) cls += " opt-wrong";
    }
    var disabled = a ? " disabled" : "";
    return '<button class="' + cls + '" ' + disabled + ' onclick="onDrillOption(\'' + qid + "', " + idx + ')">' +
      '<span class="opt-letter mono">' + String.fromCharCode(65 + idx) + "</span>" +
      '<span class="opt-text">' + escapeHtml(opt) + "</span>" +
    "</button>";
  }).join("");

  var why = a ? '<div class="why-line">' + escapeHtml(q.why) + "</div>" : "";
  var nextBtn = a ? '<button class="btn-primary" onclick="onDrillNext()">Next →</button>' : "";

  return '<div class="panel drill-question">' +
    '<div class="q-meta mono">' +
      '<span>' + escapeHtml(qid) + " &middot; " + moduleTag(q.m) + "</span>" +
      tierBadge(q.tier, q.prob) +
      srcBadge +
      '<button class="flag-btn' + (flagged ? " flag-active" : "") + '" onclick="onDrillFlag(\'' + qid + '\')" aria-pressed="' + flagged + '">' + (flagged ? "★ Flagged" : "☆ Flag for review") + "</button>" +
    "</div>" +
    '<p class="q-text">' + escapeHtml(q.q) + "</p>" +
    '<div class="opt-list">' + optsHtml + "</div>" +
    why +
    '<div class="drill-progress mono muted">Question ' + (state.drill.index + 1) + " / " + state.drill.order.length + "</div>" +
    '<div class="drill-actions">' + nextBtn + "</div>" +
  "</div>";
}

function renderDrillSummary(){
  var s = computeScore();
  var byModule = {};
  state.drill.order.forEach(function(id){
    var q = byId(QUESTIONS, id);
    var a = state.drill.answers[id];
    if(!byModule[q.m]) byModule[q.m] = { correct: 0, total: 0 };
    byModule[q.m].total++;
    if(a && a.correct) byModule[q.m].correct++;
  });
  var weakest = null, weakestPct = 101;
  Object.keys(byModule).forEach(function(m){
    var d = byModule[m];
    var pct = d.total ? (d.correct / d.total) * 100 : 100;
    if(pct < weakestPct){ weakestPct = pct; weakest = m; }
  });
  var rows = Object.keys(byModule).sort().map(function(m){
    var d = byModule[m];
    var pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
    var mark = (m === weakest) ? ' <span class="badge badge-high">WEAKEST</span>' : "";
    return "<tr><td>" + moduleTag(m) + mark + "</td><td>" + d.correct + " / " + d.total + "</td><td>" + pct + "%</td></tr>";
  }).join("");

  var wrongCount = state.drill.order.filter(function(id){ var a = state.drill.answers[id]; return a && !a.correct; }).length;
  var flaggedCount = state.drill.order.filter(function(id){ return state.drill.flagged[id]; }).length;

  return '<div class="panel drill-summary">' +
    '<h3 class="block-h">Set complete — ' + s.correct + " / " + s.answered + " (" + s.pct + "%)</h3>" +
    '<p class="muted">Pass line is 80%. ' + (s.pct >= 80 ? "You cleared it on this set." : "Below pass line on this set — drill the weak module again.") + "</p>" +
    '<div class="table-wrap"><table><thead><tr><th>Module</th><th>Score</th><th>%</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<div class="drill-actions">' +
      '<button class="btn-primary" ' + (wrongCount ? "" : "disabled") + ' onclick="onDrillRetry(\'wrong\')">Retry wrong only (' + wrongCount + ")</button>" +
      '<button class="btn-ghost" ' + (flaggedCount ? "" : "disabled") + ' onclick="onDrillRetry(\'flagged\')">Retry flagged (' + flaggedCount + ")</button>" +
    "</div>" +
  "</div>";
}

/* ===================== BLANKS ===================== */
function normalizeAns(s){
  return String(s).trim().toLowerCase().replace(/\s+/g, " ").replace(/\.+$/, "");
}
function blankAcceptedFor(b, i){
  var accepted = [normalizeAns(b.ans[i])];
  (b.alt || []).forEach(function(a){ accepted.push(normalizeAns(a)); });
  return accepted;
}
function buildBlanksSet(subsetIds){
  var pool;
  if(subsetIds){
    pool = subsetIds.slice();
  } else {
    var list = BLANKS.slice();
    if(state.blanks.moduleFilter !== "all"){
      var m = state.blanks.moduleFilter;
      list = list.filter(function(b){ return b.m === m; });
    }
    if(state.blanks.tier12Only) list = list.filter(function(b){ return b.tier <= 2; });
    if(state.blanks.priority) list = list.slice().sort(function(a, b){ return a.tier - b.tier; });
    pool = list.map(function(b){ return b.id; });
    if(!state.blanks.priority) pool = shuffleArr(pool);
  }
  state.blanks.order = pool;
  state.blanks.index = 0;
  state.blanks.answers = {};
}
function onBlanksFilter(mod){
  state.blanks.moduleFilter = mod === "all" ? "all" : Number(mod);
  buildBlanksSet();
  renderBlanks();
}
function onBlanksPriorityToggle(){
  state.blanks.priority = !state.blanks.priority;
  buildBlanksSet();
  renderBlanks();
}
function onBlanksTier12Toggle(){
  state.blanks.tier12Only = !state.blanks.tier12Only;
  buildBlanksSet();
  renderBlanks();
}
function onBlanksReset(){
  state.blanks.hints = {};
  buildBlanksSet();
  renderBlanks();
}
function onBlankHintToggle(bid){
  state.blanks.hints[bid] = !state.blanks.hints[bid];
  renderBlanks();
}
function onBlankCheck(bid){
  var b = byId(BLANKS, bid);
  var inputs = document.querySelectorAll("#tab-blanks .blank-input[data-blank-idx]");
  var values = [];
  var allFilled = true;
  inputs.forEach(function(inp){
    var idx = Number(inp.dataset.blankIdx);
    values[idx] = inp.value;
    if(!inp.value.trim()) allFilled = false;
  });
  if(!allFilled || values.length === 0) return;
  var results = values.map(function(v, i){
    return blankAcceptedFor(b, i).indexOf(normalizeAns(v)) !== -1;
  });
  var correct = results.every(function(r){ return r; });
  state.blanks.answers[bid] = { values: values, results: results, correct: correct, revealed: false };
  renderBlanks();
}
function onBlankShowAnswer(bid){
  var b = byId(BLANKS, bid);
  state.blanks.answers[bid] = {
    values: b.ans.slice(),
    results: b.ans.map(function(){ return false; }),
    correct: false,
    revealed: true
  };
  renderBlanks();
}
function onBlankNext(){
  state.blanks.index++;
  renderBlanks();
}
function onBlankInputKeydown(e, bid){
  if(e.key !== "Enter") return;
  e.preventDefault();
  if(state.blanks.answers[bid]) onBlankNext();
  else onBlankCheck(bid);
}
function onBlanksRetry(mode){
  var ids;
  if(mode === "wrong"){
    ids = state.blanks.order.filter(function(id){
      var a = state.blanks.answers[id];
      return a && !a.correct;
    });
  } else {
    ids = [];
  }
  if(ids.length === 0) return;
  buildBlanksSet(ids);
  renderBlanks();
}

function renderBlanks(){
  var el = document.getElementById("tab-blanks");
  var chips = ["all", 1, 2, 3, 4, 5, 6].map(function(m){
    var label = m === "all" ? "All" : moduleTag(m);
    var active = state.blanks.moduleFilter === m;
    return '<button class="chip' + (active ? " chip-active" : "") + '" onclick="onBlanksFilter(\'' + m + '\')">' + label + "</button>";
  }).join("");

  var head = tierLegendHtml() + '<div class="panel drill-controls">' +
    '<div class="chip-row">' + chips + "</div>" +
    '<div class="drill-toggles">' +
      '<button class="chip' + (state.blanks.tier12Only ? " chip-active" : "") + '" onclick="onBlanksTier12Toggle()">Tier 1–2 only</button>' +
      '<button class="chip' + (state.blanks.priority ? " chip-active" : "") + '" onclick="onBlanksPriorityToggle()">Priority</button>' +
      '<button class="chip chip-ghost" onclick="onBlanksReset()">Reset</button>' +
    "</div>" +
  "</div>";

  var body;
  if(state.blanks.order.length === 0){
    body = '<div class="panel"><p class="muted">No blanks match this filter.</p></div>';
  } else if(state.blanks.index >= state.blanks.order.length){
    body = renderBlanksSummary();
  } else {
    body = renderBlankQuestion();
  }
  el.innerHTML = head + body;
  if(state.scoreMode === "blanks") updateScoreStrip();
}

function renderBlankQuestion(){
  var bid = state.blanks.order[state.blanks.index];
  var b = byId(BLANKS, bid);
  var a = state.blanks.answers[bid];
  var parts = b.text.split("___");

  var sentence = "";
  for(var i = 0; i < parts.length; i++){
    sentence += escapeHtml(parts[i]);
    if(i < parts.length - 1){
      var val = a ? a.values[i] : "";
      var cls = "blank-input";
      var reveal = "";
      if(a){
        if(a.revealed){
          cls += " blank-revealed";
        } else if(a.results[i]){
          cls += " blank-correct";
        } else {
          cls += " blank-wrong";
          reveal = '<span class="blank-answer-reveal mono">' + escapeHtml(b.ans[i]) + "</span>";
        }
      }
      var w = Math.max(4, b.ans[i].length + 2);
      sentence += '<input type="text" class="' + cls + '" style="width:' + w + 'ch" ' +
        'data-blank-idx="' + i + '" value="' + escapeHtml(val) + '" ' + (a ? "disabled" : "") +
        ' autocomplete="off" autocapitalize="off" spellcheck="false" ' +
        'onkeydown="onBlankInputKeydown(event,\'' + bid + '\')">' + reveal;
    }
  }

  var hintShown = !!state.blanks.hints[bid];
  var hintHtml = hintShown ? '<div class="blank-hint">' + escapeHtml(b.hint) + "</div>" : "";
  var revealedNote = (a && a.revealed) ? '<div class="blank-revealed-note">Answer shown — marked incorrect.</div>' : "";

  var actions;
  if(a){
    actions = '<button class="btn-primary" onclick="onBlankNext()">Next →</button>';
  } else {
    actions =
      '<button class="btn-ghost" onclick="onBlankHintToggle(\'' + bid + '\')">' + (hintShown ? "Hide hint" : "Hint") + "</button>" +
      '<button class="btn-ghost" onclick="onBlankShowAnswer(\'' + bid + '\')">Show answer</button>' +
      '<button class="btn-primary" onclick="onBlankCheck(\'' + bid + '\')">Check</button>';
  }

  return '<div class="panel blank-question">' +
    '<div class="q-meta mono"><span>' + escapeHtml(bid) + " &middot; " + moduleTag(b.m) + "</span>" + tierBadge(b.tier, b.prob) + "</div>" +
    '<div class="blank-sentence">' + sentence + "</div>" +
    hintHtml + revealedNote +
    '<div class="drill-progress mono muted">Item ' + (state.blanks.index + 1) + " / " + state.blanks.order.length + "</div>" +
    '<div class="drill-actions">' + actions + "</div>" +
  "</div>";
}

function renderBlanksSummary(){
  var s = computeBlanksScore();
  var byModule = {};
  state.blanks.order.forEach(function(id){
    var b = byId(BLANKS, id);
    var a = state.blanks.answers[id];
    if(!byModule[b.m]) byModule[b.m] = { correct: 0, total: 0 };
    byModule[b.m].total++;
    if(a && a.correct) byModule[b.m].correct++;
  });
  var weakest = null, weakestPct = 101;
  Object.keys(byModule).forEach(function(m){
    var d = byModule[m];
    var pct = d.total ? (d.correct / d.total) * 100 : 100;
    if(pct < weakestPct){ weakestPct = pct; weakest = m; }
  });
  var rows = Object.keys(byModule).sort().map(function(m){
    var d = byModule[m];
    var pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
    var mark = (m === weakest) ? ' <span class="badge badge-high">WEAKEST</span>' : "";
    return "<tr><td>" + moduleTag(m) + mark + "</td><td>" + d.correct + " / " + d.total + "</td><td>" + pct + "%</td></tr>";
  }).join("");

  var wrongCount = state.blanks.order.filter(function(id){ var a = state.blanks.answers[id]; return a && !a.correct; }).length;

  return '<div class="panel drill-summary">' +
    '<h3 class="block-h">Set complete — ' + s.correct + " / " + s.answered + " (" + s.pct + "%)</h3>" +
    '<p class="muted">Pass line is 80%. ' + (s.pct >= 80 ? "You cleared it on this set." : "Below pass line on this set — drill the weak module again.") + "</p>" +
    '<div class="table-wrap"><table><thead><tr><th>Module</th><th>Score</th><th>%</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<div class="drill-actions">' +
      '<button class="btn-primary" ' + (wrongCount ? "" : "disabled") + ' onclick="onBlanksRetry(\'wrong\')">Retry wrong only (' + wrongCount + ")</button>" +
    "</div>" +
  "</div>";
}

/* ===================== PAST ===================== */
function buildPastSet(subsetIds){
  var pool;
  if(subsetIds){
    pool = subsetIds.slice();
  } else {
    var list = PAST_QUESTIONS.slice();
    if(state.past.moduleFilter !== "all"){
      var m = state.past.moduleFilter;
      list = list.filter(function(q){ return q.m === m; });
    }
    if(state.past.tripleOnly) list = list.filter(function(q){ return q.freq >= 3; });
    list = list.slice().sort(function(a, b){ return b.freq - a.freq; });
    pool = list.map(function(q){ return q.id; });
  }
  state.past.order = pool;
  state.past.index = 0;
  state.past.answers = {};
}
function onPastSection(sec){
  state.past.section = sec;
  renderPast();
}
function onPastFilter(mod){
  state.past.moduleFilter = mod;
  buildPastSet();
  renderPast();
}
function onPastTripleToggle(){
  state.past.tripleOnly = !state.past.tripleOnly;
  buildPastSet();
  renderPast();
}
function onPastReset(){
  buildPastSet();
  renderPast();
}
function onPastOption(qid, idx){
  if(state.past.answers[qid]) return;
  var q = byId(PAST_QUESTIONS, qid);
  state.past.answers[qid] = { chosen: idx, correct: idx === q.a };
  renderPast();
}
function onPastNext(){
  state.past.index++;
  renderPast();
}
function onPastRetry(mode){
  var ids;
  if(mode === "wrong"){
    ids = state.past.order.filter(function(id){
      var a = state.past.answers[id];
      return a && !a.correct;
    });
  } else {
    ids = state.past.order.slice();
  }
  if(ids.length === 0) return;
  buildPastSet(ids);
  renderPast();
}
function onSubjReveal(sid){
  state.past.revealed[sid] = !state.past.revealed[sid];
  renderPast();
}
function pastBadge(freq, sat){
  if(freq === 0) return '<span class="badge badge-muted">DECK — not recalled</span>';
  return '<span class="badge badge-past">×' + freq + " &middot; " + sat.join(" &middot; ") + "</span>";
}

function renderPast(){
  var el = document.getElementById("tab-past");
  var seg = '<div class="segmented">' +
    '<button class="' + (state.past.section === "mcq" ? "seg-active" : "") + '" onclick="onPastSection(\'mcq\')">MCQ (33)</button>' +
    '<button class="' + (state.past.section === "subjective" ? "seg-active" : "") + '" onclick="onPastSection(\'subjective\')">Subjective (12)</button>' +
  "</div>";

  var intro = '<div class="panel"><p class="past-note">Four papers: three recalled sittings (24/03/2026, 11/05/2026, 25/05/2026) plus the official Confluence sample (18/09/2026). The official sample is the examiner\'s own practice material — where a recollection disagrees with it, trust the sample. This is the highest-value tab in the app — the best available predictor of what you\'ll actually see.</p>' + seg + "</div>";

  var body;
  if(state.past.section === "mcq") body = renderPastMcq();
  else body = renderPastSubjective();

  el.innerHTML = intro + body;
  if(state.scoreMode === "past") updateScoreStrip();
}

function renderPastMcq(){
  var chips = ["all", 1, 2, 3].map(function(m){
    var label = m === "all" ? "All" : moduleTag(m);
    var active = state.past.moduleFilter === m;
    return '<button class="chip' + (active ? " chip-active" : "") + '" onclick="onPastFilter(\'' + m + '\')">' + label + "</button>";
  }).join("");

  var head = '<div class="panel drill-controls">' +
    '<div class="chip-row">' + chips + "</div>" +
    '<div class="drill-toggles">' +
      '<button class="chip' + (state.past.tripleOnly ? " chip-active" : "") + '" onclick="onPastTripleToggle()">×3+ only</button>' +
      '<button class="chip chip-ghost" onclick="onPastReset()">Reset</button>' +
    "</div>" +
  "</div>";

  var body;
  if(state.past.order.length === 0){
    body = '<div class="panel"><p class="muted">No past questions match this filter.</p></div>';
  } else if(state.past.index >= state.past.order.length){
    body = renderPastSummary();
  } else {
    body = renderPastQuestion();
  }
  return head + body;
}

function renderPastQuestion(){
  var qid = state.past.order[state.past.index];
  var q = byId(PAST_QUESTIONS, qid);
  var a = state.past.answers[qid];

  var optsHtml = q.opts.map(function(opt, idx){
    var cls = "option";
    if(a){
      if(idx === q.a) cls += " opt-correct";
      else if(idx === a.chosen) cls += " opt-wrong";
    }
    var disabled = a ? " disabled" : "";
    return '<button class="' + cls + '" ' + disabled + ' onclick="onPastOption(\'' + qid + "', " + idx + ')">' +
      '<span class="opt-letter mono">' + String.fromCharCode(65 + idx) + "</span>" +
      '<span class="opt-text">' + escapeHtml(opt) + "</span>" +
    "</button>";
  }).join("");

  var why = a ? '<div class="why-line">' + escapeHtml(q.why) + "</div>" : "";
  var nextBtn = a ? '<button class="btn-primary" onclick="onPastNext()">Next →</button>' : "";

  return '<div class="panel drill-question">' +
    '<div class="q-meta mono">' +
      '<span>' + escapeHtml(qid) + " &middot; " + moduleTag(q.m) + "</span>" +
      pastBadge(q.freq, q.sat) +
    "</div>" +
    '<p class="q-text">' + escapeHtml(q.q) + "</p>" +
    '<div class="opt-list">' + optsHtml + "</div>" +
    why +
    '<div class="drill-progress mono muted">Question ' + (state.past.index + 1) + " / " + state.past.order.length + "</div>" +
    '<div class="drill-actions">' + nextBtn + "</div>" +
  "</div>";
}

function renderPastSummary(){
  var s = computePastScore();
  var byModule = {};
  state.past.order.forEach(function(id){
    var q = byId(PAST_QUESTIONS, id);
    var a = state.past.answers[id];
    if(!byModule[q.m]) byModule[q.m] = { correct: 0, total: 0 };
    byModule[q.m].total++;
    if(a && a.correct) byModule[q.m].correct++;
  });
  var rows = Object.keys(byModule).sort().map(function(m){
    var d = byModule[m];
    var pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
    return "<tr><td>" + moduleTag(m) + "</td><td>" + d.correct + " / " + d.total + "</td><td>" + pct + "%</td></tr>";
  }).join("");
  var wrongCount = state.past.order.filter(function(id){ var a = state.past.answers[id]; return a && !a.correct; }).length;

  return '<div class="panel drill-summary">' +
    '<h3 class="block-h">Set complete — ' + s.correct + " / " + s.answered + " (" + s.pct + "%)</h3>" +
    '<p class="muted">This is the best available predictor of real exam performance. Pass line is 80%.</p>' +
    '<div class="table-wrap"><table><thead><tr><th>Module</th><th>Score</th><th>%</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<div class="drill-actions">' +
      '<button class="btn-primary" ' + (wrongCount ? "" : "disabled") + ' onclick="onPastRetry(\'wrong\')">Retry wrong only (' + wrongCount + ")</button>" +
    "</div>" +
  "</div>";
}

function renderPastSubjective(){
  var cards = PAST_SUBJECTIVE.map(function(s){
    var revealed = !!state.past.revealed[s.id];
    return '<div class="panel subj-card">' +
      '<div class="q-meta mono"><span>' + escapeHtml(s.id) + "</span>" + pastBadge(s.freq, s.sat) + "</div>" +
      '<div class="subj-q">' + escapeHtml(s.q) + "</div>" +
      (revealed ? '<div class="subj-answer">' + escapeHtml(s.a) + "</div>" : "") +
      '<div class="drill-actions"><button class="btn-ghost" onclick="onSubjReveal(\'' + s.id + '\')">' + (revealed ? "Hide" : "Reveal") + " model answer</button></div>" +
    "</div>";
  }).join("");
  return '<div class="panel"><p class="muted">Self-assessment only — not scored. 20 of the 100 marks live here.</p></div>' + cards;
}

/* ===================== STUDY ===================== */
function onStudySearch(value){
  state.searchTerm = value.trim();
  renderStudy();
}
function onStudyToggle(n){
  state.study.open[n] = !state.study.open[n];
  renderStudy();
}
function renderStudy(){
  var el = document.getElementById("tab-study");
  var term = state.searchTerm;
  var badgeClass = { Easy: "badge-easy", Medium: "badge-medium", High: "badge-high" };

  var head = '<div class="panel">' +
    '<label class="mono search-label" for="studySearch">Search study content, cards &amp; cheat sheet</label>' +
    '<input id="studySearch" type="search" class="search-input" placeholder="e.g. IQR, Veracity, Chi-Square…" value="' + escapeHtml(term) + '" oninput="onStudySearch(this.value)">' +
  "</div>";

  var modulesHtml = STUDY.map(function(mod){
    var rendered = renderBlocks(mod.blocks, term);
    if(term && !rendered.anyMatch) return "";
    var isOpen = term ? true : !!state.study.open[mod.n];
    return '<div class="panel module">' +
      '<button class="module-header" onclick="onStudyToggle(' + mod.n + ')" aria-expanded="' + isOpen + '">' +
        '<span class="module-title"><span class="mono module-num">M' + mod.n + "</span> " + hl(mod.title, term) + "</span>" +
        '<span class="badge ' + badgeClass[mod.complexity] + '">' + mod.complexity + "</span>" +
        '<span class="module-meta">Past papers: ' + mod.pastFreq + " &middot; Study priority: " + mod.priority + "</span>" +
        '<span class="chevron">' + (isOpen ? "−" : "+") + "</span>" +
      "</button>" +
      (isOpen ? '<div class="module-body">' + rendered.html + "</div>" : "") +
    "</div>";
  }).join("");

  if(term && modulesHtml.trim() === ""){
    modulesHtml = '<div class="panel"><p class="muted">No study content matches “' + escapeHtml(term) + '”.</p></div>';
  }

  el.innerHTML = head + modulesHtml;
  var input = document.getElementById("studySearch");
  if(input && document.activeElement !== input){
    var v = input.value;
    input.focus();
    input.setSelectionRange(v.length, v.length);
  }
}

/* ===================== CARDS ===================== */
function onCardsDeck(deck){
  state.cards.deck = deck;
  state.cards.index = 0;
  state.cards.flipped = false;
  renderCards();
}
function currentDeckList(){
  var term = state.searchTerm;
  var list = CARDS[state.cards.deck];
  if(!term) return list;
  return list.filter(function(c){ return textMatches(c.f, term) || textMatches(c.b, term); });
}
function onCardsFlip(){
  state.cards.flipped = !state.cards.flipped;
  renderCards();
}
function onCardsNav(delta){
  var list = currentDeckList();
  if(list.length === 0) return;
  state.cards.index = (state.cards.index + delta + list.length) % list.length;
  state.cards.flipped = false;
  renderCards();
}
function onCardKeydown(e){
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); onCardsFlip(); }
  else if(e.key === "ArrowRight"){ onCardsNav(1); }
  else if(e.key === "ArrowLeft"){ onCardsNav(-1); }
}
var touchStartX = null;
function onCardTouchStart(e){ touchStartX = e.changedTouches[0].clientX; }
function onCardTouchEnd(e){
  if(touchStartX === null) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 40){ onCardsNav(dx < 0 ? 1 : -1); }
  touchStartX = null;
}
function renderCards(){
  var el = document.getElementById("tab-cards");
  var term = state.searchTerm;

  var deckBtns = CARD_DECKS.map(function(d){
    var active = state.cards.deck === d[0];
    return '<button class="chip' + (active ? " chip-active" : "") + '" onclick="onCardsDeck(\'' + d[0] + '\')">' + d[1] + "</button>";
  }).join("");

  var head = '<div class="panel"><div class="chip-row">' + deckBtns + "</div></div>";

  var list = currentDeckList();
  var body;
  if(list.length === 0){
    body = '<div class="panel"><p class="muted">No cards match “' + escapeHtml(term) + '” in this deck.</p></div>';
  } else {
    if(state.cards.index >= list.length) state.cards.index = 0;
    var card = list[state.cards.index];
    var counter = String(state.cards.index + 1).padStart(2, "0") + " / " + String(list.length).padStart(2, "0");
    var isSubjective = state.cards.deck === "subjective";
    body = '<div class="panel cards-panel">' +
      '<div class="cards-counter mono muted">' + counter + "</div>" +
      '<div class="flashcard' + (state.cards.flipped ? " is-flipped" : "") + (isSubjective ? " flashcard-tall" : "") + '" tabindex="0" role="button" ' +
        'aria-label="Flashcard, press space or enter to flip, arrow keys to navigate" ' +
        'onclick="onCardsFlip()" onkeydown="onCardKeydown(event)" ontouchstart="onCardTouchStart(event)" ontouchend="onCardTouchEnd(event)">' +
        '<div class="flashcard-face flashcard-front"><div class="flashcard-scroll">' + hl(card.f, term) + "</div></div>" +
        '<div class="flashcard-face flashcard-back"><div class="flashcard-scroll">' + hl(card.b, term) + "</div></div>" +
      "</div>" +
      '<div class="cards-nav">' +
        '<button class="btn-ghost" onclick="onCardsNav(-1)" aria-label="Previous card">← Prev</button>' +
        '<button class="btn-ghost" onclick="onCardsFlip()">Flip</button>' +
        '<button class="btn-ghost" onclick="onCardsNav(1)" aria-label="Next card">Next →</button>' +
      "</div>" +
    "</div>";
  }
  el.innerHTML = head + body;
  var fc = el.querySelector(".flashcard");
  if(fc) fc.focus({ preventScroll: true });
}

/* ===================== CHEAT ===================== */
function renderCheat(){
  var el = document.getElementById("tab-cheat");
  var term = state.searchTerm;
  var rendered = renderBlocks(CHEAT_BLOCKS, term);
  var html = rendered.html;
  if(term && !rendered.anyMatch){
    html = '<p class="muted">No cheat-sheet lines match “' + escapeHtml(term) + '”.</p>';
  }
  el.innerHTML = '<div class="panel cheat-sheet">' +
    '<h2 class="block-h cheat-title">DX Level 1 — Cheat Sheet</h2>' +
    html +
  "</div>";
}

/* ===================== CHECK ===================== */
function renderCheck(){
  var el = document.getElementById("tab-check");
  var cards = CHECK_CLAIMS.map(function(c){
    var riskClass = c.risk.indexOf("High") === 0 ? "badge-high" : (c.risk.indexOf("Medium") === 0 ? "badge-medium" : "badge-easy");
    return '<div class="panel check-card">' +
      '<div class="check-claim">' + escapeHtml(c.claim) + "</div>" +
      '<div class="check-deck"><span class="mono muted">DECK SAYS:</span> ' + escapeHtml(c.deck) + "</div>" +
      '<span class="badge ' + riskClass + '">' + c.risk + " risk</span>" +
    "</div>";
  }).join("");

  var conflictCards = CHECK_CONFLICTS.map(function(c){
    return '<div class="panel check-card">' +
      '<div class="check-claim">' + escapeHtml(c.title) + "</div>" +
      '<div class="check-deck">' + escapeHtml(c.detail) + "</div>" +
      '<div class="check-resolution"><span class="mono muted">USE:</span> ' + escapeHtml(c.resolution) + "</div>" +
    "</div>";
  }).join("");

  el.innerHTML = '<div class="panel check-note">' +
    "<p>The exam is stated to be based only on the training materials provided. These claims appear in the compiled notes but do not trace to the source deck. Treat them with caution.</p>" +
  "</div>" + cards +
  '<h3 class="block-h">Conflicts inside the past papers</h3>' +
  '<div class="panel check-note"><p>Four papers — three recalled real-exam sittings plus the official Confluence sample — sometimes disagree with each other or with the deck. Here is how to resolve each one.</p></div>' +
  conflictCards;
}

/* ===================== boot ===================== */
QUESTIONS.forEach(function(q){ q.prob = probFor(q); });
BLANKS.forEach(function(b){ b.prob = probFor(b); });
CARDS.subjective = PAST_SUBJECTIVE.map(function(s){ return { f: s.q, b: s.a }; });

document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ onTabSwitch(btn.dataset.tab); });
});
buildDrillSet();
buildBlanksSet();
buildPastSet();
renderPast();

</script>
</body>
</html>
